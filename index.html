        if (briars.length && foe.units.length) {
          const top = foe.units.slice().sort((a, c) => strength(c, foe) - strength(a, foe))[0];
          briars.forEach(u => { u.target = top; if (u.level === 3) top.hex += T.briarHex; });
        }
      }
      for (let si = 0; si < 2; si++) {
        const me = b.sides[si], foe = b.sides[1 - si];
        updateStolen(me.team, foe.team);
        me.units.forEach(u => { setSpeed(u); u.next = u.interval * u.first; });
      }
      for (let si = 0; si < 2; si++) if (b.sides[si].team.foeDelay) delayTeam(b.sides[1 - si].team, b.sides[si].team.foeDelay);
    }
    // Level 3 Changeling: the copied enemy unit's first attack comes later (counts toward that unit's delay cap).
    copied.forEach(f => { const add = Math.max(0, Math.min(T.changeDelay, DELAY_CAP - f.delayed)); f.delayed += add; f.next += add; });

    // Delay one enemy unit (Briar Archer, Gloamstalker level 3), within DELAY_CAP per unit per fight.
    const delayOne = (f, sec, events, si) => {
      const add = Math.max(0, Math.min(sec, DELAY_CAP - f.delayed));
      if (add > 0) { f.delayed += add; f.next += add; events.push({ side: 1 - si, uid: f.uid, kind: 'delay', value: add, one: true }); }
    };
    // On-hit effects of the merge pass units (u just hit for its attack).
    function onHit(u, side, si, events, dmg, heal, ward) {
      const team = side.team, t = b.t;
      if (u.id === 'stonemason') { const v = side.max * L(u, ...T.mason) * team.shieldMult; ward[si] += v; events.push({ side: si, uid: u.uid, kind: 'ward', value: v }); }
      if (u.id === 'briararcher' && u.target) delayOne(u.target, L(u, ...T.briar), events, si);
      if (u.id === 'gloamstalker' && u.level === 3) {
        const nx = side.foe.units.filter(f => f.delayed < DELAY_CAP - 1e-9).sort((a, c) => a.next - c.next)[0];
        if (nx) delayOne(nx, T.gloomL3, events, si);
      }
      if (u.id === 'warpainter' && u.level === 3 && u.attacks % T.bannerL3Every === 0) {
        side.units.forEach(a => { a.atkPct += T.bannerL3; events.push({ side: si, uid: a.uid, kind: 'buff', value: T.bannerL3, pct: true }); });
      }
      if (u.id === 'spearhurler' && u.level === 3) u.adj.forEach(a => { a.atkPct += T.spearL3; events.push({ side: si, uid: a.uid, kind: 'buff', value: T.spearL3, pct: true }); });
      {
        // Leafmender: every hit of any of your units heals a little (all Leafmenders add up; the heal is shown on the first Leafmender).
        if (team.leaf > 0) { const v = side.max * team.leaf; heal[si] += v; const lm = side.units.find(a => a.id === 'leafmender'); events.push({ side: si, uid: lm.uid, kind: 'heal', value: v, minor: true }); }
        // Windrunner: free arrow after N hits of your other units, any race (level 3: its own hits count too). Free arrows do not count.
        team.runners.forEach(w => {
          if (w === u && w.level < 3) return;
          w.wc++;
          const need = L(w, ...T.run);
          if (w.wc >= need) {
            w.wc -= need;
            const v = atkValue(w, side, t);
            dmg[1 - si] += v;
            events.push({ side: si, uid: w.uid, kind: 'attack', value: v, bolt: true, free: true });
          }
        });
      }
    }
    // Advances the fight by dt seconds and returns what happened, for the UI to animate.
    // Fight statistics for the UI: per side, uid -> { dmg: attack damage dealt, heal: health restored, ward: shield granted }.
    b.stats = [{}, {}];
    b.step = function (dt) {
      if (b.over) return [];
      b.t = Math.round((b.t + dt) * 1000) / 1000;
      const events = [];
      const dmg = [0, 0];   // damage dealt TO side i
      const heal = [0, 0];
      const ward = [0, 0];  // shield gained by side i this tick
      const slowAdd = [0, 0]; // extra slow put ON side i this tick (Fae)
      const delayAdd = [0, 0]; // delay put ON side i this tick (Fae)
      for (let si = 0; si < 2; si++) {
        const side = b.sides[si];
        // Units whose speed changes every tick (Clockwork wind-up; a level 3 Steam Titan can add wind-up mid-fight).
        for (const u of side.units) {
          if (!(u.wind > 0)) continue;
          const w = windAt(u, b.t);
          if (w !== u.windBonus) { u.windBonus = w; respeed(u, b.t); }
        }
        for (const u of side.units) {
          // War Drummer: every few seconds, adjacent (level 2+: and diagonal) units get attack for the fight.
          if (u.beat !== undefined && b.t + 1e-9 >= u.beat) {
            u.beat += T.drumEvery;
            (u.level === 1 ? u.adj : u.near).forEach(a => { a.atkPct += T.drum; events.push({ side: si, uid: a.uid, kind: 'buff', value: T.drum, pct: true }); });
          }
          // Puffcap: every few seconds the enemy is slowed a bit more for the fight.
          if (u.puff !== undefined && b.t + 1e-9 >= u.puff) { u.puff += T.puffGap; slowAdd[1 - si] += L(u, ...T.puff); }
          let guard = 0;
          while (b.t + 1e-9 >= u.next && guard++ < 5) {
            u.next += u.interval;
            if (u.def.kind === 'heal') {
              const v = healValue(u, side);
              if (u.def.ward) {
                ward[si] += v;
                events.push({ side: si, uid: u.uid, kind: 'ward', value: v });
                if (u.level === 3) side.units.forEach(a => { if (isRace(a, 'Dwarf')) a.buffAtk += 1; });
              } else {
                heal[si] += v;
                events.push({ side: si, uid: u.uid, kind: 'heal', value: v });
              }
              const mh = u.id === 'moonpriestess' ? L(u, ...T.moonHaste) : 0;
              if (mh) side.units.forEach(a => { if (isRace(a, 'Elf') || side.team.elfAll) { a.speedBonus += mh; a.elfSpeed += mh; setSpeed(a); } });
              const ds = u.id === 'dryad' ? L(u, ...T.dryadSlow) : 0;
              if (ds) slowAdd[1 - si] += ds;
            } else {
              u.attacks++;
              let v = atkValue(u, side, b.t);
              let bolt = false;
              if (u.id === 'spellweaver' && u.attacks % L(u, 2, 2, 1) === 0) { v += L(u, ...T.spell) * side.team.count.Elf; bolt = true; }
              if (u.id === 'crossbowman' && u.level === 3 && u.attacks % 4 === 0) v *= 2;
              // Knight charge: the first hit (level 3: also every 4th) deals extra damage per different race.
              if (u.id === 'knight' && (u.attacks === 1 || (u.level === 3 && u.attacks % 4 === 0))) { v += L(u, ...T.knightCharge) * side.team.diff; bolt = true; }
              if (u.id === 'brassmagus' && u.level === 3 && u.attacks % 2 === 0) { v += 2 * side.team.count.Clockwork; bolt = true; }
              if (u.id === 'runesmith' && u.level === 3) v += 0.1 * side.shield;
              if (u.id === 'magmadrake') {
                if (u.level === 3) side.shield += side.max * 0.04 * side.team.shieldMult;
                const add = side.shield * T.magmaHit;   // extra damage from your shield; the shield stays
                v += add; bolt = add > 0;
              }
              if (u.id === 'twilightdrake') {
                slowAdd[1 - si] += L(u, 0.05, 0.07, 0.07);
                if (u.level === 3 && u.attacks % 3 === 0) delayAdd[1 - si] += 0.5;
              }
              dmg[1 - si] += v;
              events.push({ side: si, uid: u.uid, kind: 'attack', value: v, bolt });
              onHit(u, side, si, events, dmg, heal, ward);
              if (u.id === 'wizard' && u.attacks % L(u, 2, 1, 1) === 0) {
                const amt = L(u, 2, 2, 3);
                (u.level === 3 ? u.near : u.adj).forEach(a => { a.buffAtk += amt; events.push({ side: si, uid: a.uid, kind: 'buff', value: amt }); });
              }
              // Level 3 Bladedancer: each hit speeds up the other Elves (up to a maximum per Bladedancer).
              if (u.id === 'bladedancer' && u.level === 3 && u.given < T.dancerMax - 1e-9) {
                const add = Math.min(T.dancerL3, T.dancerMax - u.given);
                u.given += add;
                side.units.forEach(a => { if (a !== u && (isRace(a, 'Elf') || side.team.elfAll)) { a.speedBonus += add; a.elfSpeed += add; respeed(a, b.t); events.push({ side: si, uid: a.uid, kind: 'buff', value: 0 }); } });
              }
              // Level 3 Steam Titan: each hit gives adjacent units (any race) more wind-up.
              if (u.id === 'steamtitan' && u.level === 3) {
                u.adj.forEach(a => { a.wind += T.titanL3; events.push({ side: si, uid: a.uid, kind: 'buff', value: 0 }); });
              }
              // Level 3 Prismatic Wyrm (Wyrm Chorus): each Dragon hit gives the other Dragons attack speed for the fight (capped per Dragon).
              if (side.team.prism >= 3 && u.def.cls === 'Dragon') {
                side.units.forEach(a => {
                  if (a === u || a.def.cls !== 'Dragon' || (a.chorus || 0) >= T.prismChorusMax - 1e-9) return;
                  const add = Math.min(T.prismChorus, T.prismChorusMax - (a.chorus || 0));
                  a.chorus = (a.chorus || 0) + add; a.speedBonus += add; respeed(a, b.t);
                  events.push({ side: si, uid: a.uid, kind: 'buff', value: 0 });
                });
              }
            }
          }
        }
      }
      for (let si = 0; si < 2; si++) {
        const s = b.sides[si];
        let d = dmg[si];
        let broke = false;
        if (s.shield > 0 && d > 0) {
          const a = Math.min(s.shield, d); s.shield -= a; d -= a; s.team.absorbed += a;
          if (s.shield <= 1e-9) broke = true;
        }
        // Knight level 2+: a broken shield comes back once.
        if (s.shield <= 0 && s.reshield.length && dmg[si] > 0) {
          s.shield = s.reshield.shift();
          events.push({ side: si, kind: 'reshield', value: s.shield });
          const a = Math.min(s.shield, d); s.shield -= a; d -= a; s.team.absorbed += a;
          if (a > 0 && s.shield <= 1e-9) broke = true;
        }
        s.hp -= d;
        if (s.hp > 0 && heal[si] > 0) {
          const over = s.hp + heal[si] - s.max;
          s.hp = Math.min(s.max, s.hp + heal[si]);
          // Priest: healing beyond full health becomes shield.
          if (over > 0 && s.team.overheal) s.shield += over * s.team.shieldMult;
        }
        if (ward[si] > 0) s.shield += ward[si];
        // Slayer: strikes at once when the shield breaks.
        if (broke) {
          events.push({ side: si, kind: 'shieldbreak' });
          s.units.forEach(u => { if (u.id === 'bulwark') u.next = Math.min(u.next, b.t + CFG.tick); });
        }
      }
      // Fae effects that happened this tick.
      for (let si = 0; si < 2; si++) {
        if (slowAdd[si] > 0) { slowTeam(b.sides[si].team, slowAdd[si], b.t); events.push({ side: si, kind: 'slow', value: b.sides[si].team.slowed }); }
        if (delayAdd[si] > 0) { delayTeam(b.sides[si].team, delayAdd[si]); events.push({ side: si, kind: 'delay', value: delayAdd[si] }); }
      }
      if (slowAdd[0] > 0 || slowAdd[1] > 0) for (let si = 0; si < 2; si++) updateStolen(b.sides[si].team, b.sides[1 - si].team, b.t);
      const pDead = b.sides[0].hp <= 0, eDead = b.sides[1].hp <= 0;
      if (pDead || eDead) {
        b.over = true;
        if (pDead && eDead) {
          // Both bars emptied in the same tick: the side that overshot less wins.
          const p = b.sides[0].hp, e = b.sides[1].hp;
          b.result = Math.abs(p - e) < 1e-6 ? 'draw' : p > e ? 'win' : 'loss';
        } else {
          b.result = pDead ? 'loss' : 'win';
        }
      } else if (b.t >= CFG.maxTime) {
        b.over = true; b.timeout = true;
        const p = b.sides[0].hp, e = b.sides[1].hp;
        b.result = Math.abs(p - e) < 1e-6 ? 'draw' : p > e ? 'win' : 'loss';
      }
      for (const e of events) {
        if (e.uid == null || (e.kind !== 'attack' && e.kind !== 'heal' && e.kind !== 'ward')) continue;
        const st = b.stats[e.side][e.uid] || (b.stats[e.side][e.uid] = { dmg: 0, heal: 0, ward: 0 });
        st[e.kind === 'attack' ? 'dmg' : e.kind] += e.value;
      }
      return events;
    };
    return b;
  }

  function runBattle(b) {
    let n = 0;
    while (!b.over && n++ < 5000) b.step(CFG.tick);
    return b.result;
  }

  // ----------------------------------------------------------- AI opponents
  // ======== ENEMY TUNING (temporary) ========
  // Everything that sets how strong the generated enemy teams are lives in this block. It is a stand-in until you fight
  // other players' ghosts (saved boards); then generateEnemy and this block can go. The tutorial supplies its own enemies
  // (script.enemy) and never comes through here. The health bar is NOT part of this: it is the same for both sides.
  const GT = root.GAME_TUNE || {};   // test hook (balance scripts), unused in the game
  // Team size by round (round 1, 2, 3...); a full 6 after the list ends.
  const ENEMY_COUNT = GT.enemyCount || [0, 2, 3, 4, 6];
  // Tier odds for enemy units. null = use the shop table (TIER_ODDS).
  const ENEMY_TIER_ODDS = GT.enemyOdds || null;
  // Chance that an enemy unit is level 3 / level 2 grows smoothly with the round.
  // Level 2 chance: +13% per round from round 2, at most 68%. Level 3 chance: +6.5% per round from round 4, at most 49%.
  // History: level 2 was +10% / max 65% while Siege Engines existed (an enemy siege took 2 cells, so late enemy teams
  // averaged about 5.3 units), then +8.5% / max 52% (level 3: +5% / max 40%) with 1-cell units only. It went up again with the
  // softer shop tier odds (fewer tier 4-5, more tier 1-3): players now merge cheap units to level 3 far more often, enemies
  // do not merge, so they get these extra levels instead. Most of the raise is on level 2, which bites in rounds 3-7;
  // raising level 3 instead hits the late game, where focused (one-race) boards are strongest, and flattened their edge.
  // Signpost pass: level 2 was +12.5% / max 66%. Lowered to +10.5% / max 58% because the tier 3 signposts now grow with units of
  // other races, and random enemy teams are almost always mixed, so enemy signposts got stronger.
  // Core pass: level 2 +13% / max 68%, level 3 +6.5% / max 49% (was +10.5% / 58% and +5.5% / 44%). The five strong tier 3 signposts
  // left the shop and the enemy tables (they are Cores now), so random enemy teams lost them, and players merge the remaining
  // tier 3 units more easily. Enemy teams do get one Core from CFG.coreRound (see generateEnemy).
  const ENEMY_L2 = GT.enemyL2 || [0.13, 0.68], ENEMY_L3 = GT.enemyL3 || [0.065, 0.49];
  // Expensive units level up more slowly, as they would for a player: tier 4 at 40% and tier 5 at 30% of the usual chance,
  // the Prismatic Wyrm (tier 6) at 20%.
  const ENEMY_LEVEL_RATE = GT.enemyRate || [0, 1, 1, 1, 0.4, 0.3, 0.2];
  // From round T.prismRound each enemy unit has a T.prismEnemy chance to be a Prismatic Wyrm (at most one per team). Kept low:
  // the generator is temporary, and a Wyrm only matters on an enemy team that also rolled Dragons.
  // Ranked leagues (see rank.js): enemies are always in the player's league and get stronger with it.
  //   lv = multiplier on the level 2 / level 3 chances above (1 = as above; below 1 = fewer merged enemy units)
  //   up = after that, chance that an enemy unit (below level 3) gets one extra level
  // No league (tutorial, tests, old saves) = exactly the numbers above. Tuned with the generic bot (tests/playtest.js, LEAGUE=...)
  // to clear 10 wins about: Iron 60%, Bronze 50%, Silver 40%, Gold 30%, Platinum 20%, Diamond 12%, Warlord 6%.
  //   gold = budget factor (CFG.enemyBudget): the enemy team may spend this share of the gold a player has been given so far
  //   (lv / up only matter with CFG.enemyBudget off, the old free level rolls)
  const LEAGUE_ENEMY = Object.assign({
    Iron:     { gold: 0.63, lv: 0.78, up: 0 },
    Bronze:   { gold: 0.65, lv: 0.86, up: 0 },
    Silver:   { gold: 0.67, lv: 0.93, up: 0 },
    Gold:     { gold: 0.695, lv: 1.01, up: 0 },
    Platinum: { gold: 0.72, lv: 1.13, up: 0 },
    Diamond:  { gold: 0.75, lv: 1.25, up: 0 },
    Warlord:  { gold: 0.78, lv: 1.35, up: 0.05 },
  }, GT.leagueEnemy || {});
  // Budget enemies: factor with no league (tutorial never comes here; tests), most copies of one unit per team, and how many gold
  // a secondary unit's upgrade is penalised by (so the comp's core units are levelled first).
  const ENEMY_GOLD = GT.enemyGold || 0.695, ENEMY_MAX_COPIES = 2, ENEMY_PRIO_GOLD = 4;
  // ======== end of ENEMY TUNING ========
  function pickLevel(round, rng, tier, league) {
    const f = ENEMY_LEVEL_RATE[tier] || 1;
    const L = (league && LEAGUE_ENEMY[league]) || null;
    let p3 = f * Math.min(ENEMY_L3[1], Math.max(0, (round - 3) * ENEMY_L3[0]));
    let p2 = f * Math.min(ENEMY_L2[1], Math.max(0, (round - 1) * ENEMY_L2[0]));
    if (L) { p3 = Math.min(1, p3 * L.lv); p2 = Math.min(1 - p3, p2 * L.lv); }
    const r = rng();
    let lvl = r < p3 ? 3 : r < p3 + p2 ? 2 : 1;
    if (L && L.up > 0 && lvl < 3 && rng() < L.up) lvl++;
    return lvl;
  }

  // ======== ENEMY COMPS ========
  // Enemy teams follow a comp, like a real player would. Each comp says which race goes in every board slot; the units
  // themselves (tier, level) are still rolled as before. From CFG.coreRound the team also has one Core.
  //   splash  cheap support units of all its races (early rounds only)
  //   mono    a full board of one race (not Human). Mono Elf takes the Elf Core; other monos take the Core of another race,
  //           which grows with the mono units (a real player would do the same). The Core of Elf only helps Elves, so it is skipped there.
  //   core    one Core of race A, every other unit of its other races
  //   pair    3 + 3 of two races (with a Core: the Core of the third race takes one slot)
  //   main    4 + 2: a main race and a second race (with a Core: the Core of the second race)
  //   dragon  the Dragons of its races (sometimes a Prismatic Wyrm) plus units of those races (from COMP_DRAGON_ROUND)
  // Weights by league: low leagues see more loose comps (splash, core, pair, main), high leagues more finished mono and dragon
  // builds. t = league position from 0 (Iron) to 1 (Warlord); no league (tutorial, tests) = 0.5.
  const LEAGUE_ORDER = ['Iron', 'Bronze', 'Silver', 'Gold', 'Platinum', 'Diamond', 'Warlord'];
  const COMP_SPLASH_ROUNDS = 4, COMP_DRAGON_ROUND = 8;
  const COMP_WEIGHTS = GT.compWeights || {
    splash: t => 3 - 2 * t,         // only in rounds 1 to COMP_SPLASH_ROUNDS
    mono: t => 1 + 3 * t,
    core: t => 2.5 - t,
    pair: t => 2.5 - t,
    main: t => 2 - 0.5 * t,
    dragon: t => 0.3 + 2.2 * t,     // only from round COMP_DRAGON_ROUND
  };
  function pickComp(round, rng, league, races) {
    const li = LEAGUE_ORDER.indexOf(league);
    const t = li >= 0 ? li / (LEAGUE_ORDER.length - 1) : league === 'Tutorial' ? 0 : 0.5;   // the tutorial plays like Iron's comps
    const ok = {
      splash: round <= COMP_SPLASH_ROUNDS,
      mono: races.some(r => r !== 'Human'),
      core: races.length >= 2, pair: races.length >= 2, main: races.length >= 2,
      dragon: round >= COMP_DRAGON_ROUND,
    };
    const list = Object.keys(COMP_WEIGHTS).filter(k => ok[k]).map(k => [k, Math.max(0, COMP_WEIGHTS[k](t))]);
    let r = rng() * list.reduce((n, x) => n + x[1], 0);
    for (const [k, w] of list) { if ((r -= w) < 0) return k; }
    return list[list.length - 1][0];
  }
  const shuffled = (a, rng) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // Enemy placement, like a player would do it: the units that help their neighbours (adjacency supports) go to the two middle
  // cells (1 and 4, each next to three cells), and the hardest hitters go next to the strongest support. No random draws.
  const HUB = { grunt: 2, shaman: 3, drummer: 2, crier: 1.5, sentinel: 1.5, lookout: 1, brassmagus: 2, shieldskald: 1.5,
    wizard: 2, repeater: 1, automaton: 1 };
  const HUB_L3 = { militiaman: 1, lionheart: 1, spearhurler: 1, steamtitan: 1, skullsplitter: 1, brute: 1, cogling: 1, arbalest: 0.5, pathfinder: 0.5 };
  function placeEnemy(slots) {
    const hub = x => (HUB[x.id] || 0) * (x.level >= 2 ? 1.3 : 1) + (x.level === 3 ? HUB_L3[x.id] || 0 : 0);
    const hit = x => (BY_ID[x.id].kind === 'heal' ? 0 : BY_ID[x.id].atk * MULT[x.level] / BY_ID[x.id].interval);
    const hubs = slots.filter(x => hub(x) > 0).sort((a, c) => hub(c) - hub(a)).slice(0, 2);
    if (!hubs.length || slots.some(x => BY_ID[x.id].w !== 1)) return;
    const rest = slots.filter(x => !hubs.includes(x)).sort((a, c) => hit(c) - hit(a));
    hubs[0].cell = 1;
    if (hubs[1]) hubs[1].cell = 4;
    const cells = hubs[1] ? [0, 2, 3, 5] : [0, 2, 4, 3, 5];
    rest.forEach((x, i) => { x.cell = cells[i]; });
  }

  // The tutorial's free play rounds (round 6 on): weaker than Iron, it is a player's first game. Not a ranked league.
  const TUTORIAL_ENEMY = { gold: 0.58 };
  // Gold an enemy team may spend in this round: what a player has been given so far (goldFor of every round up to this one),
  // times the league's factor (LEAGUE_ENEMY[league].gold; no league: ENEMY_GOLD).
  const enemyBudget = (round, league) => {
    let g = 0;
    for (let r = 1; r <= round; r++) g += goldFor(r);
    const L = league && (LEAGUE_ENEMY[league] || (league === 'Tutorial' ? TUTORIAL_ENEMY : null));
    return g * (L && L.gold !== undefined ? L.gold : ENEMY_GOLD);
  };
  // Buys an enemy team like a player: one unit per plan entry (at most ENEMY_MAX_COPIES copies of a unit), cheaper units if the
  // budget is short, then levels with the gold left (level 2 = 3 copies, level 3 = 9 copies of the price; level 3 only for a unit the
  // team has once). The comp's core units (prio 0) get their levels first; the cheapest upgrade goes first, as merges do for a player.
  // Cores are free and stay level 1. Returns [{ d, level }].
  function buyEnemy(round, rng, league, races, plan) {
    const budget = enemyBudget(round, league);
    const cnt = {}, units = [];
    const add = (d, prio) => { cnt[d.id] = (cnt[d.id] || 0) + 1; units.push({ d, level: 1, prio, free: !!d.core }); };
    const pick = (tier, race) => {
      for (let k = 0; k < 6; k++) { const d = pickUnit(tier, rng, race, races); if (d && (cnt[d.id] || 0) < ENEMY_MAX_COPIES) return d; }
      return null;
    };
    plan.forEach(e => {
      if (units.length >= CELLS) return;
      let d;
      if (e.coreId) d = BY_ID[e.coreId];
      else if (e.wyrm) d = BY_ID[PRISM];
      else if (e.dragon) d = BY_TIER[5].find(x => x.race === e.dragon && !x.core) || pickUnit(5, rng, e.dragon, races);
      else d = pick(Math.min(e.cheap ? 2 : 9, rollTier(round, rng, ENEMY_TIER_ODDS)), e.race);
      if (d && (cnt[d.id] || 0) < ENEMY_MAX_COPIES) add(d, e.prio || 0);
    });
    const copies = [0, 1, 3, 9];
    const spent = () => units.reduce((n, u) => n + (u.free ? 0 : u.d.cost * copies[u.level]), 0);
    // Too expensive: swap the priciest unit for one a tier lower (same race); only tier 1 left: drop one.
    for (let guard = 0; spent() > budget && guard < 40; guard++) {
      const top = units.filter(u => !u.free && u.d.tier > 1).sort((a, c) => c.d.cost - a.d.cost)[0];
      if (!top) {
        const i = units.findIndex(u => !u.free);
        if (i < 0 || units.filter(u => !u.free).length <= 1) break;
        cnt[units[i].d.id]--; units.splice(i, 1); continue;
      }
      cnt[top.d.id]--;
      const nd = pick(Math.min(5, top.d.tier - 1), top.d.race === 'Neutral' ? null : top.d.race) || pick(1, null);
      if (!nd) { units.splice(units.indexOf(top), 1); continue; }
      cnt[nd.id] = (cnt[nd.id] || 0) + 1; top.d = nd;
    }
    let left = budget - spent();
    for (let guard = 0; guard < 40; guard++) {
      let best = null, bk = Infinity;
      units.forEach(u => {
        if (u.free || u.level >= MAX_LEVEL || (u.level === 2 && cnt[u.d.id] > 1)) return;
        const extra = u.d.cost * (copies[u.level + 1] - copies[u.level]);
        if (extra > left) return;
        const k = extra * (0.75 + 0.5 * rng()) + u.prio * ENEMY_PRIO_GOLD;
        if (k < bk) { bk = k; best = u; }
      });
      if (!best) break;
      left -= best.d.cost * (copies[best.level + 1] - copies[best.level]);
      best.level++;
    }
    return units;
  }

  // league (optional): a league name from LEAGUE_ENEMY; the enemy is tagged with it (enemy.league) for the UI.
  function generateEnemy(round, rng, league) {
    // Enemy team size by round (round 1, 2, 3...); a full 6 after the list ends.
    const n = ENEMY_COUNT[round] || 6;
    // Each enemy team follows the same rule as you: it draws from its own set of (at most) poolSize races.
    const races = pickRaces(rng, CFG.enemyPoolSize || CFG.poolSize);   // enemyPoolSize: test setting, 0 = same as poolSize
    const comp = pickComp(round, rng, league, races);
    const order = shuffled(races, rng);
    const withCore = CFG.coreEnemy && CFG.coreRound > 0 && round >= CFG.coreRound;
    // plan: one entry per board slot: { race } = a unit of that race, { core: race } = that race's Core,
    // { dragon: race } = that race's Dragon, { wyrm: true } = a Prismatic Wyrm.
    let plan = [], main = order[0], coreRace = null;
    const fill = (race, k) => { for (let i = 0; i < k; i++) plan.push({ race }); };
    if (comp === 'mono') {
      main = order.find(r => r !== 'Human');
      fill(main, n);
      if (main === 'Elf') coreRace = 'Elf';
      else coreRace = order.find(r => r !== main && r !== 'Elf') || null;
    } else if (comp === 'core') {
      coreRace = order[0]; main = order[1];
      const others = order.slice(1);
      for (let i = 0; i < n; i++) plan.push({ race: others[i % others.length] });
      if (!withCore) coreRace = null;
    } else if (comp === 'pair') {
      const a = order[0], b = order[1];
      for (let i = 0; i < n; i++) plan.push({ race: i % 2 ? b : a });
      coreRace = order[2] || b;
    } else if (comp === 'main') {
      const a = order[0], b = order[1];
      for (let i = 0; i < n; i++) plan.push({ race: i < Math.ceil(n * 2 / 3) ? a : b });
      coreRace = b;
    } else if (comp === 'dragon') {
      const drag = order.slice(0, rng() < 0.5 ? 2 : 3);
      drag.forEach(r => plan.push({ dragon: r }));
      if (rng() < 0.35) plan.push({ wyrm: true });
      for (let i = 0; plan.length < n; i++) plan.push({ race: drag[i % drag.length] });
      plan = plan.slice(0, n);
      coreRace = order[order.length - 1];
    } else {   // splash
      for (let i = 0; i < n; i++) plan.push({ race: order[i % order.length], cheap: true });
      coreRace = order[0];
    }
    // The Core: like a player, the enemy is offered one Core per race (mixed or mono, at random) and takes the one that fits
    // its comp: a mono comp its own race's mono Core, else a mixed Core of another race (which grows with the mono units);
    // other comps a mixed Core (preferably of coreRace). The Elder of the Glade only counts when the team has Elves.
    let coreId = null;
    if (withCore && coreRace) {
      const offer = coreOffer(races, rng);
      const kind = id => BY_ID[id].coreKind;
      const useful = id => id !== 'elder' || plan.some(e => e.race === 'Elf');
      const mixedOf = r => offer.find(id => kind(id) === 'mixed' && BY_ID[id].race === r && useful(id));
      if (comp === 'mono') coreId = offer.find(id => kind(id) === 'mono' && BY_ID[id].race === main)
        || offer.find(id => kind(id) === 'mixed' && BY_ID[id].race !== main && useful(id)) || null;
      else coreId = mixedOf(coreRace) || offer.find(id => kind(id) === 'mixed' && useful(id)) || offer[0] || null;
    }
    // The Core takes one slot (the last plain unit), from CFG.coreRound on.
    if (coreId) {
      let i = plan.length - 1;
      while (i >= 0 && !plan[i].race) i--;
      if (i >= 0) plan[i] = { coreId }; else if (plan.length < CELLS) plan.push({ coreId });
    }
    const slots = [];
    if (CFG.enemyBudget) {
      // Budget enemies: the comp says which units, the gold budget says how many and which levels (see ENEMY TUNING).
      const prioOf = e => ((comp === 'main' && e.race === order[1]) || (comp === 'dragon' && e.race) ? 1 : 0);
      buyEnemy(round, rng, league, races, shuffled(plan, rng).map(e => Object.assign({ prio: prioOf(e) }, e))).forEach((u, i) => {
        slots.push({ uid: 'e' + i, id: u.d.id, cell: i, level: u.level,
          grow: u.d.id === 'militiaman' ? Math.min(MILITIA_CAP, Math.floor(round / 2)) : 0 });
      });
      // random cells first (like the old builder), then the support placement
      const cells = shuffled([0, 1, 2, 3, 4, 5], rng);
      slots.forEach((x, i) => { x.cell = cells[i]; });
      placeEnemy(slots);
      const res = { race: main, races, slots, comp };
      if (league && LEAGUE_ENEMY[league]) res.league = league;
      return res;
    }
    const occ = new Array(CELLS).fill(false);
    shuffled(plan, rng).forEach(e => {
      let d;
      if (e.coreId) d = BY_ID[e.coreId];
      else if (e.wyrm) d = BY_ID[PRISM];
      else if (e.dragon) d = BY_TIER[5].find(x => x.race === e.dragon && !x.core) || pickUnit(5, rng, e.dragon, races);
      else d = pickUnit(Math.min(e.cheap ? 2 : 9, rollTier(round, rng, ENEMY_TIER_ODDS)), rng, e.race, races);
      if (!d) return;
      const spots = [];
      for (let c = 0; c < CELLS; c++) {
        if (d.w === 1 && !occ[c]) spots.push(c);
        if (d.w === 2 && c % COLS < COLS - 1 && !occ[c] && !occ[c + 1]) spots.push(c);
      }
      if (!spots.length) return;
      const cell = spots[Math.floor(rng() * spots.length)];
      cellsOf(cell, d.w).forEach(c => { occ[c] = true; });
      slots.push({
        uid: 'e' + slots.length, id: d.id, cell, level: d.core ? 1 : pickLevel(round, rng, d.tier, league),
        grow: d.id === 'militiaman' ? Math.min(MILITIA_CAP, Math.floor(round / 2)) : 0,
      });
    });
    placeEnemy(slots);
    const out = { race: main, races, slots, comp };
    if (league && LEAGUE_ENEMY[league]) out.league = league;
    return out;
  }

  // ------------------------------------------------------------- game state
  // opts (used by the tutorial only): { pool: [races], winTarget: n, script: { shop(round, rolls) -> unit ids, enemy(round) -> {races, slots} } }.
  // opts.league (ranked runs): a league name; generated enemies use that league's strength (LEAGUE_ENEMY). Omitted = no league.
  // A script makes the shop and the enemies fixed; without it nothing here changes.
  function newGame(rng, opts) {
    const s = {
      rng: rng || Math.random,
      pool: null, round: 1, gold: goldFor(1), lives: CFG.startLives, wins: 0,
      board: [], bench: new Array(CFG.benchSize).fill(null), shop: [], phase: 'shop', nextUid: 1,
      battle: null, enemy: null, lastResult: null, rolls: 0, freeLeft: CFG.freeRerolls, locked: false, winTarget: (opts && opts.winTarget) || CFG.winTarget, script: (opts && opts.script) || null,
      league: (opts && opts.league) || null,
      coreShop: null,   // the one-time Core shop, see openCoreShop
    };
    s.pool = opts && opts.pool ? opts.pool.slice() : pickRaces(s.rng, CFG.poolSize);
    s.roster = pickRoster(s.rng);   // null = every unit (CFG.runPick off)
    rollShop(s);
    openCoreShop(s);
    return s;
  }

  // The run's shop roster (CFG.runPick): for every race (all six, so a pool set later still works) and every limited tier,
  // that many of the race's units of the tier, at random. Returns a Set of unit ids, or null when CFG.runPick is off.
  function pickRoster(rng) {
    const lim = CFG.runPick || [];
    if (!lim.some(x => x > 0)) return null;
    const ids = new Set();
    DEFS.forEach(d => { if (!lim[d.tier]) ids.add(d.id); });
    RACES.forEach(r => lim.forEach((k, tier) => {
      if (!k) return;
      const us = DEFS.filter(d => d.race === r && d.tier === tier && !d.core);
      for (let i = us.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [us[i], us[j]] = [us[j], us[i]]; }
      us.slice(0, k).forEach(d => ids.add(d.id));
    }));
    return ids;
  }

  // ------------------------------------------------------------ Core shop
  // At the start of round CFG.coreRound (normal games only, not the tutorial) the player is offered one Core per race of the pool.
  // State for a UI (s.coreShop, null before that round):
  //   { round, offer: [unit ids, one per pool race, in pool order], cost, open: true while you may still pick,
  //     picked: unit id or null }
  // While open, the normal shop works as usual. buyCore(s, i) buys offer[i] (first free board cell, else first free bench slot);
  // declineCore(s) closes it without buying. Starting the fight also closes it. There is no second chance, and selling the
  // Core (for its price) gives no new pick. The pool in s.pool may be set after newGame (tests do): the offer follows s.pool.
  function openCoreShop(s) {
    if ((s.script && !s.script.core) || !(CFG.coreRound > 0) || s.round !== CFG.coreRound || s.coreShop) return;
    const offer = s.script && s.script.coreOffer ? s.script.coreOffer.slice() : coreOffer(s.pool, s.rng);
    s.coreShop = { round: s.round, offer, cost: CFG.coreCost, open: true, picked: null };
  }
  // to (optional): { board: cell } or { bench: slot } to place it there (drag and drop, or click the Core and then a spot).
  function buyCore(s, i, to) {
    const c = s.coreShop;
    if (s.phase !== 'shop' || !c || !c.open) return fail('No Core to pick right now.');
    const id = c.offer[i];
    if (!id) return fail('No such Core.');
    if (s.gold < c.cost) return fail('Not enough gold.');
    let place = null;
    if (to && to.board !== undefined) {
      if (unitAt(s.board, to.board) || findPlacement(s.board, BY_ID[id].w, to.board) < 0) return fail('That cell is taken. Pick an empty cell, or a bench slot.');
      place = { board: findPlacement(s.board, BY_ID[id].w, to.board) };
    } else if (to && to.bench !== undefined) {
      if (s.bench[to.bench]) return fail('That bench slot is taken.');
      place = { bench: to.bench };
    }
    if (!place) for (let cell = 0; cell < CELLS && !place; cell++) if (findPlacement(s.board, BY_ID[id].w, cell) >= 0) place = { board: cell };
    if (!place) { const slot = s.bench.indexOf(null); if (slot >= 0) place = { bench: slot }; }
    if (!place) return fail('Your board and bench are full. Sell a unit first.');
    const unit = { uid: s.nextUid++, id, level: 1, grow: 0 };
    if (place.board !== undefined) { unit.cell = place.board; s.board.push(unit); } else s.bench[place.bench] = unit;
    s.gold -= c.cost;
    c.open = false; c.picked = id;
    return ok('Core: ' + BY_ID[id].name + (place.bench !== undefined ? ' (on your bench).' : '.'));
  }
  function declineCore(s) {
    if (!s.coreShop || !s.coreShop.open) return fail('No Core to pick right now.');
    s.coreShop.open = false;
    return ok('No Core this run.');
  }

  function rollShop(s) {
    // A script may return null for a round (the tutorial after its lessons): then the normal shop is used.
    const fixed = s.script && s.script.shop ? s.script.shop(s.round, s.rolls) : null;
    if (fixed) { s.rolls++; s.shop = fixed.slice(); return; }
    s.shop = [];
    for (let i = 0; i < CFG.shopSize; i++) s.shop.push(rollSlot(s));
  }
  // One shop slot: from round T.prismRound it is the Prismatic Wyrm with chance T.prismShop (in every run, whatever the pool),
  // otherwise a unit of the pool with a tier from the odds table.
  // Units you own at level 3 (CFG.hideMaxed): they no longer come up in your shop.
  const maxedIds = s => (CFG.hideMaxed ? new Set(allUnits(s).filter(u => u.level >= MAX_LEVEL && !BY_ID[u.id].core).map(u => u.id)) : null);
  // A shop unit of this tier that is not hidden; if every unit of the tier is hidden, the nearest other tier this round may show.
  function shopUnit(s, tier, race, skip) {
    const d = pickUnit(tier, s.rng, race, s.pool, s.roster, skip);
    if (d) return d;
    const odds = oddsFor(s.round);
    for (let k = 1; k < 5; k++) for (const t of [tier - k, tier + k]) {
      if (t < 1 || t > 5 || !(odds[t - 1] > 0)) continue;
      const e = pickUnit(t, s.rng, race, s.pool, s.roster, skip);
      if (e) return e;
    }
    return pickUnit(tier, s.rng, race, s.pool, s.roster);   // everything hidden (cannot really happen): ignore the rule
  }
  function rollSlot(s) {
    const skip = maxedIds(s);
    if (s.round >= T.prismRound && s.rng() < T.prismShop && !(skip && skip.has(PRISM))) return PRISM;
    if (CFG.dupBias > 0 && s.rng() < CFG.dupBias) {   // test setting: a copy of a unit you own (level 1-2, a tier this round may show)
      const odds = oddsFor(s.round);
      const own = allUnits(s).filter(u => u.level < MAX_LEVEL && !BY_ID[u.id].core && BY_ID[u.id].tier <= 5 && odds[BY_ID[u.id].tier - 1] > 0 && s.pool.includes(BY_ID[u.id].race) && !(skip && skip.has(u.id)));
      if (own.length) return own[Math.floor(s.rng() * own.length)].id;
    }
    if (CFG.ownBias > 0 && s.rng() < CFG.ownBias) {
      const own = [...new Set(allUnits(s).map(u => BY_ID[u.id].race).filter(r => s.pool.includes(r)))];
      if (own.length) return shopUnit(s, rollTier(s.round, s.rng), own[Math.floor(s.rng() * own.length)], skip).id;
    }
    return shopUnit(s, rollTier(s.round, s.rng), null, skip).id;
  }

  function occupancy(board, ignore) {
    const occ = new Array(CELLS).fill(null);
    for (const u of board) {
      if (ignore && ignore.includes(u.uid)) continue;
      cellsOf(u.cell, BY_ID[u.id].w).forEach(c => { occ[c] = u.uid; });
    }
    return occ;
  }

  // Where would a unit of width w go if dropped on `cell`? Returns its left cell or -1.
  function findPlacement(board, w, cell, ignore) {
    const occ = occupancy(board, ignore);
    const col = cell % COLS;
    let options;
    if (w === 1) options = [cell];
    else options = col === 0 ? [cell] : col === 1 ? [cell, cell - 1] : [cell - 1];
    for (const left of options) {
      if (cellsOf(left, w).every(c => occ[c] === null)) return left;
    }
    return -1;
  }

  function unitAt(board, cell) {
    return board.find(u => cellsOf(u.cell, BY_ID[u.id].w).includes(cell)) || null;
  }

  // ------------------------------------------------------------------ bench
  // The bench has CFG.benchSize slots, each holding one unit of any size. Benched units do not fight and
  // do not count for race or adjacency bonuses, but they do count for merging.
  const allUnits = s => s.board.concat(s.bench.filter(Boolean));
  const sameUnits = (s, id, level) => allUnits(s).filter(u => u.id === id && u.level === level);
  const onBoard = (s, u) => s.board.includes(u);

  function locate(s, uid) {
    const b = s.board.find(u => u.uid === uid);
    if (b) return { unit: b, zone: 'board' };
    const slot = s.bench.findIndex(u => u && u.uid === uid);
    if (slot >= 0) return { unit: s.bench[slot], zone: 'bench', slot };
    return null;
  }

  function removeUnit(s, u) {
    s.board = s.board.filter(x => x !== u);
    const i = s.bench.indexOf(u);
    if (i >= 0) s.bench[i] = null;
  }

  // ---------------------------------------------------------------- merging
  // Works like Teamfight Tactics: three copies of the same unit at the same level become one unit of the
  // next level, automatically, and chains continue (three level 2 become a level 3). Board and bench count.

  // Would buying one more `id` complete a trio of level 1 units?
  const completesMerge = (s, id) => sameUnits(s, id, 1).length >= 2;

  // Merges every complete trio of `id`. `extra` is a just-bought unit that has no place yet; it is consumed
  // by the merge. The merged unit stays on the board if any of the three stood there (on the anchor's cell if
  // the anchor is on the board, else on the front-left-most one), otherwise it stays on the bench.
  // Returns the highest level reached, or 0 if nothing merged.
  function autoMerge(s, id, anchorUid, extra) {
    let reached = 0;
    let anchor = anchorUid;
    let pending = extra || null;
    for (let level = 1; level < MAX_LEVEL; level++) {
      const group = sameUnits(s, id, level);
      if (pending && pending.level === level) group.push(pending);
      if (group.length < 3) continue;
      const place = u => (u === pending ? 2 : onBoard(s, u) ? 0 : 1);
      const where = u => (onBoard(s, u) ? u.cell : s.bench.indexOf(u));
      const first = u => (u.uid === anchor ? 0 : 1);
      const trio = group.slice().sort((a, b) => place(a) - place(b) || first(a) - first(b) || where(a) - where(b)).slice(0, 3);
      const keep = trio[0];
      keep.level = level + 1;
      keep.grow = Math.max(...trio.map(u => u.grow || 0));
      trio.slice(1).forEach(u => { if (u === pending) pending = null; else removeUnit(s, u); });
      anchor = keep.uid;
      reached = keep.level;
    }
    return reached;
  }

  // -------------------------------------------------------------- buying
  // Checks shared by every kind of purchase.
  function checkBuy(s, idx) {
    if (s.phase !== 'shop') return { err: fail('You can only shop between fights.') };
    const id = s.shop[idx];
    if (!id) return { err: fail('That slot is empty.') };
    const d = BY_ID[id];
    if (s.gold < d.cost) return { err: fail('Not enough gold.') };
    return { id, d };
  }

  // Pays for the unit and puts it at `place` ({board: leftCell} or {bench: slot}). With place = null the unit
  // completes a trio and is merged straight away, so it needs no space at all.
  function completeBuy(s, idx, d, place, anchorUid) {
    const unit = { uid: s.nextUid++, id: d.id, level: 1, grow: 0 };
    s.gold -= d.cost;
    s.shop[idx] = null;
    let reached;
    if (!place) {
      reached = autoMerge(s, d.id, anchorUid || null, unit);
    } else {
      if (place.board !== undefined) { unit.cell = place.board; s.board.push(unit); }
      else s.bench[place.bench] = unit;
      reached = autoMerge(s, d.id, unit.uid, null);
    }
    if (reached) return ok(d.name + ' merged into a level ' + reached + ' unit!');
    return ok(place && place.bench !== undefined ? 'Bought ' + d.name + ' (on your bench).' : 'Bought ' + d.name + '.');
  }

  function buyToCell(s, idx, cell) {
    const c = checkBuy(s, idx);
    if (c.err) return c.err;
    const { id, d } = c;
    const target = unitAt(s.board, cell);
    const left = target ? -1 : findPlacement(s.board, d.w, cell);
    if (left >= 0) return completeBuy(s, idx, d, { board: left });
    if (completesMerge(s, id)) return completeBuy(s, idx, d, null, target && target.id === id ? target.uid : null);
    if (target) return fail('That cell is taken. Pick an empty cell, or a bench slot.');
    return fail(d.w === 2 ? 'Not enough room: ' + d.name + ' needs 2 free cells side by side. Try the bench.' : 'No room there.');
  }

  function buyToBench(s, idx, slot) {
    const c = checkBuy(s, idx);
    if (c.err) return c.err;
    const { id, d } = c;
    if (!s.bench[slot]) return completeBuy(s, idx, d, { bench: slot });
    if (completesMerge(s, id)) return completeBuy(s, idx, d, null, s.bench[slot].id === id ? s.bench[slot].uid : null);
    return fail('That bench slot is taken.');
  }

  // Double-click purchase: completes a merge if it can, otherwise takes the first free board cell,
  // otherwise the first free bench slot.
  function buyAuto(s, idx) {
    const c = checkBuy(s, idx);
    if (c.err) return c.err;
    const { id, d } = c;
    if (completesMerge(s, id)) return completeBuy(s, idx, d, null, null);
    for (let cell = 0; cell < CELLS; cell++) {
      const left = findPlacement(s.board, d.w, cell);
      if (left >= 0) return completeBuy(s, idx, d, { board: left });
    }
    const slot = s.bench.indexOf(null);
    if (slot >= 0) return completeBuy(s, idx, d, { bench: slot });
    return fail('Your board and bench are full. Sell a unit first.');
  }

  // -------------------------------------------------------- moving and selling
  // zone is 'board' (index = cell) or 'bench' (index = slot).
  function moveUnit(s, uid, zone, index) {
    if (s.phase !== 'shop') return fail('You can only rearrange between fights.');
    const at = locate(s, uid);
    if (!at) return fail('No such unit.');
    const u = at.unit;
    const d = BY_ID[u.id];

    if (zone === 'bench') {
      const other = s.bench[index];
      if (other === u) return ok();
      if (!other) {
        removeUnit(s, u);
        delete u.cell;
        s.bench[index] = u;
        return ok();
      }
      if (at.zone === 'bench') { s.bench[at.slot] = other; s.bench[index] = u; return ok('Swapped.'); }
      // A board unit and a bench unit trade places if the bench unit fits where the board unit stood.
      const rest = s.board.filter(x => x !== u);
      const left = findPlacement(rest, BY_ID[other.id].w, u.cell, []);
      if (left < 0) return fail(BY_ID[other.id].name + ' does not fit there.');
      s.board = rest;
      other.cell = left;
      s.board.push(other);
      delete u.cell;
      s.bench[index] = u;
      return ok('Swapped.');
    }

    // The target is a board cell.
    const target = unitAt(s.board, index);
    if (target === u) return ok();
    if (at.zone === 'bench') {
      if (!target) {
        const left = findPlacement(s.board, d.w, index);
        if (left < 0) return fail(d.w === 2 ? d.name + ' needs 2 free cells side by side.' : 'No room there.');
        s.bench[at.slot] = null;
        u.cell = left;
        s.board.push(u);
        return ok();
      }
      const rest = s.board.filter(x => x !== target);
      const left = findPlacement(rest, d.w, index, []);
      if (left < 0 && d.w === 2) return dropSiege(s, u, at.slot, index);
      if (left < 0) return fail('They do not fit there.');
      s.board = rest;
      delete target.cell;
      s.bench[at.slot] = target;
      u.cell = left;
      s.board.push(u);
      return ok('Swapped.');
    }
    // Board to board: move, or swap if both still fit afterwards.
    if (target) {
      const ignore = [u.uid, target.uid];
      const oldCell = u.cell;
      const a = findPlacement(s.board, d.w, index, ignore);
      if (a < 0) return fail('They do not fit there.');
      const tmp = { uid: u.uid, id: u.id, cell: a };
      const rest = s.board.filter(x => x !== u && x !== target);
      const bLeft = findPlacement(rest.concat([tmp]), BY_ID[target.id].w, oldCell, []);
      if (bLeft < 0) return fail('They do not fit there.');
      u.cell = a; target.cell = bLeft;
      return ok('Swapped.');
    }
    const left = findPlacement(s.board, d.w, index, [u.uid]);
    if (left < 0) return fail(d.w === 2 ? d.name + ' needs 2 free cells side by side.' : 'No room there.');
    u.cell = left;
    return ok();
  }

  // A 2-cell unit (old Siege Engine) dragged from the bench onto taken cells sends every unit in its way to the bench.
  // Dormant: no unit in DEFS is 2 cells wide any more. Kept so a 2-cell unit can be added back without engine work.
  function dropSiege(s, u, fromSlot, index) {
    const col = index % COLS;
    const options = col === 0 ? [index] : col === 1 ? [index, index - 1] : [index - 1];
    const free = [fromSlot].concat(s.bench.map((x, i) => (x ? -1 : i)).filter(i => i >= 0));
    for (const left of options) {
      const blockers = [];
      cellsOf(left, 2).forEach(c => { const o = unitAt(s.board, c); if (o && !blockers.includes(o)) blockers.push(o); });
      if (blockers.length > free.length) continue;
      s.bench[fromSlot] = null;
      blockers.forEach((b, i) => { s.board = s.board.filter(x => x !== b); delete b.cell; s.bench[free[i]] = b; });
      u.cell = left;
      s.board.push(u);
      return ok('Swapped.');
    }
    return fail('Not enough bench space for the units in the way.');
  }

  function sell(s, uid) {
    if (s.phase !== 'shop') return fail('You can only sell between fights.');
    const at = locate(s, uid);
    if (!at) return fail('No such unit.');
    const gold = sellValue(at.unit);
    s.gold += gold;
    removeUnit(s, at.unit);
    return ok('Sold ' + BY_ID[at.unit.id].name + ' for ' + gold + ' gold.');
  }

  function reroll(s) {
    if (s.phase !== 'shop') return fail('You can only reroll between fights.');
    const cost = s.freeLeft > 0 ? 0 : CFG.rerollCost;
    if (s.gold < cost) return fail('Not enough gold.');
    s.gold -= cost;
    if (s.freeLeft > 0) s.freeLeft--;
    rollShop(s);
    s.locked = false;   // a reroll replaces the kept cards, so the lock ends
    return ok();
  }

  // Lock the shop: after the next fight the same cards stay (no automatic reroll). Click again to unlock.
  function toggleLock(s) {
    if (s.phase !== 'shop') return fail('You can only lock the shop between fights.');
    s.locked = !s.locked;
    return ok();
  }

  const toSlot = u => ({ uid: u.uid, id: u.id, cell: u.cell, level: u.level, grow: u.grow || 0 });

  function startBattle(s) {
    if (s.phase !== 'shop') return fail('Not in the shop phase.');
    s.enemy = (s.script && s.script.enemy && s.script.enemy(s.round)) || generateEnemy(s.round, s.rng, s.league);
    s.battle = createBattle(s.board.map(toSlot), s.enemy.slots, s.round);
    if (s.coreShop && s.coreShop.open) s.coreShop.open = false;   // the Core offer ends when the fight starts
    s.phase = 'battle';
    return ok();
  }

  function finishBattle(s) {
    const b = s.battle;
    if (!b || !b.over || s.phase !== 'battle') return fail('No finished battle.');
    s.lastResult = b.result;
    if (b.result === 'win') s.wins++;
    else if (b.result === 'loss') s.lives--;
    s.phase = s.wins >= s.winTarget ? 'won' : s.lives <= 0 ? 'lost' : 'result';
    return ok();
  }

  function nextRound(s) {
    if (s.phase !== 'result') return fail('The round is not over.');
    s.round++;
    s.gold += goldFor(s.round);   // unspent gold carries over
    // Militiaman: +1 attack per round on the board; from level 2 it also grows while on the bench.
    allUnits(s).forEach(u => { if (u.id === 'militiaman' && (u.level >= 2 || onBoard(s, u))) u.grow = Math.min(MILITIA_CAP, (u.grow || 0) + 1); });
    s.battle = null; s.enemy = null;
    s.phase = 'shop';
    s.rolls = 0;
    s.freeLeft = CFG.freeRerolls;
    if (!s.locked) rollShop(s);
    else for (let i = 0; i < CFG.shopSize; i++) {   // a locked shop keeps its cards; slots you bought from are filled again
      if (!s.shop[i]) s.shop[i] = rollSlot(s);
    }
    openCoreShop(s);
    return ok();
  }

  // Live numbers for the board (attack, speed, heal), shown in the shop phase.
  function preview(board, round) {
    const max = maxHp(round);
    const team = buildTeam(board.map(toSlot), max);
    const side = { team, hp: max, max, shield: team.shield };
    updateStolen(team, null);   // Spirit Stag: speed from your own battle-start slow
    const units = {};
    team.units.forEach(u => {
      const p = u.def.kind === 'heal'
        ? { heal: healValue(u, side), interval: u.interval, speed: u.speed, level: u.level }
        : { atk: atkValue(u, side, 0), interval: u.interval, speed: u.speed, level: u.level };
      if (u.def.ward) p.ward = true;            // Runepriest: the 'heal' number is shield
      if (u.wind > 0) p.wind = u.wind;          // wind-up: speed gained per second of the fight (any race next to Clockwork)
      if (u.atkPct > 0) p.atkPct = u.atkPct * (u.pctMult || 1);    // Orc buffs: this unit hits this much harder (already inside atk; Spearhurler: counted extra)
      units[u.uid] = p;
    });
    // foeSlow / foeDelay: what your Fae do to the enemy at battle start (slow capped at SLOW_CAP).
    // fullRace: the race of a full mono board (all 6 cells, one race), for the "full board" bonus of the mono payoff units.
    // fullRaces: every race the board is full of (more than one only with Prism Hoard, e.g. an all-Dragon board is full of all six).
    const fullRaces = RACES.filter(r => team.full(r));
    const fullRace = fullRaces[0] || null;
    // boardRaces: every race with at least CFG.monoBoard units on the board (5+ of that race).
    const boardRaces = RACES.filter(r => team.board5(r));
    // other: per race, the units of another race the signposts count.
    const other = {}; RACES.forEach(r => { other[r] = team.other(r); });
    return { units, shield: team.shield, diff: team.diff, count: team.count, other, fullRace, fullRaces, boardRaces, prism: team.prism,
      foeSlow: Math.min(team.dreamCap || SLOW_CAP, team.foeSlow), foeDelay: Math.min(DELAY_CAP, team.foeDelay), hexes: team.hexes.slice() };
  }

  const api = {
    CFG, COLS, ROWS, CELLS, RACES, RACE_INFO, TUNING: T, PRISM, pickRaces, SLOW_CAP, UNIT_SLOW_CAP, DELAY_CAP, WIND_CAP, DEFS, BY_ID, MULT, unitText,
    maxHp, maxTier, goldFor, tierOdds: oddsFor, MAX_LEVEL, sellValue, completesMerge,
    CORE, CORES, coreOffer, buyCore, declineCore,
    newGame, rollShop, buyToCell, buyToBench, buyAuto, moveUnit, sell, reroll, toggleLock, locate,
    startBattle, finishBattle, nextRound, preview,
    createBattle, runBattle, generateEnemy, findPlacement, unitAt, LEAGUE_ENEMY, LEAGUE_ORDER, enemyBudget,
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Game = api;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/*
 * Warbands tutorial: a scripted run. No DOM code in here, so the same file runs in the browser and in Node (for tests).
 * The tutorial uses the normal engine, but with a fixed shop and fixed enemies (see newGame opts.script in game.js),
 * Rounds 1 to 5 are the lessons: fixed shops and enemies, one Core pick in round 5, and one fight (round 3) that the player
 * always loses, to teach what a defeat does. From round 6 on it is a normal game (random shops and enemies, a loss costs a
 * life): the run ends at 10 wins, or when all lives are gone.
 * ui.js shows the text of the current step and blocks every action that the step does not allow.
 *
 * Step kinds:
 *   info   text and a Next button.
 *   do     the player must do what the text says (allow = what is possible; done(S) = when the step is finished).
 *   fight  the player presses Fight. battleText is shown during the fight, winText / loseText after it.
 *          free: true = normal play: any result counts (no replay), and the step repeats every round until the run ends.
 * allow:  shop   [card indexes] or 'any'      which shop cards can be bought
 *         to     'board' | 'bench' | 'any' | fn(S) -> [board cells]     where a bought unit may go
 *         auto   true: double-click buy is OK (it picks a free cell itself)
 *         units  [unit ids] or true            which units can be selected / moved / sold
 *         move   true: units can be moved on the board and bench
 *         core   [offer indexes] or true       which cards of the round 5 Core offer can be bought
 *         sell, reroll, fight   true: the button works
 * hl:     'lock' (info steps) highlights that button. The Lock button only shows once the lessons are over (fixed lesson shops).
 */
(function (root) {
  'use strict';

  const POOL = ['Human', 'Orc', 'Dwarf'];
  const WIN_TARGET = 10;

  // Shop cards by round; the second list is what the shop shows after one reroll, and so on.
  const SHOPS = {
    1: [['militiaman', 'grunt', 'shieldbearer', 'militiaman', 'brute']],
    2: [['militiaman', 'militiaman', 'shieldbearer', 'brute', 'thunderer']],
    3: [['shieldbearer', 'militiaman', 'grunt', 'knight', 'brute'], ['thunderer', 'brute', 'shieldbearer', 'grunt', 'knight']],
    4: [['militiaman', 'shieldbearer', 'thunderer', 'brute', 'runepriest']],
    5: [['grunt', 'knight', 'brute', 'runepriest', 'drummer'], ['thunderer', 'shieldbearer', 'knight', 'grunt', 'brute']],
    6: [['shaman', 'crossbowman', 'grunt', 'drummer', 'shieldbearer'], ['thunderer', 'knight', 'brute', 'grunt', 'militiaman']],
  };
  // After the curated lists run out, every further reroll still shows a different (but fixed) shop.
  const EXTRA = ['militiaman', 'grunt', 'shieldbearer', 'brute', 'knight', 'thunderer', 'shaman', 'crossbowman', 'drummer', 'runepriest'];
  const LESSONS = 5;   // last scripted round; after it the shop and the enemies are the normal random ones
  const shop = (round, rolls) => {
    if (round > LESSONS) return null;
    const l = SHOPS[round] || SHOPS[6];
    if (rolls < l.length) return l[rolls];
    const o = (rolls * 3) % EXTRA.length;
    return [0, 1, 2, 3, 4].map(i => EXTRA[(o + i * 2) % EXTRA.length]);
  };

  // Enemies by round: [unit id, cell, level]. The enemy's races only show in its title.
  const ENEMIES = {
    1: { races: ['Elf', 'Fae'], units: [['militiaman', 1, 1], ['pixie', 4, 1]] },
    2: { races: ['Elf', 'Fae'], units: [['sentinel', 1, 1], ['thornguard', 3, 1], ['pixie', 5, 1]] },
    3: { races: ['Human', 'Orc', 'Dwarf'], units: [['knight', 0, 3], ['drummer', 1, 2], ['brute', 2, 3], ['thunderer', 3, 3], ['shieldbearer', 4, 3], ['militiaman', 5, 3]], grow: 4 },
    4: { races: ['Elf', 'Clockwork'], units: [['sentinel', 0, 1], ['ranger', 1, 1], ['cogling', 3, 1], ['pixie', 5, 1]] },
    5: { races: ['Elf', 'Fae', 'Clockwork'], units: [['sentinel', 0, 1], ['ranger', 1, 1], ['thornguard', 2, 1], ['cogling', 3, 1], ['pixie', 4, 1]] },
    6: { races: ['Elf', 'Fae', 'Clockwork'], units: [['sentinel', 0, 1], ['ranger', 1, 1], ['thornguard', 2, 1], ['cogling', 3, 1], ['pixie', 4, 1], ['automaton', 5, 1]] },
    7: { races: ['Elf', 'Fae', 'Clockwork'], units: [['sentinel', 0, 1], ['ranger', 1, 2], ['thornguard', 2, 1], ['cogling', 3, 1], ['pixie', 4, 1], ['automaton', 5, 1]] },
    8: { races: ['Elf', 'Fae', 'Clockwork'], units: [['sentinel', 0, 2], ['ranger', 1, 2], ['thornguard', 2, 1], ['cogling', 3, 2], ['pixie', 4, 1], ['automaton', 5, 1]] },
    9: { races: ['Elf', 'Fae', 'Clockwork'], units: [['sentinel', 0, 2], ['ranger', 1, 2], ['thornguard', 2, 2], ['cogling', 3, 2], ['pixie', 4, 1], ['automaton', 5, 1]] },
    10: { races: ['Elf', 'Fae', 'Clockwork'], units: [['sentinel', 0, 2], ['ranger', 1, 2], ['thornguard', 2, 2], ['cogling', 3, 2], ['pixie', 4, 1], ['automaton', 5, 1]] },
    11: { races: ['Elf', 'Fae', 'Clockwork'], units: [['sentinel', 0, 2], ['ranger', 1, 2], ['thornguard', 2, 2], ['cogling', 3, 2], ['pixie', 4, 1], ['automaton', 5, 1]] },
  };
  const enemy = round => {

    return {
      race: e.races[0], races: e.races.slice(),
      slots: e.units.map((u, i) => ({ uid: 'e' + i, id: u[0], cell: u[1], level: u[2], grow: u[0] === 'militiaman' ? (e.grow || 0) : 0 })),

  const script = { shop, enemy, core: true, coreOffer: ['herald', 'bloodrager', 'bulwark'] };   // core: the round 5 Core offer is on in the tutorial

  // ---------------------------------------------------------------- helpers for the steps
  const has = (S, id, level) => S.board.concat(S.bench.filter(Boolean)).some(u => u.id === id && (!level || u.level >= level));
  const onBoard = (S, id) => S.board.some(u => u.id === id);
  const onBench = (S, id) => S.bench.some(u => u && u.id === id);
  // Cells that touch cell c (up, down, left, right) on the 3x2 board.
  const adj = c => { const r = Math.floor(c / 3), col = c % 3, out = []; if (col > 0) out.push(c - 1); if (col < 2) out.push(c + 1); if (r > 0) out.push(c - 3); if (r < 1) out.push(c + 3); return out; };
  const FREE = { shop: 'any', to: 'any', auto: true, units: true, move: true, sell: true, reroll: true, fight: true };

  const STEPS = [
    // ---- round 1: buying, placing, neighbours, the fight
    { kind: 'info', round: 1, title: 'Welcome to Warbands',
      text: 'You lead a warband. Each round you spend gold in the shop, then your warband fights an enemy warband on its own. Win 10 fights to finish this tutorial.' },
    { kind: 'do', round: 1, title: 'Buy a unit',

      allow: { shop: [0], to: 'board', auto: true }, done: S => onBoard(S, 'militiaman') },
    { kind: 'do', round: 1, title: 'Neighbours matter',
      text: 'Now the Grunt. Orcs give attack to the units around them, whatever their race. Place it right next to the Militiaman (up, down, left or right).',
      allow: { shop: [1], to: S => { const m = S.board.find(u => u.id === 'militiaman'); return m ? adj(m.cell) : []; } },
      done: S => onBoard(S, 'grunt') },
    { kind: 'info', round: 1, title: 'Read your units',
      text: 'Hover over a unit (or tap it) to read what it does. The yellow line shows its real numbers right now: the Grunt gives the Militiaman +15% attack.' },
    { kind: 'fight', round: 1, title: 'Fight!',
      text: 'Press Fight! The battle runs by itself.',
      battleText: 'Each side has one shared health bar. Every hit chips the enemy bar. Empty it first and you win.',
      winText: 'You won! That is 1 win out of 10.', loseText: '',
      allow: { fight: true } },

    // ---- round 2: gold, bench, merging, shields
    { kind: 'info', round: 2, title: 'New round, new gold',
      text: 'You get new gold every round (unspent gold carries over), and a new shop. Three copies of the same unit merge into a stronger one. Let us try it.' },
    { kind: 'do', round: 2, title: 'The bench',
      text: 'Buy a Militiaman and drop it on a bench slot (below your board). Bench units do not fight, but they count for merges.',
      allow: { shop: [0], to: 'bench' }, done: S => onBench(S, 'militiaman') },
    { kind: 'do', round: 2, title: 'Merge',
      text: 'Buy the second Militiaman, anywhere you like. With the one on your board that makes three, so they merge automatically.',
      allow: { shop: [1], to: 'any', auto: true }, done: S => has(S, 'militiaman', 2) },
    { kind: 'info', round: 2, title: 'Level 2',
      text: 'Merged! A level 2 unit has much more attack and a stronger ability, and level 3 gets even more. Hover it to compare the levels.' },
    { kind: 'do', round: 2, title: 'Shields',
      text: 'Buy the Shieldbearer and put it on your board. Dwarves make shields: at battle start it gives your team a shield (blue) that soaks up damage before your health bar.',
      allow: { shop: [2], to: 'board', auto: true }, done: S => onBoard(S, 'shieldbearer') },
    { kind: 'fight', round: 2, title: 'Fight!',
      text: 'Press Fight!',
      battleText: 'Watch the blue shield absorb the first hits.', winText: 'Another win! 2 out of 10.', loseText: '',
      allow: { fight: true } },

    // ---- round 3: reroll, and a fight that cannot be won
    { kind: 'do', round: 3, title: 'Reroll',
      text: 'Not happy with the shop? Press Reroll (1 gold) to see new units.',
      allow: { reroll: true }, done: S => S.rolls >= 2 },
    { kind: 'do', round: 3, title: 'Grow your warband',
      text: 'Buy the Thunderer and the Brute and put them on your board. More units means more hits.',
      allow: { shop: [0, 1], to: 'board', auto: true }, done: S => onBoard(S, 'thunderer') && onBoard(S, 'brute') },
    { kind: 'fight', round: 3, title: 'Fight!',
      text: 'Press Fight and see how it goes.',
      battleText: 'Let us see how this one ends.',
      winText: '', loseText: 'You lost this one, and that is fine. A defeat costs you a life (♥) and gives no win. You have 5 lives, and the run ends when they are all gone. Lose a fight, learn, and keep going.',
      allow: { fight: true } },

    // ---- round 4: selling, tiers
    { kind: 'info', round: 4, title: 'Back on track',
      text: 'Sometimes you want to sell a unit to afford a better one. A level 1 unit sells for its full price, a merged unit for a little less.' },
    { kind: 'do', round: 4, title: 'Sell a unit',
      text: 'Click the Thunderer to select it, then press Sell.',
      allow: { units: ['thunderer'], sell: true }, done: S => !has(S, 'thunderer') },
    { kind: 'do', round: 4, title: 'Pricier units',

    { kind: 'fight', round: 4, title: 'Fight!',
      text: 'Press Fight!',
      battleText: 'The Runepriest adds a new shield every few seconds.', winText: 'You are back in the lead: 3 wins out of 10.', loseText: '',
      allow: { fight: true } },

    // ---- round 5: the Core
    { kind: 'info', round: 5, title: 'Your Core',
      text: 'From round 5 on, every run offers you a Core: one special unit for each race in your run, shown in a panel above the shop. You may take only one, it costs 5 gold, and there is no second chance. Think of it as the centre piece of your warband.' },
    { kind: 'do', round: 5, title: 'Pick your Core',
      text: 'Take the Bloodrager (Orc): click its card once to read it, click it again to buy it. It gets stronger with every unit of another race on your board, so a mixed warband makes it hit harder.',
      allow: { core: [1] }, done: S => !!(S.coreShop && S.coreShop.picked) },
    { kind: 'info', round: 5, title: 'How a Core works',
      text: 'Cores are marked ◇ (mixed: they like many races) or ◈ (mono: made for a board of their own race). Each run offers one of the two for every race. There is only ever one copy, so a Core never levels up: it is strong from the start. You can sell it, but you will not get a second one. Hover it to see its real numbers.' },
    { kind: 'fight', round: 5, title: 'Your turn',
      text: 'Spend the rest of your gold, arrange your warband (neighbours matter!) and press Fight. Reroll, sell and move units if you like.',
      battleText: 'Your warband, your choices.', winText: '4 wins out of 10. Keep going!', loseText: '',
      allow: FREE },

    // ---- round 6 onward: a normal game
    { kind: 'info', round: 6, title: 'The real thing',
      text: 'The lessons are over. From now on it is a normal game: the shop and the enemies are random, and a defeat costs a life. Reach 10 wins before your lives run out. The coloured chips at the top show which races can appear in your shop.' },
    { kind: 'info', round: 6, title: 'Lock the shop', hl: 'lock',
      text: 'Like these cards but can\'t afford them yet? Press 🔓 Lock and the shop keeps them for the next round instead of rolling new ones.' },
    { kind: 'fight', round: 6, free: true, title: 'Free play',

      battleText: 'Your warband, your choices.',
      winText: S => S.wins + ' wins out of 10.' + (S.wins === 9 ? ' One more!' : ''),

      allow: FREE },
  ];

  const api = { POOL, WIN_TARGET, LESSONS, script, STEPS, shop, enemy, adj,
    options: () => ({ pool: POOL, winTarget: WIN_TARGET, script, league: 'Tutorial' }) };   // league: enemy strength below Iron (game.js TUTORIAL_ENEMY)
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Tutorial = api;
