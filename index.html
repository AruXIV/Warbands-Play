<!DOCTYPE html>
<!-- Warbands. © 2026 AruXIV. All rights reserved. No copying, changing or reuploading without permission. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Warbands</title>
<style>
  :root {
    --bg: #17120f; --panel: #231a14; --panel2: #2e2219; --line: #5a4129;
    --text: #efe3c8; --muted: #a8977a; --gold: #e8b84a; --red: #c8453a; --green: #58b368; --blue: #5b8ad6;
    --cell: clamp(58px, 12vw, 94px);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: ui-monospace, "Cascadia Mono", "Courier New", monospace; min-height: 100vh; }
  #app { max-width: 1020px; margin: 0 auto; padding-block: 12px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .hidden { display: none !important; }

  /* header */
  #top { display: flex; gap: 10px 22px; flex-wrap: wrap; align-items: center; justify-content: space-between;
    background: var(--panel); border: 2px solid var(--line); border-radius: 8px; padding: 10px 14px; font-weight: 700; }
  #top .stat b { color: var(--gold); }
  #top .hearts { color: var(--red); letter-spacing: 2px; }
  #top .hbtns { order: -1; flex: 1 0 100%; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  #top button { padding: 6px 12px; }
  #msg { min-height: 22px; margin: 14px 2px 4px; color: var(--gold); font-size: 14px; }
  #msg.bad { color: #ff8a7a; }

  /* arena */
  #arena { display: flex; justify-content: center; align-items: flex-start; gap: 26px; margin: 14px 0 18px; flex-wrap: nowrap; }
  #playerSide, #enemySide { width: 310px; flex: 0 0 310px; }
  #arena:has(#enemySide:not(.hidden)) .side > .title { min-height: 46px; }
  .enemyraces { margin-top: 4px; text-transform: none; letter-spacing: 0; } .enemyraces .chip { margin: 0 4px 0 0; }
  @media (max-width: 700px) { #arena { flex-wrap: wrap; } }
  .side { display: flex; flex-direction: column; gap: 10px; }
  .side .title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  #vs { align-self: center; font-size: 22px; font-weight: 800; color: var(--gold); }
  .grid { display: grid; grid-template-columns: repeat(3, var(--cell)); grid-template-rows: repeat(2, var(--cell));
    gap: 4px; padding: 8px; background: var(--panel); border: 2px solid var(--line); border-radius: 10px; }
  .grid { justify-content: center; align-self: center; }
  .benchbox { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .bench { --bs: max(46px, calc(var(--cell) * .66)); display: grid; grid-template-columns: repeat(6, var(--bs)); gap: 4px;
    padding: 6px; background: var(--panel); border: 2px solid var(--line); border-radius: 10px; }
  .bench.idle { opacity: .6; }
  .bslot { width: var(--bs); height: var(--bs); border: 2px dashed #5a412977; border-radius: 8px; background: #0003; }
  .bslot.live { cursor: pointer; }
  .bslot.live:hover { border-color: var(--gold); background: #e8b84a14; }
  .bslot .unit { --cell: var(--bs); margin: 0; width: 100%; height: 100%; }
  .bslot .unit .nm { font-size: 8px; }
  .bslot .unit .stars { font-size: 9px; top: 1px; right: 3px; }
  .slot { margin: 3px; border: 2px dashed #5a412977; border-radius: 8px; background: #0003; }
  .slot.live { cursor: pointer; }
  .slot.live:hover { border-color: var(--gold); background: #e8b84a14; }

  /* health bar */
  .bar { position: relative; height: 28px; }
  .bar .track { position: absolute; inset: 0; background: #0007; border: 2px solid #000; border-radius: 6px; overflow: hidden; }
  .bar .fill { position: absolute; left: 0; top: 0; height: 100%; width: 100%; background: linear-gradient(#e0574a, #a82f27); transition: width .12s linear; }
  .bar .shieldbar { position: absolute; top: 0; height: 100%; left: 0; width: 0; background: linear-gradient(#a9d0ff, #4f7fd0); box-shadow: inset 2px 0 0 #0a1330; transition: left .12s linear, width .12s linear; }
  .bar .label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; text-shadow: 0 1px 0 #000; }
  .bar .slowtag .snail { display: inline-block; line-height: 1; vertical-align: middle; position: relative; top: 1.4px; }
  .bar .slowtag { position: absolute; right: 8px; bottom: -17px; font-size: 11px; color: #d9b8ff; pointer-events: none; }
  .unit.hexed { outline: 3px solid #b070e0; outline-offset: -3px; }
  #foeline { font-size: 12px; color: #d9b8ff; }
  #info .monotag { color: var(--gold); font-size: 12px; margin: 0 0 6px; }
  .bar .floats { position: absolute; inset: 0; pointer-events: none; }
  .bar.hit .track { border-color: #fff; }
  .float { position: absolute; top: -4px; font-weight: 800; font-size: 15px; text-shadow: 0 1px 0 #000, 0 0 4px #000; animation: floatup .9s ease-out forwards; }
  .float.ward { color: #9cc2ff; } .float.delay { color: #d9b8ff; font-size: 13px; }
  .float.dmg { color: #ffd9d4; } .float.bolt { color: #c9a5ff; font-size: 18px; } .float.heal { color: #8fe29d; }
  @keyframes floatup { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-34px); } }

  /* unit tiles (placeholders until the real sprites exist) */
  .unit { position: relative; margin: 3px; border: 3px solid #0008; border-radius: 8px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px; cursor: pointer; user-select: none;
    box-shadow: inset 0 -6px 0 #0004, 0 2px 0 #000a; }
  .unit.race-Human { background: linear-gradient(#4f84d4, #2f5a9a); }
  .unit.race-Elf { background: linear-gradient(#3fb383, #227a55); }
  .unit.race-Orc { background: linear-gradient(#c05a37, #7e3219); }
  .unit.race-Dwarf { background: linear-gradient(#b8923f, #7a5a1c); }
  .unit.race-Fae { background: linear-gradient(#a56bd1, #6a3a92); }
  .unit.race-Clockwork { background: linear-gradient(#8f98a8, #565e6e); }
  .unit.race-Neutral { background: linear-gradient(135deg, #d65a5a, #d6b85a, #5ab86a, #5a8ad6, #a05ad6); }
  .chip { display: inline-block; padding: 1px 8px; margin: 0 2px; border-radius: 10px; font-size: 12px; font-weight: 700; border: 1px solid #0008; text-shadow: 0 1px 0 #000; color: #fff; }
  .chip.inline { font-family: 'WarbandsPixel', ui-monospace, monospace; -webkit-font-smoothing: none; font-weight: 400; text-transform: uppercase; font-size: 11px; padding: 1px 6px; margin: 0 1px; line-height: 1.2; }
  .chip.race-Human { background: #3f6db8; } .chip.race-Elf { background: #2f9970; } .chip.race-Orc { background: #a84a2b; }
  .chip.race-Dwarf { background: #9b7a30; } .chip.race-Fae { background: #8b57b5; } .chip.race-Clockwork { background: #6f788a; }
  .chip.race-Neutral { background: linear-gradient(90deg, #b84a4a, #b8983f, #3f9a55, #3f6db8, #8b57b5); }
  .ocard .racelist { text-align: left; margin: 0 0 14px; font-size: 13px; line-height: 1.5; }
  .ocard .racelist div { margin: 6px 0; color: var(--text); }
  .ocard .fine { font-size: 12px; margin: 0 0 16px; }
  .unit.top { border-color: var(--gold); box-shadow: inset 0 -6px 0 #0004, 0 0 10px #e8b84a88; }
  .unit.corebox { border-color: #ffffff; box-shadow: inset 0 -6px 0 #0004, 0 0 10px #ffffffaa; }   /* Cores: white border and glow */
  [data-drag-shop] { touch-action: pan-x; }
  [data-drag-uid] { touch-action: none; }
  body.dragging { cursor: grabbing; user-select: none; -webkit-user-select: none; }
  .dragsrc { opacity: .4; }
  #shop.dropover, #corePanel.dropover { outline-color: #e0574a; background: #e0574a22; }
  .dropover { outline: 3px dashed var(--gold); outline-offset: -3px; background: #e8b84a22; }
  .unit.ghost { position: fixed; z-index: 30; margin: 0; pointer-events: none; opacity: .92; transform: scale(1.05); box-shadow: 0 6px 16px #000a; }
  .unit.selected { outline: 3px solid var(--gold); outline-offset: 1px; }
  .unit .ico { font-size: calc(var(--cell) * .40); line-height: 1; }
  .unit .sprite { -webkit-user-drag: none; user-select: none; width: 94%; height: auto; max-height: calc(100% - 14px); min-height: 0; flex: 0 1 auto; image-rendering: pixelated; object-fit: contain; }
  .unit .nm { font-size: 10px; font-weight: 700; text-shadow: 0 1px 0 #000; text-align: center; line-height: 1.1; padding: 0 2px; }
  .unit .stars { position: absolute; top: 2px; right: 4px; color: var(--gold); font-size: 11px; text-shadow: -1px -1px 0 #000, 0 -1px 0 #000, 1px -1px 0 #000, -1px 0 0 #000, 1px 0 0 #000, -1px 1px 0 #000, 0 1px 0 #000, 1px 1px 0 #000; }
  .unit .badge { position: absolute; left: 4px; bottom: 3px; font-size: 11px; font-weight: 700; background: #000b; padding: 0 4px; border-radius: 3px; }
  .unit.mirror .ico, .unit.mirror .sprite { transform: scaleX(-1); }
  .unit.atk-r { animation: lunge-r .26s ease-out; }
  .unit.atk-l { animation: lunge-l .26s ease-out; }
  .unit.glow { animation: glow .45s ease-out; }
  @keyframes lunge-r { 40% { transform: translateX(calc(var(--cell) * .35)); } }
  @keyframes lunge-l { 40% { transform: translateX(calc(var(--cell) * -.35)); } }
  @keyframes glow { 30% { filter: brightness(1.8); box-shadow: 0 0 14px #8fe29d; } }

  /* shop */
  #shopArea { display: flex; flex-direction: column; gap: 12px; }
  #shop { display: flex; gap: 8px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
  #lower { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  #controls { flex: 1 1 340px; }
  #odds { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 26px; font-family: 'WarbandsPixel', ui-monospace, monospace; -webkit-font-smoothing: none; }
  #odds .oddslabel { font-size: 14px; color: var(--muted); margin-right: 4px; }
  #odds .oddschip { display: inline-flex; align-items: center; gap: 5px; height: 24px; box-sizing: border-box; padding: 0 9px; background: #0006; border: 1px solid var(--line); border-radius: 12px; line-height: 1; }
  #odds .coin { display: block; font-size: 13px; transform: translateY(-2px); }
  #odds .cost { display: block; font-size: 15px; color: var(--gold); transform: translateY(1px); }
  #odds .pct { display: block; font-size: 15px; color: var(--text); margin-left: 3px; transform: translateY(1px); }
  #corePanel { border: 2px solid var(--gold); border-radius: 10px; background: #2a1d10; padding: 10px; }
  #corePanel .corehead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  #corePanel .coretitle { font-family: 'WarbandsPixel', monospace; font-size: 15px; letter-spacing: .5px; color: var(--gold); text-transform: uppercase; }
  #corePanel .coresub { font-size: 12px; color: var(--muted); }
  #corePanel .corecards { display: flex; gap: 8px; flex-wrap: wrap; }
  #corePanel .corecards .card { position: relative; border-color: #8a6638; }
  #corePanel .corecards .card.selected { border-color: var(--gold); }
  #corePanel .coreskip { margin-top: 8px; }
  #corePanel .coretag { color: var(--gold); font-size: 11px; margin-top: 3px; }
  .card { flex: 1 1 0; min-width: 158px; min-height: 92px; background: var(--panel); border: 2px solid var(--line); border-radius: 8px; padding: 8px;
    display: flex; gap: 8px; cursor: pointer; }
  .card:hover { border-color: #8a6638; }
  .card.selected { border-color: var(--gold); background: var(--panel2); }
  .card.poor { opacity: .5; }
  .card.empty { opacity: .25; cursor: default; }
  .card .unit { --cell: 54px; width: 54px; height: 54px; flex: none; margin: 0; cursor: inherit; }
  .card .meta { min-width: 0; font-size: 11px; color: var(--muted); line-height: 1.35; }
  .card .meta b { color: var(--text); font-size: 13px; }
  .card .cost { color: var(--gold); font-weight: 700; }
  .card .mergetag { color: var(--gold); font-size: 11px; font-weight: 700; margin-top: 2px; }
  #controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; font-weight: 700; color: var(--text); background: var(--panel2); border: 2px solid var(--line);
    border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--gold); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: #7a5a1c; border-color: var(--gold); }
  button.on { border-color: var(--gold); color: var(--gold); }
  #info { flex: 1 1 280px; max-width: 420px; min-height: 150px; background: var(--panel); border: 2px solid var(--line);
    border-radius: 8px; padding: 12px 14px; font-size: 13px; line-height: 1.5; }
  #info h3 { margin: 0 0 4px; font-size: 16px; }
  #info .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  #info .stats { margin-top: 8px; color: var(--gold); }
  #info p { margin: 6px 0; }
  #info.idle { visibility: hidden; }
  #info .tip { color: var(--muted); }
  #info .lvline { color: var(--muted); }
  #info .lvline b { color: var(--text); }
  #info .lvline.cur { color: var(--text); }
  #info .lvline.next { opacity: .75; }
  #info .lvline .mult { color: #9ec7ff; }
  #info .lvnote { font-size: 11px; color: var(--muted); margin: 2px 0 6px; }
  #info .live { color: var(--gold); margin: 0 0 8px; padding: 6px 8px; background: #0003; border-radius: 6px; }
  .kw { border-bottom: 1px dotted currentColor; cursor: help; outline: none; }
  .kwtip { position: fixed; z-index: 40; max-width: 240px; padding: 7px 10px; background: #1b130c; color: var(--text); border: 2px solid var(--gold);
    border-radius: 8px; font-size: 12px; line-height: 1.35; pointer-events: none; box-shadow: 0 4px 14px #000a; }


  /* fight statistics (result card) */
  .statsbox { margin-top: 16px; text-align: left; max-height: 46vh; overflow-y: auto; font-size: 12px; }
  .statsbox .stitle { margin: 10px 0 4px; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; font-size: 11px; }
  .statsbox .srow { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .statsbox .srow.empty { color: var(--muted); }
  .statsbox .sname { flex: 0 0 132px; margin: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .statsbox .sparts { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .statsbox .spart { position: relative; display: block; height: 16px; background: #0004; border-radius: 3px; overflow: hidden; }
  .statsbox .spart i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
  .statsbox .spart.dmg i { background: #a8392f; } .statsbox .spart.heal i { background: #3f8a52; } .statsbox .spart.ward i { background: #3e6bb0; }
  .statsbox .spart b { position: relative; padding-left: 6px; line-height: 16px; font-size: 11px; text-shadow: 0 1px 0 #000; }
  .statsbox .snone { color: var(--muted); font-size: 11px; }
  .statsbox .sfine { margin-top: 10px; color: var(--muted); font-size: 11px; }
  /* result overlay */
  #overlay { position: fixed; inset: 0; background: #000a; display: flex; align-items: center; justify-content: center; z-index: 10; }
  .ocard { background: var(--panel); border: 3px solid var(--gold); border-radius: 12px; padding: 26px 34px; text-align: center; min-width: 280px; }
  #help { position: fixed; inset: 0; background: #000a; display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  .helpcard { max-width: 560px; max-height: 86vh; display: flex; flex-direction: column; }
  .helpbody { text-align: left; overflow-y: auto; margin-bottom: 16px; padding-right: 6px; font-size: 13px; line-height: 1.5; }
  .helpbody h4 { margin: 12px 0 2px; color: var(--gold); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
  .helpbody p { margin: 4px 0; color: var(--text); }
  .ocard h2 .h2ico { display: inline-block; line-height: 1; vertical-align: middle; position: relative; top: -7.25px; }
  .ocard h2 { margin: 0 0 8px; font-size: 28px; }
  .ocard p { margin: 4px 0 18px; color: var(--muted); }

  /* main menu */
  #menu { position: fixed; inset: 0; z-index: 15; background: #3a2a63; display: flex; align-items: flex-start; justify-content: center; padding: 16px; overflow-y: auto; }
  #titleCanvas { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; image-rendering: pixelated; z-index: 0; }
  #menu::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(ellipse at 50% 45%, transparent 55%, #1a0f2e99 100%); }
  .menucard { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; max-width: 420px; width: 100%; margin-top: clamp(16px, 7vh, 80px); }
  .menucard .logo { font-size: clamp(48px, 15vw, 132px); font-weight: 900; letter-spacing: 8px; line-height: 1; margin-bottom: 26px; color: #ffd45e;
    background: linear-gradient(100deg, #ffd45e 38%, #fffbe0 50%, #ffd45e 62%) 0 0 / 300% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 0 #3a1a08) drop-shadow(0 0 18px #ffb34788); animation: logoshine 5s ease-in-out infinite; }
  @keyframes logoshine { 0%, 55% { background-position: 100% 0; } 85%, 100% { background-position: 0 0; } }
  .menucard .tagline { color: #fff1d0; margin-bottom: 14px; letter-spacing: 2px; text-shadow: 0 2px 0 #3a1a0888, 0 0 8px #3a1a0866; }
  .menupanel { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; max-width: 340px; padding: 20px 22px 16px; background: #1b122acc; border: 3px solid #8a6330; border-radius: 12px; box-shadow: 0 6px 0 #0007, inset 0 0 0 2px #3a2a1a; }
  .menucard button.big { width: 100%; max-width: 280px; font-size: 20px; padding: 14px 18px; }
  .menunote { min-height: 18px; font-size: 13px; color: var(--gold); }
  .menucopy .cc { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 1.25em; font-weight: 700; }
  .menucopy { margin-top: 14px; font-size: 13px; color: #e6dcf2; opacity: .85; letter-spacing: .5px; text-shadow: 1px 1px 0 #000, -1px 0 0 #000, 0 -1px 0 #000, 1px 0 0 #000, 0 1px 0 #000; }
  /* ranked leagues */
  .menurank { font-size: 18px; font-weight: 700; color: #fff1d0; }
  .menurank .sym { display: inline-block; line-height: 1; vertical-align: middle; position: relative; top: -7.4px; }
  .menunote .sym, .rankline .sym { display: inline-block; line-height: 1; vertical-align: middle; position: relative; top: -5.4px; }
  .rankline .sym { top: 0.5px; }
  .menurank small { display: block; font-size: 12px; font-weight: 400; color: #c9b896; margin-top: 2px; }
  #top #tRank b { color: var(--gold); }
  .ocard .rankline { margin: -8px 0 16px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); color: var(--text); font-size: 14px; }
  .ocard .rankline.up { border-color: var(--gold); }
  .menufine { font-size: 12px; color: var(--muted); max-width: 320px; }


  /* pixel font for labels, headings and buttons across the game (long descriptions keep the plain font) */
  button, #top, #msg, .side .title, #vs, .bar .label, #info h3, #info .sub, #info .monotag, .card .meta b, .card .cost, .card .mergetag,
  .unit .nm, .unit .stars, .unit .badge, .ocard h2, .ocard h3, .ocard button, .statsbox .stitle, .tutbox b { font-family: 'WarbandsPixel', ui-monospace, monospace; -webkit-font-smoothing: none; font-weight: 400; }
  button { font-size: 16px; letter-spacing: 0; }
  #top { font-size: 16px; }
  #top button { padding: 8px 12px 6px; }
  #msg { font-size: 16px; }
  .side .title { font-size: 16px; letter-spacing: 0; }
  .bar .label { font-size: 16px; }
  #info h3 { font-size: 24px; }
  #info .sub, #info .monotag { font-size: 16px; }
  .card .meta b { font-size: 16px; }
  .card .cost, .card .mergetag { font-size: 16px; }
  .unit .nm { font-size: 8px; line-height: 1.25; }
  .unit .stars { font-size: 16px; }
  .unit .badge { font-family: ui-monospace, 'Cascadia Mono', 'Courier New', monospace; font-weight: 700; font-size: 11px; }
  .bslot .unit .nm { font-size: 8px; }

  .menucard, .menucard button { font-family: 'WarbandsPixel', ui-monospace, monospace; -webkit-font-smoothing: none; }
  /* title: 12px per font pixel, gold with banded shading and a dark pixel outline */
  .menucard .logo { --u: 12px; font-size: calc(var(--u) * 8); font-weight: 400; letter-spacing: calc(var(--u) * 2); line-height: 1; margin: 0 0 calc(var(--u) * 3); white-space: nowrap;
    color: #ffd45e; -webkit-text-fill-color: transparent; animation: none;
    background: linear-gradient(180deg, #fff3b0 0, #fff3b0 calc(var(--u) * 2), #ffd45e calc(var(--u) * 2), #ffd45e calc(var(--u) * 5), #f0a030 calc(var(--u) * 5), #f0a030 calc(var(--u) * 7), transparent calc(var(--u) * 7)) 0 0 / 100% 100% no-repeat;
    -webkit-background-clip: text; background-clip: text;
    filter: drop-shadow(calc(var(--u) / 4) 0 0 #2b1208) drop-shadow(calc(var(--u) / -4) 0 0 #2b1208) drop-shadow(0 calc(var(--u) / 4) 0 #2b1208) drop-shadow(0 calc(var(--u) / -4) 0 #2b1208) drop-shadow(0 calc(var(--u) * 1.5) 0 #12081c); }
  @media (max-width: 700px) { .menucard .logo { --u: 8px; } }
  @media (max-width: 460px) { .menucard .logo { --u: 5px; } }
  /* panel: stepped corners, flat shadow */
  .menupanel { border: 0; border-radius: 0; background: #1b122a; box-shadow: 0 0 0 4px #8a6330, 0 0 0 8px #2b1208, 0 8px 0 8px #12081c; margin: 8px 8px 16px; width: calc(100% - 16px); }
  .menupanel::before { display: none; }
  .menucard button { border-radius: 0; font-size: 16px; text-transform: none; letter-spacing: 0; text-shadow: 2px 2px 0 #0008; transition: none; }
  .menucard button.big { font-size: 24px; padding: 14px 12px 12px; border: 4px solid #2b1208; box-shadow: inset 0 4px 0 #ffffff33, inset 0 -4px 0 #00000055; }
  .menucard button.big.primary { background: #c88a2a; color: #fff6dc; }
  .menucard button.big:not(.primary) { background: #3b4f7a; color: #eaf0ff; }
  .menucard button.big:hover:not(:disabled) { filter: none; transform: none; }
  .menucard button.big:active:not(:disabled) { transform: translateY(4px); box-shadow: inset 0 4px 0 #00000055; }
  .menucard button.big:disabled { background: #4a4458; color: #8f88a0; box-shadow: inset 0 4px 0 #ffffff1a, inset 0 -4px 0 #00000055; }
  .menurank { font-size: 24px; letter-spacing: 0; }
  .menurank small { font-size: 16px; line-height: 1.3; margin-top: 6px; }
  .menunote { font-size: 16px; line-height: 1.3; }
  .menucard .linkbtn, #menuAbandon { font-size: 16px; }
  @media (prefers-reduced-motion: reduce) { .menucard .logo { animation: none; } }
  /* tutorial */
  #tut { background: var(--panel2); border: 3px solid var(--gold); border-radius: 10px; padding: 12px 16px; margin: 10px 0 0; display: flex; flex-direction: column; gap: 4px; }
  #tut .tuttag { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  #tut .tuttitle { font-size: 17px; font-weight: 800; color: var(--gold); }
  #tut .tuttext { font-size: 14px; line-height: 1.5; }
  #tut .tutbtns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  #tut .tutbtns button.hidden { display: none; }
  #tutSkip { margin-right: auto; }   /* top left of the top bar, only during the tutorial */
  #tutSkip.hidden { display: none; }
  .linkbtn { background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; font: inherit; font-size: 14px; padding: 4px 8px; box-shadow: none; }
  .linkbtn:hover { color: var(--text); }
  #tut.nudge { animation: nudge .4s; }
  @keyframes nudge { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes tutpulse { 50% { box-shadow: 0 0 0 4px #e8b84acc, 0 0 18px #e8b84a; } }
  .tut-hl { animation: tutpulse 1.1s ease-in-out infinite; border-color: var(--gold) !important; }
  .card.tut-hl, .slot.tut-hl, .bslot.tut-hl, button.tut-hl { position: relative; }
  .tut-off { opacity: .3; filter: grayscale(.7); }
  .tut-off:not(.card) { pointer-events: none; }
  .btnpulse { animation: tutpulse 1.1s ease-in-out infinite; border-color: var(--gold) !important; }

  @media (max-width: 720px) { #info { max-width: none; } }
  /* The info panel beside the warband never changes the page height: it fills a slot as tall as the warband and scrolls inside. */
  #infoSlot { display: none; position: relative; flex: 1 1 250px; max-width: 340px; min-width: 250px; align-self: stretch; }
  #infoSlot.on { display: block; }
  #info.sidepanel { position: absolute; top: 22px; left: 0; right: 0; bottom: 0; max-width: none; min-height: 0; overflow-y: auto; }
  #info.infofloat { position: fixed; z-index: 35; min-height: 0; max-width: none; overflow-y: auto; box-shadow: 0 6px 24px #000a; }
  #info.infofloat.off { display: none; }
  @media (max-width: 480px) { #top .hbtns { gap: 6px; } #top button { padding: 5px 10px; font-size: 13px; } #top .lbl { display: none; } }
/* Look refinements (race-colour card edges, coin badge, inset slots, chunky buttons) */
.side .title{letter-spacing:2px}
/* panels: slightly crisper frame */
#top,.grid,.bench,#info{border-radius:4px;box-shadow:0 3px 0 #0006}
/* shop cards: race color edge + coin cost badge */
.card:has(.race-Human){--rc:#4f84d4}.card:has(.race-Elf){--rc:#3fb383}.card:has(.race-Orc){--rc:#c05a37}
.card:has(.race-Dwarf){--rc:#b8923f}.card:has(.race-Fae){--rc:#a56bd1}.card:has(.race-Clockwork){--rc:#8f98a8}.card:has(.race-Neutral){--rc:#e8e8e8}
.card{border-radius:4px;border-left:6px solid var(--rc,var(--line));box-shadow:0 3px 0 #0006}
.card .cost{display:inline-block;background:#0008;color:#ffd166;border:1px solid #5a4129;border-radius:10px;padding:1px 9px;font-size:13px}
/* slots: inset tile instead of dashed outline */
.slot,.bslot{border:2px solid color-mix(in srgb, var(--line) 45%, transparent);border-radius:4px;background:#0004;box-shadow:inset 0 3px 0 #0005}
/* buttons: chunky bottom edge, press sinks, NO colour change on hover */
button{border-radius:4px;box-shadow:0 3px 0 #0008}
button:hover:not(:disabled){border-color:var(--line)}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 #0008}
button.primary{background:var(--prim,#7a5a1c);font-size:17px;padding:9px 20px}
button.primary:hover:not(:disabled){border-color:var(--gold)}
.bar .track{border-radius:3px}

/* One colour scheme: midnight (blue), with a brown bench. */
:root{--bg:#0c1018;--panel:#141b28;--panel2:#1d2738;--line:#34445f;--text:#e6ebf3;--muted:#8e9bb2;--gold:#e8b84a;--prim:#5f5424}
.kwtip{background:var(--bg)}
.bench{background:#1d140e;border-color:#4a3320}
.bslot{border-color:#4a332099;background:#120c0888}
  .card { position: relative; }
  .card .cost { position: absolute; bottom: 7px; right: 7px; margin: 0; z-index: 2; }
  .card .meta .tags, #info .sub { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 4px; }
  .card .meta .tags .chip, #info .sub .chip { margin: 0; font-size: 11px; padding: 1px 7px; font-family: 'WarbandsPixel', ui-monospace, monospace; -webkit-font-smoothing: none; font-weight: 400; text-transform: uppercase; }
  .dragontag { display: inline-block; padding: 1px 5px; border-radius: 10px; font-size: 10px; font-weight: 700; background: #3a2a14; color: #ffd166; border: 1px solid #8a6638; }
  .monostar { color: var(--gold); font-size: 13px; }
  .card .monostar.corner { position: absolute; left: 50px; top: 50px; font-size: 16px; text-shadow: 0 0 2px #000, 0 1px 0 #000, 1px 0 0 #000, -1px 0 0 #000; z-index: 2; }
  #info .sub .costline { margin-left: auto; color: var(--gold); position: relative; top: -1px; }
    .card .meta b { display: block; white-space: nowrap; height: 22px; line-height: 22px; }
  .card .meta { padding-bottom: 4px; }
  .card .meta .tags .brk { flex-basis: 100%; height: 0; }
  .card .meta .tags { width: 100%; }
  .card .cost { display: inline-flex; align-items: center; gap: 3px; line-height: 1; padding: 0 8px; height: 22px; box-sizing: border-box; }
  .card { min-height: 100px; }
  .card .cost .coin { font-size: 14px; line-height: 1; display: block; transform: translateY(-2px); }
  .card .cost .num { font-size: 14px; line-height: 1; display: block; transform: translateY(1px); }
  .gold { display: inline-flex; align-items: center; gap: 3px; line-height: 1; vertical-align: middle; }
  .gold .coin { display: block; font-size: 14px; line-height: 1; transform: translateY(-2px); }
  .gold .num { display: block; line-height: 1; transform: translateY(1px); }
  button .gold { position: relative; top: -2px; }
  button .icon { display: inline-block; line-height: 1; vertical-align: middle; font-size: 14px; position: relative; top: -4px; }
  .purse { display: inline-flex; align-items: center; gap: 6px; height: 40px; box-sizing: border-box; padding: 0 12px; margin-right: 6px; background: #0008; border: 2px solid #5a4129; border-radius: 10px; color: var(--gold); font-family: 'WarbandsPixel', ui-monospace, monospace; font-size: 22px; line-height: 1; }
  .purse .coin { display: block; font-size: 20px; line-height: 1; transform: translateY(-3px); }
  .purse .num { display: block; line-height: 1; transform: translateY(1px); min-width: 2ch; text-align: center; }
  #enemyTitle .sym { display: inline-block; line-height: 1; vertical-align: middle; position: relative; top: -4.6px; }
  #top .ico, #top .sym { display: inline-block; line-height: 1; vertical-align: middle; position: relative; top: -4.2px; }
  #tPool .chip { position: relative; top: -3.1px; }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <span class="stat" id="tRank" title="Your league and ranked points"></span>
    <span class="stat">Round <b id="tRound">1</b></span>
    <span class="stat">Lives <span class="hearts" id="tLives"></span></span>
    <span class="stat">Wins <b id="tWins">0</b>/<span id="tTarget">10</span></span>
    <span class="stat">Races <span id="tPool"></span></span>
    <span class="hbtns">
      <button id="tutSkip" class="hidden">Skip tutorial</button>
      <button id="btnHelp" title="How to play" aria-label="How to play"><span class="ico">❓</span><span class="lbl"> How to play</span></button>
      <button id="btnSound" title="Sound" aria-label="Sound"><span class="ico">🔊</span><span class="lbl"> Sound on</span></button>
      <button id="btnMenu" title="Main menu" aria-label="Main menu"><span class="ico">☰</span><span class="lbl"> Menu</span></button>
    </span>
  </header>
  <div id="msg"></div>
  <section id="tut" class="hidden"><div class="tuttag"></div><div class="tuttitle"></div><div class="tuttext"></div><div class="tutbtns"><button id="tutNext" class="primary">Next</button></div></section>

  <main id="arena">
    <section class="side" id="playerSide">
      <div class="title" id="playerTitle">Your warband</div>
      <div class="bar" id="playerBar"><div class="track"><div class="fill"></div><div class="shieldbar"></div></div><div class="label"></div><div class="floats"></div><div class="slowtag"></div></div>
      <div id="foeline" class="hidden"></div>
      <div class="grid" id="playerGrid"></div>
      <div class="benchbox">
        <div class="title">Bench (does not fight)</div>
        <div class="bench" id="bench"></div>
      </div>
    </section>
    <div id="vs" class="hidden">VS</div>
    <div id="infoSlot"></div>
    <section class="side hidden" id="enemySide">
      <div class="title" id="enemyTitle">Enemy warband</div>
      <div class="bar" id="enemyBar"><div class="track"><div class="fill"></div><div class="shieldbar"></div></div><div class="label"></div><div class="floats"></div><div class="slowtag"></div></div>
      <div class="grid" id="enemyGrid"></div>
    </section>
  </main>

  <section id="shopArea">
    <div id="corePanel" class="hidden"></div>
    <div id="odds"></div>
    <div id="shop"></div>
    <div id="lower">
      <div id="controls"></div>
      <aside id="info"></aside>
    </div>
  </section>
</div>
<div id="menu" class="hidden">
  <canvas id="titleCanvas" aria-hidden="true"></canvas>
  <div class="menucard">
    <div class="logo">WARBANDS</div>
    <div class="menupanel">
    <div class="menurank" id="menuRank"></div>
    <button id="menuCont" class="primary big hidden">Continue</button>
    <button id="menuPlay" class="primary big">Play</button>
    <button id="menuTut" class="big">Tutorial</button>
    <button id="menuSkip" class="linkbtn">Skip the tutorial</button>
    <button id="menuAbandon" class="hidden">Abandon run</button>
    <div class="menunote" id="menuNote"></div>
    </div>
    <div class="menucopy"><span class="cc">©</span> 2026 AruXIV · All rights reserved</div>
  </div>
</div>
<div id="overlay" class="hidden"></div>
<div id="help" class="hidden"></div>

<script>
/*
 * Medieval Auto Battler: rules and combat engine.
 * No DOM code in here, so the same file runs in the browser and in Node (for tests).
 */
(function (root) {
  'use strict';

  // ---------------------------------------------------------------- config
  const COLS = 3, ROWS = 2, CELLS = COLS * ROWS;
  const RACES = ['Human', 'Elf', 'Orc', 'Dwarf', 'Fae', 'Clockwork'];
  // One line per race, shown in the start-of-run message. Add a line here when a race is added.
  const RACE_INFO = {
    Human: 'Variety and adaptability: gets stronger from different races on your board.',
    Elf: 'Speed and numbers: Elves only help Elves. The more Elves on your board, the faster they all attack.',
    Orc: 'Raw power: Orcs give attack to the units around them, whatever their race.',
    Dwarf: 'Shields and stubbornness: Dwarves shield your whole team, then turn the shield into damage.',
    Fae: 'Trickery: enemy units attack slower and later (at most 40% slower, and at most 2s of delay per fight).',
    Clockwork: 'Wind-up: machines attack faster every second of the fight, and wind up the units around them, whatever their race (up to 3x speed).',
  };
  // Fae limits, so the enemy can never be locked down: a team can be slowed by at most SLOW_CAP,
  // one unit by at most UNIT_SLOW_CAP (including hexes), and each unit delayed by at most DELAY_CAP seconds per fight.
  const SLOW_CAP = 0.4, UNIT_SLOW_CAP = 0.6, DELAY_CAP = 2;
  // Clockwork: the most extra speed wind-up can give one unit (+200%). All own speed bonuses together are capped at 3x anyway.
  const WIND_CAP = 2.0;
  // Numbers for the race identity units: what each race gives to every race (Orc attack, Dwarf shield, Fae slow,
  // Clockwork wind-up), the tier 3 "signposts" (one per race, marked signpost: true, they grow with units of OTHER races)
  // and the mono payoffs (the Dragons, marked mono: true).
  // The unit texts below are built from these numbers, so text and effect always match.
  // "Full board" = all 6 cells filled and every unit on the board is of that race (still reported by preview, for the UI).
  // The mono Dragons have no board bonus any more: they only scale with their own race.
  // (The engine still supports 2-cell units, w: 2, but no unit uses that any more: the Siege Engines were replaced by
  // 1-cell tier 4 Champions, so every race has Mage + Champion in tier 4.)
  const T = {
    // Human (variety): Knight shield and Priest heal = base + bonus per different race
    knightCharge: [5, 7, 7], priest: [0.065, 0.015],
    crossPer: [1.5, 2, 2], crossAtk: 4.5, gildedPer: [2, 3, 4], gildedSpeed: [1.0, 1.5, 2.0], gildedAtk: 8, // Crossbowman attack per different race and base attack; Gilded Drake: attack per different race and extra speed with 3 different races, per level
    lion: [0.08, 0.12, 0.12], lionAdj: 0.15, lionAtk: 7, // Lionheart: own speed per different race (L1/L2/L3), L3 speed for adjacent non-Humans
    // Elf (mono only)
    wyrm: [0.03, 0.04, 0.04], wyrmL3: 1, wyrmAtk: 7,   // Verdant Wyrm: Elf speed per Elf, L3 damage per Elf 
    sentinel: [0.10, 0.10, 0.17], rangerL3: 0.20,         // Sentinel: speed for adjacent (L2+: diagonal too) Elves; Ranger L3 own speed
    ranger: [0.1, 0.2, 0.2], rangerAtk: 5, spell: [1.5, 3, 3], spellAtk: 5, // Ranger attack per Elf; Spellweaver bolt damage per Elf
    moon: 0.06, moonPer: 0.005, moonHaste: [0.01, 0.01, 0.02], // Moon Priestess heal, + per Elf; Elf speed per heal (L1/L2/L3)
    dancer: [2, 3, 3], dancerL3: 0.02, dancerMax: 0.20, dancerAtk: 7.5, // Bladedancer: Elf speed counts x; L3 speed per hit to other Elves, max
    clericLv: [1, 1.2, 1.4],                           // Dryad, Moon Priestess, Runepriest: heal/shield multiplier per level
    clericEvery: [2.5, 2.5, 2],                        // Dryad, Moon Priestess, Runepriest: seconds between heals per level
    // Orc (gives attack: "hit X% harder")
    grunt: [0.15, 0.20, 0.22], gruntAtk: 4,          // Grunt: adjacent units hit harder (L3 also diagonal), own attack
    bruteAtk: 3,
    drum: 0.12, drumEvery: 2, drumFirst: [1, 1, 0],     // War Drummer: hit harder per beat, seconds per beat, time of the first beat (L1/L2/L3)
    shaman: [0.35, 0.50, 0.50],                        // Shaman: adjacent units hit harder
    skull: [0.80, 1.20, 1.20], skullAdj: 0.25, skullAtk: 10, // Skullsplitter: hits harder while the enemy bar is below half; L3 adjacent
    ash: [0.05, 0.08, 0.08], ashRamp: 0.5, ashAtk: 9,  // Ashmaw: Orcs hit harder per Orc, L3 own ramp, base attack
    // Dwarf (gives shield)
    sb: [0.08, 0.12, 0.12], rune: 0.11,                // Shieldbearer shield; Runepriest shield per rune
    magmaHit: 0.15, magma: [0.03, 0.035, 0.035], magmaAtk: 7,          // Magma Drake: shield per Dwarf, base attack
    iron: [0.035, 0.025, 0.0175], ironAtk: 7, // Ironbreaker: +1 attack per this share of the bar blocked; L3 battle-start shield
    // Fae (slows the enemy)
    pixie: [0.04, 0.05, 0.05], pixiePer: 0.01, thorn: [0.5, 0.8, 0.8], dryad: 0.09, dryadSlow: [0.01, 0.01, 0.03], // Pixie slow (+1% per Fae); Thornguard delay (s); Dryad heal, enemy slow per heal (L1/L2/L3)
    storm: 0.75, stormAtk: 7,                          // Twilight Drake: attack per Fae, base attack
    trickAtk: 7,                                       // Trickster base attack
    change: [1.3, 1.6, 1.6], changeDelay: 1, changeAtk: 5, // Changeling: share of the hardest enemy hit (counted at level 1) it copies; L3 delay (s)
    // Clockwork (gives wind-up)
    cog: [0.08, 0.11, 0.11], cogPer: 0.025, auto: [0.04, 0.06, 0.06],  // Cogling wind-up; Automaton extra wind-up per adjacent unit
    bell: [0.10, 0.12, 0.12], magus: 0.12,             // Bellringer and Brass Magus wind-up given to other units
    titan: [0.12, 0.16, 0.16], titanDmg: 1, titanL3: 0.02, titanAtk: 5.5, // Steam Titan: wind-up, damage per wind-up, L3 wind-up per hit to adjacent
    brass: [0.02, 0.025, 0.025], brassAtk: 12,         // Brass Dragon: wind-up per Clockwork for other Clockwork, base attack
    // ======== CORES (the six one-time Core shop units; see CFG.coreRound / coreCost / coreEnemy) ========
    // Each Core grows with every unit of ANOTHER race on your board, plus a small part per unit of
    // its own race. (A Dragon with Prism Hoard counts as both: it is of every race. The Wyrm itself, with no race, counts as another race.)
    // Cores are never in the shop and never level up: their numbers are already the 'grown' ones.
    // Mono Cores (each race has a mixed and a mono Core; a run offers one of the two per pool race, at random).
    lordAtk: 5, bannerExtra: 2,                         // Banner Lord (Human, mono): own attack; extra races it counts as (own key: bannerAtk is the Warbanner's)
    elderAtk: 4, elder: 0.08,                            // Elder of the Glade (Elf, mixed): own attack; attack speed for all your units per unit of another race (and Elf buffs reach every race)
    chiefAtk: 6, chief: 1.5,                            // Warchief (Orc, mono): own attack; your Orcs' % attack bonuses count this many times
    kingAtk: 5, king: 0.4,                             // Mountain King (Dwarf, mono): own attack; Dwarves hit this much harder while your shield holds
    dreamAtk: 4, dreamCap: 0.6, dreamPer: 0.01,         // Dreamweaver (Fae, mono): own attack; enemy team slow cap with it (normal: SLOW_CAP); enemy slow per Fae
    overAtk: 6, overWind: 0.10, overCap: 4,             // Overclock (Clockwork, mono): own attack, own wind-up; attack speed cap for your Clockwork
    herald: 0.8, heraldAtk: 3,                          // Herald (Human): attack for your other units per unit of another race; own attack
    song: 0.025, songAtk: 4,                             // Songweaver (Elf): a plain mono buff: Elf speed per Elf on your board; own attack
    bloodPct: 0.35, bloodAtk: 5,                         // Bloodrager (Orc): own % attack per unit of another race, base attack
    bulwark: 0.03, slayerAtk: 4,                         // Bulwark (Dwarf, mixed Core): team shield (share of the bar) per unit of another race, base attack
    satyrSlow: 0.03, stagAtk: 4.5, stagSteal: 1.2, stagShare: 0.5, // Satyr (Fae): enemy slow per unit of another race, base, speed per enemy slow, share for other Fae
    repBase: 0.06, repMix: 0.10, repAtk: 10, repRow: 0.03, // Repeater (Clockwork): base wind-up, per unit of another race; wind-up for its adjacent units
    // ======== end of CORES ========

    // ======== NEW UNITS (merge pass: 6 tier 1, 6 tier 2, 5 tier 3). Arrays are [level 1, level 2, level 3]. ========
    // Cost = tier. Base attack and seconds per attack are the atk / every numbers below (level 2 doubles attack, level 3 x3.5, as always).
    // Human
    crierAtk: 2, crierEvery: 2, crier: [1, 1.25, 1.25],      // Town Crier (T1): flat attack to adjacent units per different race (L3: diagonal too)
    pathAtk: 3.5, pathEvery: 2, path: [0.12, 0.18, 0.18],       // Pathfinder (T2): your units' first hit this much sooner per different race (biggest Pathfinder counts)
    // Elf
    twinsAtk: 3, twinsEvery: 2, twins: [0.02, 0.03, 0.03],      // Lookout (T1): attack speed for adjacent Elves per Elf on the board (L3: every Elf, itself too)
    leafAtk: 4, leafEvery: 2, leaf: [0.005, 0.008, 0.008],      // Leafmender (T2): share of the health bar healed per hit of any of your units (L3: overheal -> shield)
    runAtk: 5, runEvery: 2.2, run: [4, 3, 3],                 // Windrunner (T3): free arrow after this many hits of your other Elves (L3: its own hits count too)
    // Orc
    paintAtk: 3, paintEvery: 2, paint: [0.25, 0.35, 0.35], paint2: 0.30, // Peon (T1): +% attack to your other unit with the highest attack; L3: second-highest gets paint2
    bannerAtk: 3.5, bannerEvery: 2, banner: [0.10, 0.14, 0.14], bannerL3: 0.03, bannerL3Every: 3, // Warpainter (T2): +% attack for all your units; L3: every 3rd hit +3% more for all
    spearAtk: 5, spearEvery: 2, spear: [1.5, 2, 2], spearL3: 0.02, // Spearhurler (T3): its % attack bonuses count this many times; L3: each hit +2% attack to adjacent units
    // Dwarf
    masonAtk: 3, masonEvery: 2.5, mason: [0.035, 0.05, 0.05], // Stonemason (T1): shield (share of the bar) added by each of its hits (L3: first hit at battle start)
    skaldAtk: 3.5, skaldEvery: 2.5, skald: [0.025, 0.02, 0.02], // Shieldskald (T2): adjacent units +1 attack per this share of the bar your shield holds now (L3: diagonal too)
    deepAtk: 4, deepEvery: 2, deep: [0.18, 0.24, 0.24],        // Deepwarden (T3): new shield (share of the bar) the first time your shield breaks (L3: the second time too)
    // Fae
    puffAtk: 2.5, puffEvery: 2, puff: [0.025, 0.035, 0.035], puffGap: 2, // Puffcap (T1): enemy slow per puff, a puff every puffGap seconds (L3: first puff at battle start)
    briarAtk: 4, briarEvery: 2, briar: [0.4, 0.6, 0.6], briarHex: 0.15, // Briar Archer (T2): delay (s) per hit on the strongest enemy unit; L3: hex on it at battle start
    gloomAtk: 3, gloomEvery: 2, gloom: 1.5, gloomMax: [12, 16, 16], gloomL3: 0.2, // Gloamstalker (T3): attack per 1s of delay on the enemy (max), L3 delay per hit on the enemy that hits next
    // Clockwork
    tinkEvery: 3, tink: [0.035, 0.05, 0.05], tinkWind: 0.10,   // Tinker (T1): heal (share of the bar) every 3s, own wind-up per second (L3: first heal at battle start)
    springAtk: 3, springEvery: 2.5, spring: [0.04, 0.06, 0.06], springHead: 1, // Springwright (T2): wind-up per second for EVERY unit of yours; L3: they start wound up for 1s
    arbAtk: 4, arbEvery: 2.4, arbWind: 0.06, arb: [0.75, 1.25, 1.25], arbHead: 1, // Arbalest (T3): own wind-up, attack per unit with wind-up (itself included); L3: adjacent start wound up 1s
    // ======== end of NEW UNITS ========

    // (The mono Dragons' old board bonus was removed: Dragons only scale with their own race.)

    // Neutral (no race line, in every run): the Prismatic Wyrm, a hidden tier 6 Dragon for 10 gold.
    // Level 1: every Dragon on your board counts as a unit of every race. Level 2: Dragons get attack per other Dragon.
    // Level 3: each Dragon hit gives the other Dragons attack speed for the fight (capped per Dragon).
    prismAtk: 3, prismInterval: 2.5, prismBond: 1.5, prismChorus: 0.04, prismChorusMax: 0.40,
    prismRound: 8, prismShop: 0.004, prismEnemy: 0.01,   // from this round: chance per shop slot, and per enemy unit, to be the Wyrm
  };
  if (root.GAME_TUNE) Object.assign(T, root.GAME_TUNE);   // test hook: balance scripts can try other numbers (unused in the game)
  const pc = x => Math.round(x * 1000) / 10 + '%';
  // Dryad, Moon Priestess, Runepriest level texts: 'Every Xs. ' only when that level heals more often than the level before.
  const clericEvery = l => T.clericEvery[l - 1] !== T.clericEvery[l - 2] ? `Every ${T.clericEvery[l - 1]}s. ` : '';
  const CFG = {
    startGold: 10,
    startLives: 5,
    winTarget: 10,
    shopSize: 5,
    poolSize: 3,    // how many races are in play each run (for you, and for each enemy team)
    rerollCost: 1,
    benchSize: 6,
    maxTime: 40,    // seconds of fight time before a timeout
    tick: 0.1,
    // Big-pool test settings (balance experiments only, both off = the game as it is):
    ownBias: 0,       // chance per shop slot to draw from a race you already own (board or bench) instead of the whole pool
    freeRerolls: 0,   // free rerolls per round before rerolls cost gold
    enemyPoolSize: 0, // diagnostic: races per enemy team (0 = same as poolSize)
    // Core shop: at the start of round coreRound you may buy ONE Core (one offered per race of your pool) for coreCost gold,
    // or decline. It is offered once only. Core units are never in the normal shop and never level up.
    // coreRound 0 = no Core shop at all (the Cores then never appear for you). coreEnemy: enemy teams get one Core from coreRound on.
    coreRound: 5,
    coreCost: 5,
    coreEnemy: true,
    // "5+ of a race" threshold (used by the Dreamweaver Core; the mono Dragons no longer have a board bonus).
    monoBoard: 5,
    // Shop test setting (merge rate): chance per shop slot to show a copy of a unit you already own (board or bench, level 1-2,
    // not a Core) of a tier the slot may show this round. 0 = off (the game as it is).
    dupBias: 0,
    // Shop test setting (merge rate): per tier (index 1-5), how many of each race's units of that tier are in a run's shop.
    // Picked at random at the start of the run (s.roster). 0 = all of them. E.g. [0, 1, 1, 1, 0, 0]: each race offers one of its
    // two tier 1 units, one of its tier 2 and one of its tier 3 per run (so per-unit copies are as common as before the 17 new units).
    // Enemy teams always use the full roster. [] = off (every unit of the pool's races in every run).
    // ON since the merge pass: with all 17 new units in every shop, level 3 by round 6 fell from 79% to 38% (generic bot) and the
    // generic clear rate from 27% to 2%; with [0, 1, 1, 1, 0, 0] level 3 by round 6 is back to 80%. (dupBias 0.3 also fixed merges,
    // but pushed the mono bots to about 50%.) See merge_work/MERGE_NOTES.md.
    runPick: [0, 1, 1, 1, 0, 0],
    // Shop rule: a unit you own at level 3 (board or bench) no longer shows up in your shop (rolls and rerolls). Sell it and it
    // can come back. (Cores are never in the shop anyway.) false = the old shop.
    hideMaxed: true,
    // Enemy teams pay for their units and levels from a gold budget (see ENEMY TUNING). false = the old free level rolls.
    enemyBudget: true,
  };
  // Index = level. Damage grows fast with level because board space is the real limit.
  const MULT = [0, 1, 2, 3.5];     // attack multiplier
  // Shields, heals and speed auras no longer use a flat multiplier: each unit's level changes its ability
  // (see the lv text in DEFS and the L(u, a, b, c) picks in the combat code). Kept for reference.
  const SOFT = [0, 1, 1.5, 2.25];
  const HASTE = [0, 1, 1.25, 1.6];
  // Knight: how many times (and how strong) the shield comes back after breaking, by level.
  const KNIGHT = [[], [], [0.5], [1, 1]];

  // Chance in percent that a shop slot (and an enemy unit) is tier 1, 2, 3, 4 or 5, by round.
  // Rounds past the last row use the last row. Every row adds up to 100.

      `+${T.arb[0]} → +${T.arb[1]} attack per unit with wind-up.`,
      `Adjacent units start the fight wound up for ${T.arbHead} second${T.arbHead === 1 ? '' : 's'}.`] }),
    def('brassmagus', 'Brass Magus', 'Clockwork', 'Mage', 4, { atk: 8, interval: 2.4, lv: [
      `Adjacent units get +${pc(T.magus)} wind-up per second.`,
      'Also reaches diagonal units.',
      'Every 2nd hit deals +2 damage per Clockwork on your board.'] }),
    def('steamtitan', 'Steam Titan', 'Clockwork', 'Champion', 4, { atk: T.titanAtk, interval: 2.2, lv: [
      `Wind-up: +${pc(T.titan[0])} per second. Its wind-up also adds attack: +${Math.round(T.titanDmg * 100) / 100}% attack per 1% wind-up.`,
      `Wind-up ${pc(T.titan[0])} → ${pc(T.titan[1])} per second.`,
      `Each hit gives adjacent units +${pc(T.titanL3)} wind-up per second for the fight.`] }),
    def('brassdragon', 'Brass Dragon', 'Clockwork', 'Dragon', 5, { atk: T.brassAtk, interval: 2.4, mono: true, lv: [
      `Wind-up: +15% per second. Your other Clockwork get +${pc(T.brass[0])} wind-up per second for each Clockwork on your board.`,
      `Wind-up +${pc(T.brass[0])} → +${pc(T.brass[1])} per Clockwork.`,
      'Your Clockwork start the fight wound up for 1 second.'] }),
    // Neutral: not part of any race line or run pool. Hidden tier 6 (never in the odds display): from round T.prismRound each
    // shop slot has a T.prismShop chance to be this unit, in every run. It counts as no race itself, only through its own effect.
    def('prismwyrm', 'Prismatic Wyrm', 'Neutral', 'Dragon', 6, { cost: 10, hidden: true, atk: T.prismAtk, interval: T.prismInterval, lv: [
      'Prism Hoard: every Dragon on your board (itself included) counts as a unit of every race. They count for race numbers and get every race bonus.',
      `Hoard Bond: your Dragons get +${T.prismBond} attack for each other Dragon on your board.`,
      `Wyrm Chorus: each Dragon hit gives your other Dragons +${pc(T.prismChorus)} attack speed for the fight (max +${pc(T.prismChorusMax)} each).`] }),
  ];
  DEFS.forEach(d => { d.text = d.lv[0]; });
  // Info text for a unit at a given level: the level 1 text plus every change up to that level.
  function unitText(id, level) {
    const d = BY_ID[id];
    const out = [d.lv[0]];
    for (let l = 2; l <= (level || 1); l++) if (d.lv[l - 1]) out.push('Level ' + l + ': ' + d.lv[l - 1]);
    return out.join(' ');
  }
  // The six mono Cores (and the Elf mixed Core). Added after the list so CORE below keeps the first six Cores.
  DEFS.push(
    def('bannerlord', 'Banner Lord', 'Human', 'Warrior', 3, { atk: T.lordAtk, interval: 2, core: true, coreKind: 'mono', lv: [
      `Counts as ${T.bannerExtra} extra races.`] }),
    def('elder', 'Elder of the Glade', 'Elf', 'Bard', 3, { atk: T.elderAtk, interval: 2, core: true, coreKind: 'mixed', lv: [
      `Buffs from your Elves also reach your units of other races. Your units get +${pc(T.elder)} attack speed per unit of another race on your board.`] }),
    def('warchief', 'Warchief', 'Orc', 'Warrior', 3, { atk: T.chiefAtk, interval: 2, core: true, coreKind: 'mono', lv: [
      `Your Orcs' % attack bonuses count ${T.chief}×.`] }),
    def('mountainking', 'Mountain King', 'Dwarf', 'Warrior', 3, { atk: T.kingAtk, interval: 2.2, core: true, coreKind: 'mono', lv: [
      `While your shield holds, your Dwarves hit ${pc(T.king)} harder.`] }),
    def('dreamweaver', 'Dreamweaver', 'Fae', 'Mage', 3, { atk: T.dreamAtk, interval: 2, core: true, coreKind: 'mono', lv: [
      `Your Fae can slow the enemy up to ${pc(T.dreamCap)} instead of ${pc(SLOW_CAP)}. Enemy attack speed −${pc(T.dreamPer)} per Fae on your board.`] }),
    def('overclock', 'Overclock', 'Clockwork', 'Archer', 3, { atk: T.overAtk, interval: 2.4, core: true, coreKind: 'mono', lv: [
      `Wind-up: +${pc(T.overWind)} per second. Your Clockwork can reach ${T.overCap}× attack speed instead of 3×.`] }),
  );
  const BY_ID = {};
  DEFS.forEach(d => { BY_ID[d.id] = d; });
  // Cores are offered only in the one-time Core shop, never in the normal shop. Each race has a mixed and a mono Core:
  // CORES[race] = { mixed: id, mono: id }. CORE[race] = the race's first Core (kept for old code and tests).
  const CORE = {}, CORES = {};
  DEFS.forEach(d => { if (d.core) { if (!CORE[d.race]) CORE[d.race] = d.id; (CORES[d.race] = CORES[d.race] || {})[d.coreKind] = d.id; } });
  // One Core per race of the pool: the mixed or the mono one, at random.
  const coreOffer = (races, rng) => races.map(r => { const c = CORES[r]; if (!c) return null; const ids = [c.mixed, c.mono].filter(Boolean); return ids[Math.floor(rng() * ids.length)]; }).filter(Boolean);

  // ------------------------------------------------------------- helpers
  const ok = msg => ({ ok: true, msg: msg || '' });
  const fail = msg => ({ ok: false, msg });
  const cellsOf = (left, w) => (w === 2 ? [left, left + 1] : [left]);
  function neighbors(c) {
    const r = Math.floor(c / COLS), col = c % COLS, out = [];
    if (col > 0) out.push(c - 1);
    if (col < COLS - 1) out.push(c + 1);
    if (r > 0) out.push(c - COLS);
    if (r < ROWS - 1) out.push(c + COLS);
    return out;
  }
  function diagonals(c) {
    const r = Math.floor(c / COLS), col = c % COLS, out = [];
    [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(([dr, dc]) => {
      const rr = r + dr, cc = col + dc;
      if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS) out.push(rr * COLS + cc);
    });
    return out;
  }
  // Pick a number by level: L(u, a, b, c) is a at level 1, b at level 2, c at level 3.
  const L = (u, a, b, c) => [0, a, b, c][u.level];
  // Roll a tier from this round's odds table (the shop table, or another table given as `table`).
  function rollTier(round, rng, table) {
    const odds = table ? table[Math.min(round, table.length - 1)] : oddsFor(round);
    let x = rng() * 100;
    for (let i = 0; i < odds.length; i++) { x -= odds[i]; if (x < 0) return i + 1; }
    return 1;
  }
  // Tier 6 (the Prismatic Wyrm) is never rolled from the odds table: it has its own chance (see rollSlot and generateEnemy).
  const BY_TIER = [null, [], [], [], [], [], []];
  DEFS.forEach(d => { BY_TIER[d.tier].push(d); });
  const PRISM = 'prismwyrm';
  // Is this fighting unit a member of race r? Its own race, or every race for a Dragon on a team with a Prismatic Wyrm (Prism Hoard).
  const isRace = (u, r) => u.race === r || !!u.allRaces;
  // A random unit of the given tier. With a race given, that race is preferred when it has one in the tier.
  // Pick n different races at random (all of them if there are not more than n), in the usual order.
  function pickRaces(rng, n) {
    const pool = RACES.slice();
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    const chosen = pool.slice(0, Math.min(n, pool.length));
    return RACES.filter(r => chosen.includes(r));
  }
  function pickUnit(tier, rng, race, pool, only, skip) {
    // Cores never come from the shop or the odds. only: optional set of unit ids allowed (the run's shop roster, CFG.runPick).
    // skip: optional set of unit ids never picked (the shop rule CFG.hideMaxed). Returns undefined when nothing is left.
    const all = BY_TIER[tier].filter(d => !d.core && (!pool || pool.includes(d.race)) && (!only || only.has(d.id)) && (!skip || !skip.has(d.id)));
    const same = race ? all.filter(d => d.race === race) : [];
    const src = same.length ? same : all;
    return src[Math.floor(rng() * src.length)];
  }

  // ---------------------------------------------------------- combat setup
  // Recompute a unit's attack timer after its speed changed. Own speed bonuses (auras, wind-up, stolen speed)
  // are capped at 3x; then the slow the enemy put on this team (Fae) and on this unit (hex) is applied.
  function setSpeed(u) {
    // elfSpeed: the part of speedBonus that came from Elves; a Bladedancer counts it extra (elfMult).
    const sp = Math.min(u.speedCap || 3, 1 + u.speedBonus + u.elfSpeed * u.elfMult + u.windBonus + u.stolen);
    const cap = u.team.slowCap || SLOW_CAP;
    const slow = Math.min(UNIT_SLOW_CAP + (cap - SLOW_CAP), Math.min(cap, u.team.slowed) + u.hex);
    u.speed = sp * (1 - slow);
    u.interval = u.baseInterval / u.speed;
  }
  // Clockwork wind-up bonus at fight time t.
  const windAt = (u, t) => (u.wind > 0 ? Math.min(u.windCap || WIND_CAP, u.wind * (t + u.windHead)) : 0);
  // Push back the next attack of every unit in a team (Fae), at most DELAY_CAP seconds per unit per fight.
  function delayTeam(team, sec) {
    team.units.forEach(u => {
      const add = Math.max(0, Math.min(sec, DELAY_CAP - u.delayed));
      u.delayed += add; u.next += add;
    });
  }
  // Change a unit's speed mid-fight so it applies at once: the part of the current wait that is left
  // gets shorter or longer too (used by wind-up and by Fae slows).
  function respeed(u, t) {
    const left = Math.max(0, u.next - t) / u.interval;
    setSpeed(u);
    u.next = t + left * u.interval;
  }
  // Slow a whole team a bit more for the rest of the fight (Fae). Capped by SLOW_CAP.
  function slowTeam(team, amt, t) {
    team.slowed = Math.min(team.slowCap || SLOW_CAP, team.slowed + amt);
    team.units.forEach(u => respeed(u, t));
  }

  // slots: [{uid, id, cell, level, grow}]
  function buildTeam(slots, maxHpValue) {
    const units = slots.map(s => {
      const d = BY_ID[s.id];
      const level = s.level || 1;
      const baseInterval = d.lvInterval ? d.lvInterval[level] : d.interval;
      return {
        uid: s.uid, id: d.id, def: d, race: d.race, cell: s.cell, cells: cellsOf(s.cell, d.w),
        row: Math.floor(s.cell / COLS), level, mult: MULT[level], soft: SOFT[level], haste: HASTE[level],
        grow: s.grow || 0, buffAtk: 0, atkPct: 0, speedBonus: 0, attacks: 0, adj: [], near: [],
        speed: 1, baseInterval, interval: baseInterval, next: 0, enrage: 0, fast: false,
        // new races: wind-up rate per second and head start (Clockwork), slow/hex/delay received and stolen speed (Fae)
        wind: 0, windHead: 0, windBonus: 0, stolen: 0, hex: 0, delayed: 0, first: 1, team: null,
        // tier 4 big hitters: Elf speed (Bladedancer), bonus vs a low enemy bar (Skullsplitter), copied hit (Changeling)
        elfSpeed: 0, elfMult: 0, given: 0, execPct: 0, copyAtk: 0,
      };
    });
    const owner = {};
    units.forEach(u => u.cells.forEach(c => { owner[c] = u; }));
    units.forEach(u => {
      // adj: units next to it (up/down/left/right). near: adjacent plus diagonal units.
      const seen = new Set(), seenNear = new Set();
      u.cells.forEach(c => {
        neighbors(c).forEach(n => {
          const o = owner[n];
          if (o && o !== u && !seen.has(o)) { seen.add(o); u.adj.push(o); }
        });
        neighbors(c).concat(diagonals(c)).forEach(n => {
          const o = owner[n];
          if (o && o !== u && !seenNear.has(o)) { seenNear.add(o); u.near.push(o); }
        });
      });
    });
    // Prismatic Wyrm (Prism Hoard): the highest Wyrm level on the board (0 = none). Its effects apply once, however many Wyrms.
    const prism = units.reduce((m, u) => (u.id === PRISM ? Math.max(m, u.level) : m), 0);
    const dragons = units.filter(u => u.def.cls === 'Dragon');
    if (prism) dragons.forEach(u => { u.allRaces = true; });
    // Each unit counts once per race it belongs to (a Dragon with Prism Hoard once for each of the six races).
    const count = {};
    RACES.forEach(r => { count[r] = units.filter(u => isRace(u, r)).length; });
    let diff = RACES.filter(r => count[r] > 0).length;
    // With Prism Hoard all six races are on the board; the Human "different races" units still count at most 3 (the run pool size).
    if (prism) diff = Math.min(CFG.poolSize, diff);
    // Full board of one race: all cells filled and every unit of that race (mono payoffs check this).
    const filled = units.reduce((n, u) => n + u.cells.length, 0);
    const full = r => filled === CELLS && units.length > 0 && count[r] === units.length;
    // 5+ of a race (CFG.monoBoard; Prism Hoard Dragons count for every race), used by the Dreamweaver.
    const board5 = r => count[r] >= CFG.monoBoard;
    // Signposts: units of another race than r on the board, counted without a cap (a Prism Hoard Dragon is of every race, so it
    // counts here too).
    const other = r => units.filter(u => u.race !== r || u.allRaces).length;
    // A level 3 Militiaman counts as one extra different race (at most 3; it never lowers a count that is already above 3,
    // which only happens with run pools of more than 3 races).
    // Banner Lord (Human mono Core): counts as extra races (at most 3, like the Militiaman).
    if (units.some(u => u.id === 'bannerlord')) diff = Math.max(diff, Math.min(3, diff + T.bannerExtra));
    const team = {
      units, count, diff, full, board5, other, shield: 0, reshield: [], overheal: false,
      leaf: 0, runners: [], pathSoon: 0,   // Leafmender heal per hit, Windrunners, Pathfinder head start (merge pass units)
      shieldMult: 1, absorbed: 0,          // Dwarf: Runesmith shield bonus, shield blocked so far (Slayer)
      slowed: 0,                           // Fae: slow the enemy has put on this team
      foeSlow: 0, foeDelay: 0, hexes: [],  // Fae: what this team does to the enemy at battle start
      stagShare: 0,                        // Fae: share of the stolen speed a Satyr gives your other Fae
      prism,                               // Prismatic Wyrm level on the board (0 = none)
      elfAll: units.some(u => u.id === 'elder'),                       // Elder of the Glade: Elf buffs reach every race
      king: units.some(u => u.id === 'mountainking') ? T.king : 0,     // Mountain King: Dwarves hit harder while the shield holds
      dreamCap: 0,                                                     // Dreamweaver: higher cap for the slow this team puts on the enemy
      slowCap: SLOW_CAP,                                               // cap on the slow put on THIS team (the enemy's Dreamweaver raises it)
    };
    units.forEach(u => { u.team = team; });
    // Runesmith first, because it makes every other shield bigger.
    units.forEach(u => { if (u.id === 'runesmith') team.shieldMult += L(u, 0.4, 0.8, 0.8); });
    const addShield = v => { team.shield += v * team.shieldMult; };
    const isCW = a => isRace(a, 'Clockwork');
    // Level 2 Prismatic Wyrm (Hoard Bond): every Dragon gets flat attack per other Dragon.
    if (prism >= 2) dragons.forEach(u => { u.buffAtk += T.prismBond * (dragons.length - 1); });
    // Speed from an Elf to an Elf: also counted in elfSpeed, so a Bladedancer can count it extra.
    const elfHaste = (a, v) => { a.speedBonus += v; a.elfSpeed += v; };
    // Who receives Elf buffs: Elves, or every unit with an Elder of the Glade on the board.
    const elfGets = a => isRace(a, 'Elf') || team.elfAll;

    // Passive effects that are fixed when the fight starts.
    units.forEach(u => {
      switch (u.id) {
        case 'priest':
          if (u.level >= 2) team.overheal = true;   // overheal shield from level 2
          break;
        case 'militiaman':   // level 3: adjacent units get half of its growth as flat attack
          if (u.level === 3) u.adj.forEach(a => { a.buffAtk += (u.grow || 0) / 2; });
          break;
        case 'sentinel':
          (u.level === 1 ? u.adj : u.near).forEach(a => { if (elfGets(a)) elfHaste(a, L(u, ...T.sentinel)); });
          break;
        case 'ranger':
          if (u.level === 3) u.speedBonus += T.rangerL3;
          break;
        case 'songweaver': {
          const sp = T.song * count.Elf;
          units.forEach(a => { if (elfGets(a)) elfHaste(a, sp); });
          break;
        }
        case 'elder': {   // Elf mixed Core: attack speed for all your units (any race) per unit of another race
          const sp = T.elder * other('Elf');
          units.forEach(a => { a.speedBonus += sp; });
          break;
        }
        case 'herald': {   // Human Core: flat attack for every other unit (any race)
          const add = T.herald * other('Human');
          units.forEach(a => { if (a !== u) a.buffAtk += add; });
          break;
        }
        case 'bladedancer':
          u.elfMult += L(u, ...T.dancer) - 1;
          break;
        case 'verdantwyrm': {
          const sp = L(u, ...T.wyrm) * count.Elf;
          units.forEach(a => { if (elfGets(a)) elfHaste(a, sp); });
          break;
        }
        case 'lionheart':
          u.speedBonus += L(u, ...T.lion) * diff;
          if (u.level === 3) u.adj.forEach(a => { if (a.race !== 'Human' || a.allRaces) a.speedBonus += T.lionAdj; });
          break;
        case 'skullsplitter':
          u.execPct += L(u, ...T.skull);
          if (u.level === 3) u.adj.forEach(a => { a.execPct += T.skullAdj; });
          break;
        case 'grunt':
          (u.level === 3 ? u.near : u.adj).forEach(a => { a.atkPct += L(u, ...T.grunt); });
          break;
        case 'brute':
          if (u.level === 3) u.adj.forEach(a => { a.enrage += 1; });
          break;
        case 'drummer':
          u.beat = L(u, ...T.drumFirst);   // time of the next drumbeat
          break;
        case 'shaman':
          (u.level === 3 ? u.near : u.adj).forEach(a => { a.atkPct += L(u, ...T.shaman); });
          break;
        case 'ashmaw': {
          const per = L(u, ...T.ash) * count.Orc;
          units.forEach(a => { if (isRace(a, 'Orc')) a.atkPct += per; });
          break;
        }
        case 'gilded':
          if (diff >= 3) u.speedBonus += L(u, ...T.gildedSpeed);   // >= : with run pools of more than 3 races, 4+ races also count
          break;
        // --- Dwarf
        case 'shieldbearer':
          addShield(maxHpValue * (L(u, ...T.sb) + (u.level === 3 ? 0.01 * (count.Dwarf - 1) : 0)));
          break;
        case 'thunderer':
          if (u.level === 3) u.first = 0;
          break;
        case 'magmadrake':
          addShield(maxHpValue * (L(u, ...T.magma) * count.Dwarf));
          break;
        // --- Fae
        case 'pixie':
          team.foeSlow += L(u, ...T.pixie) + T.pixiePer * count.Fae;
          if (u.level === 3) team.foeDelay += 0.5;
          break;
        case 'thornguard':
          team.foeDelay += L(u, ...T.thorn);
          if (u.level === 3) team.foeSlow += 0.05;
          break;
        case 'trickster':
          team.hexes.push(L(u, 0.3, 0.5, 0.5));
          if (u.level === 3) team.hexes.push(0.5);
          break;
        case 'satyr':
          team.stagShare = Math.max(team.stagShare, T.stagShare);
          team.foeSlow += T.satyrSlow * other('Fae');
          break;
        // --- Clockwork: base wind-up rates
        case 'cogling':
          u.wind += L(u, ...T.cog) + T.cogPer * count.Clockwork;
          if (u.level === 3) u.adj.forEach(a => { a.wind += 0.05; });
          break;
        case 'automaton':
          u.wind += 0.12 + L(u, ...T.auto) * u.adj.length;
          if (u.level === 3) u.windHead += 2;
          break;
        case 'repeater':
          u.wind += T.repBase + T.repMix * other('Clockwork');
          u.adj.forEach(a => { a.wind += T.repRow; });
          break;
        case 'bellringer': {
          const reach = a => u.level === 3 || a.row === u.row || (u.level === 2 && u.adj.includes(a));
          units.forEach(a => { if (reach(a)) a.wind += L(u, ...T.bell); });
          if (u.level === 3) units.forEach(a => { a.windHead += 1; });
          break;
        }
        case 'brassmagus':
          (u.level === 1 ? u.adj : u.near).forEach(a => { a.wind += T.magus; });
          break;
        case 'steamtitan':
          u.wind += L(u, ...T.titan);
          break;
        case 'brassdragon':
          u.wind += 0.15;
          units.forEach(a => {
            if (a === u || !isCW(a)) return;
            a.wind += L(u, ...T.brass) * count.Clockwork;
            if (u.level === 3) a.windHead += 1;
          });
          break;
        // --- merge pass units
        case 'crier':        // Town Crier: flat attack to adjacent (L3: and diagonal) units per different race
          (u.level === 3 ? u.near : u.adj).forEach(a => { a.buffAtk += L(u, ...T.crier) * diff; });
          break;
        case 'pathfinder':   // first hit sooner for every unit (the biggest Pathfinder counts); L3: adjacent other races hit at once
          team.pathSoon = Math.max(team.pathSoon, Math.min(0.9, L(u, ...T.path) * diff));
          if (u.level === 3) u.adj.forEach(a => { if (a.race !== 'Human' || a.allRaces) a.first = 0; });
          break;
        case 'lookout':   // Elf speed per Elf: adjacent Elves (L3: every Elf, itself included)
          (u.level === 3 ? units : u.adj).forEach(a => { if (elfGets(a)) elfHaste(a, L(u, ...T.twins) * count.Elf); });
          break;
        case 'leafmender':
          team.leaf += L(u, ...T.leaf);
          if (u.level === 3) team.overheal = true;
          break;
        case 'windrunner':
          u.wc = 0; team.runners.push(u);
          break;
        case 'warpainter':
          units.forEach(a => { a.atkPct += L(u, ...T.banner); });
          break;
        case 'spearhurler':
          u.pctMult = L(u, ...T.spear);
          break;
        case 'dreamweaver':
          team.dreamCap = T.dreamCap;
          team.foeSlow += T.dreamPer * count.Fae;
          break;
        case 'bloodrager':
          u.atkPct += T.bloodPct * other('Orc');
          break;
        case 'bulwark':   // Bulwark
          addShield(maxHpValue * T.bulwark * other('Dwarf'));
          break;
        case 'overclock':
          u.wind += T.overWind;
          break;
        case 'stonemason':
          if (u.level === 3) u.first = 0;
          break;
        case 'shieldskald':  // shield bash for adjacent (L3: and diagonal) units: +1 attack per share of the bar in shield
          (u.level === 3 ? u.near : u.adj).forEach(a => { a.skaldRate = (a.skaldRate || 0) + 1 / L(u, ...T.skald); });
          break;
        case 'deepwarden': { // a new shield when your shield breaks (queued like the Knight's returning shield; same breaks add up)
          const sh = maxHpValue * L(u, ...T.deep) * team.shieldMult;
          (u.level === 3 ? [0, 1] : [0]).forEach(i => { team.reshield[i] = (team.reshield[i] || 0) + sh; });
          break;
        }
        case 'puffcap':
          u.puff = u.level === 3 ? 0 : T.puffGap;   // time of the next puff
          break;
        case 'tinker':
          u.wind += T.tinkWind;
          if (u.level === 3) u.first = 0;
          break;
        case 'springwright':
          units.forEach(a => { a.wind += L(u, ...T.spring); if (u.level === 3) a.windHead += T.springHead; });
          break;
        case 'arbalest':
          u.wind += T.arbWind;
          if (u.level === 3) u.adj.forEach(a => { a.windHead += T.arbHead; });
          break;
        default:
      }
    });
    // Warchief (Orc mono Core): your Orcs' % attack bonuses count more (on top of a Spearhurler's own multiplier).
    if (units.some(u => u.id === 'warchief')) units.forEach(a => { if (isRace(a, 'Orc')) a.pctMult = (a.pctMult || 1) * T.chief; });
    // Overclock (Clockwork mono Core): your Clockwork may reach a higher attack speed (wind-up cap raised to match).
    if (units.some(u => u.id === 'overclock')) units.forEach(a => { if (isCW(a)) { a.speedCap = T.overCap; a.windCap = WIND_CAP + (T.overCap - 3); } });
    // Reknit the Knight/Deepwarden return queue (no holes).
    for (let i = 0; i < team.reshield.length; i++) team.reshield[i] = team.reshield[i] || 0;
    // After every other battle-start effect: Peon (ranks your other units by their hit now) and Arbalest (counts wind-up).
    const startSide = { team, max: maxHpValue, shield: team.shield };
    units.forEach(u => {
      if (u.id === 'peon') {
        const ranked = units.filter(a => a !== u && a.def.kind !== 'heal')
          .sort((a, c) => atkValue(c, startSide, 0) - atkValue(a, startSide, 0) || a.cell - c.cell);
        if (ranked[0]) ranked[0].atkPct += L(u, ...T.paint);
        if (u.level === 3 && ranked[1]) ranked[1].atkPct += T.paint2;
      }
    });
    units.forEach(u => { if (u.id === 'arbalest') u.arbCount = units.filter(a => a.wind > 0).length; });
    units.forEach(u => {
      u.windBonus = windAt(u, 0);
      if (u.id === 'priest' && u.level === 3) u.first = 0;
      if (team.pathSoon) u.first *= 1 - team.pathSoon;   // Pathfinder
      setSpeed(u);
      u.next = u.interval * u.first;
    });
    return team;
  }

  // Fae: how much the strongest enemy units matter, for the Trickster's hex (damage or healing per second at battle start).
  function strength(u, side) {
    const v = u.def.kind === 'heal' ? healValue(u, side) : atkValue(u, side, 0);
    return v / u.interval;
  }
  // Fae: speed a Spirit Stag steals = the slow on the enemy team.
  function updateStolen(team, foeTeam, t) {
    const stolen = foeTeam ? Math.min(foeTeam.slowCap || SLOW_CAP, foeTeam.slowed) : Math.min(team.dreamCap || SLOW_CAP, team.foeSlow);
    team.units.forEach(u => {
      const v = u.id === 'satyr' ? T.stagSteal * stolen : (isRace(u, 'Fae') && team.stagShare ? T.stagSteal * stolen * team.stagShare : 0);   // other Fae: a share
      if (v !== u.stolen) { u.stolen = v; if (t === undefined) setSpeed(u); else respeed(u, t); }
    });
  }

  // Damage of one hit right now. side = {team, hp, max}
  function atkValue(u, side, t) {
    const d = u.def, team = side.team;
    let base;
    switch (u.id) {
      case 'militiaman': base = d.atk + u.grow; break;
      case 'crossbowman': base = d.atk + L(u, ...T.crossPer) * team.diff; break;
      case 'gilded': base = d.atk + L(u, ...T.gildedPer) * team.diff; break;
      case 'ranger': base = d.atk + L(u, ...T.ranger) * team.count.Elf; break;
      case 'brute': base = d.atk + Math.floor(t / L(u, 2, 1.5, 1.5)); break;
      case 'ashmaw': base = d.atk + (u.level === 3 ? T.ashRamp * t : 0); break;
      case 'shieldbearer': base = d.atk + 20 * (side.shield || 0) / side.max; break;
      case 'thunderer': base = d.atk + (100 / L(u, 6, 4.5, 4.5)) * team.shield / side.max; break;
      case 'twilightdrake': base = d.atk + T.storm * team.count.Fae; break;
      case 'verdantwyrm': base = d.atk + (u.level === 3 ? T.wyrmL3 * team.count.Elf : 0); break;
      case 'ironbreaker': base = d.atk + team.absorbed / (side.max * L(u, ...T.iron)); break;
      case 'changeling': base = u.copyAtk || d.atk; break;
      case 'steamtitan': base = d.atk * (1 + T.titanDmg * u.windBonus); break;
      case 'arbalest': base = d.atk + L(u, ...T.arb) * (u.arbCount || 0); break;
      case 'gloamstalker': {   // delay on the enemy units so far (only known in a fight: side.foe)
        const del = side.foe ? side.foe.units.reduce((n, f) => n + f.delayed, 0) : 0;
        base = d.atk + Math.min(L(u, ...T.gloomMax), T.gloom * del); break;
      }
      default: base = d.atk;
    }
    // Shieldskald: flat shield bash given to this unit (+1 attack per share of the bar your shield holds right now).
    const bash = u.skaldRate ? u.skaldRate * (side.shield || 0) / side.max : 0;
    // Enrage given by an adjacent level 3 Brute: +1 attack every 2 seconds.
    const extra = u.enrage ? u.enrage * Math.floor(t / 2) : 0;
    // Skullsplitter: extra damage while the enemy health bar is below half (side.foe is set during a fight only).
    const exec = u.execPct && side.foe && side.foe.hp < side.foe.max * 0.5 ? u.execPct : 0;
    // Orc buffs make a unit hit a percentage harder (atkPct), on top of everything else.
    // Spearhurler: its % bonuses count pctMult times.
    // Mountain King (Dwarf mono Core): Dwarves hit harder while your shield holds (side.shield: live shield in a fight).
    const king = team.king && isRace(u, 'Dwarf') && (side.shield || 0) > 0 ? team.king : 0;
    return (base * u.mult + u.buffAtk + extra + bash) * (1 + (u.atkPct + exec) * (u.pctMult || 1)) * (1 + king);
  }

  // Health restored by one heal. side = {team, max}
  function healValue(u, side) {
    if (u.id === 'priest') {
      const more = L(u, 1, 1.5, 2);
      return side.max * (T.priest[0] + T.priest[1] * side.team.diff) * more;
    }
    if (u.id === 'moonpriestess') return side.max * (T.moon + T.moonPer * side.team.count.Elf) * L(u, ...T.clericLv);
    // Runepriest: the value is shield, not health (Runesmith makes it bigger).
    if (u.id === 'runepriest') return side.max * T.rune * L(u, ...T.clericLv) * side.team.shieldMult;
    if (u.id === 'dryad') return side.max * T.dryad * L(u, ...T.clericLv);
    if (u.id === 'tinker') return side.max * L(u, ...T.tink);
    return 0;
  }

  // ---------------------------------------------------------------- battle
  function createBattle(playerSlots, enemySlots, round) {
    const max = maxHp(round);
    const mk = slots => {
      const team = buildTeam(slots, max);
      return { team, units: team.units, hp: max, max, shield: team.shield, startShield: team.shield, reshield: team.reshield.slice() };
    };
    const b = { round, t: 0, sides: [mk(playerSlots), mk(enemySlots)], over: false, result: null, timeout: false };
    b.sides[0].foe = b.sides[1]; b.sides[1].foe = b.sides[0];
    // Changeling: copies the hardest hit of the enemy team at battle start, counted as if that unit were level 1 and
    // without % boosts from other units (so it copies the unit, not its merges or Orc buffs). Its own level multiplier applies on top.
    const copied = [];
    const hitAtL1 = (f, side) => { const m = f.mult, p = f.atkPct; f.mult = 1; f.atkPct = 0; const v = atkValue(f, side, 0); f.mult = m; f.atkPct = p; return v; };
    b.sides.forEach(me => me.units.forEach(u => {
      if (u.id !== 'changeling') return;
      let best = null, bv = 0;
      me.foe.units.forEach(f => { if (f.def.kind === 'heal') return; const v = hitAtL1(f, me.foe); if (v > bv) { bv = v; best = f; } });
      u.copyAtk = Math.max(u.def.atk, L(u, ...T.change) * bv);
      if (u.level === 3 && best) copied.push(best);
    }));

    // Fae effects at battle start: each side slows, delays and hexes the other one.
    const fae = b.sides.some(s => s.team.foeSlow || s.team.foeDelay || s.team.hexes.length || s.units.some(u => u.race === 'Fae'));
    if (fae) {
      for (let si = 0; si < 2; si++) {
        const me = b.sides[si], foe = b.sides[1 - si];
        foe.team.slowCap = me.team.dreamCap || SLOW_CAP;
        foe.team.slowed = Math.min(foe.team.slowCap, me.team.foeSlow);
        if (me.team.hexes.length) {
          const ranked = foe.units.slice().sort((a, c) => strength(c, foe) - strength(a, foe));
          me.team.hexes.slice().sort((a, c) => c - a).forEach((h, i) => { if (ranked[i]) ranked[i].hex += h; });
        }
        // Briar Archer: its target is the strongest enemy unit at battle start (level 3: hexed too).
        const briars = me.units.filter(u => u.id === 'briararcher');
