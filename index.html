<script>
/* Medieval Auto Battler: interface. Talks to the engine in game.js (window.Game). */
(function () {
  'use strict';
  const G = window.Game;

  // Flip to true once sprites/<unit id>.png exist (32x32 PNGs). Missing files fall back to the placeholder.
  const USE_SPRITES = true;
  const ICON = { Warrior: '🛡️', Archer: '🏹', Mage: '🔮', Cleric: '💚', Bard: '🎵', Champion: '⚔️', Peasant: '🌾', Berserker: '🪓', Rogue: '🗡️', Dragon: '🐉' };

  const $ = id => document.getElementById(id);
  // Icon alignment. Emoji fonts differ between Windows, Mac, Linux and phones, so a fixed CSS nudge only looks centred on one of
  // them. Instead this measures, in the player's own fonts, where the icon's ink and the text's ink sit (canvas measureText) and
  // moves the icon so both middles line up. Runs on every icon that appears or changes.
  const ALIGN_SEL = '#top .ico, #top .sym, .menurank .sym, .menunote .sym, .rankline .sym, #enemyTitle .sym, button .icon, button .gold .coin, .sico, .menucopy .cc';
  const inkCache = new Map();
  let inkCtx = null;
  const fontOf = s => `${s.fontStyle} ${s.fontWeight} ${s.fontSize} ${s.fontFamily}`;
  function inkMid(font, text) {   // height of the ink's middle above the baseline, in px
    const k = font + '|' + text;
    if (inkCache.has(k)) return inkCache.get(k);
    inkCtx = inkCtx || document.createElement('canvas').getContext('2d');
    inkCtx.font = font;
    const m = inkCtx.measureText(text);
    const v = (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
    inkCache.set(k, v);
    return v;
  }
  function alignIcon(ic) {
    try {
      const host = ic.closest('button') || ic.parentElement;
      if (!host || !ic.textContent) return;
      const g = ic.parentElement.classList.contains('gold') ? ic.parentElement : null;
      if (g) {   // coin + number: plain inline text on the button's baseline
        g.style.display = 'inline'; g.style.top = '0'; g.style.verticalAlign = 'baseline';
        const n = g.querySelector('.num'); if (n) { n.style.display = 'inline'; n.style.transform = 'none'; }
      }
      // the text's optical middle: halfway between the middles of a capital and a small letter (descenders do not count)
      const hf = fontOf(getComputedStyle(host));
      const shift = inkMid(fontOf(getComputedStyle(ic)), ic.textContent) - (inkMid(hf, 'H') + inkMid(hf, 'x')) / 2;
      Object.assign(ic.style, { display: 'inline-block', lineHeight: '1', verticalAlign: 'baseline', position: 'relative', transform: 'none',
        top: shift.toFixed(2) + 'px' });
    } catch (e) { /* never break the UI over a nudge */ }
  }
  let alignQueued = false;
  const alignAll = () => { alignQueued = false; document.querySelectorAll(ALIGN_SEL).forEach(alignIcon); };
  const queueAlign = () => { if (!alignQueued) { alignQueued = true; requestAnimationFrame(alignAll); } };
  if (typeof MutationObserver !== 'undefined') new MutationObserver(queueAlign).observe(document.documentElement, { childList: true, subtree: true, characterData: true });
  if (document.fonts) { document.fonts.ready.then(() => { inkCache.clear(); queueAlign(); }); document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', () => { inkCache.clear(); queueAlign(); }); }
  window.addEventListener('resize', queueAlign);
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  const fmt = n => (Math.round(n * 10) / 10).toString();

  // ---------------------------------------------------------------- sound
  // All sounds are made in the browser (Web Audio), so there are no audio files. To use a real sound file later, replace the
  // function of that name in `sounds`.
  const SFX = (() => {
    let ctx = null, master = null, muted = false, noiseBuf = null;
    try { muted = localStorage.getItem('mab-muted') === '1'; } catch (e) { /* storage may be blocked */ }
    const lastAt = {};
    let winStart = 0, winCount = 0;
    function ensure() {
      if (!ctx) {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          ctx = new AC();
          master = ctx.createGain();
          master.gain.value = 0.3;
          master.connect(ctx.destination);
        } catch (e) { ctx = null; return null; }
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    function env(g, t0, dur, vol) {
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    }
    function tone(freq, dur, o) {
      o = o || {};
      const t0 = ctx.currentTime + (o.at || 0);
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
      env(g, t0, dur, (o.vol || 0.2) * (o.scale || 1));
      osc.connect(g); g.connect(master);
      osc.start(t0); osc.stop(t0 + dur + 0.03);
    }
    function noise(dur, o) {
      o = o || {};
      if (!noiseBuf) {
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      const t0 = ctx.currentTime + (o.at || 0);
      const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      src.buffer = noiseBuf;
      f.type = o.type || 'bandpass';
      f.frequency.value = o.f || 1000;
      f.Q.value = o.q || 0.8;
      env(g, t0, dur, (o.vol || 0.15) * (o.scale || 1));
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.03);
    }
    const notes = (list, step, dur, vol, type) => list.forEach((f, i) => tone(f, dur, { at: i * step, vol, type: type || 'triangle' }));
    const sounds = {
      click: () => tone(800, 0.03, { type: 'square', vol: 0.05 }),
      buy: () => { tone(1250, 0.07, { type: 'square', vol: 0.09 }); tone(1900, 0.12, { type: 'square', vol: 0.09, at: 0.07 }); },
      sell: () => { tone(900, 0.07, { type: 'square', vol: 0.08 }); tone(600, 0.12, { type: 'square', vol: 0.08, at: 0.07 }); },
      merge: lv => {
        notes(lv >= 3 ? [523, 659, 784, 1047, 1319] : [523, 659, 784], 0.07, 0.16, 0.2);
        if (lv >= 3) tone(2093, 0.4, { vol: 0.07, at: 0.3 });
      },
      reroll: () => { for (let i = 0; i < 3; i++) noise(0.03, { type: 'highpass', f: 2500, vol: 0.12, at: i * 0.045 }); },
      error: () => tone(150, 0.16, { type: 'square', to: 110, vol: 0.1 }),
      fight: () => {
        tone(70, 0.28, { to: 45, vol: 0.5 }); noise(0.1, { type: 'lowpass', f: 400, vol: 0.3 });
        tone(70, 0.28, { to: 45, vol: 0.5, at: 0.22 }); noise(0.1, { type: 'lowpass', f: 400, vol: 0.3, at: 0.22 });
      },
      win: () => notes([523, 659, 784], 0.1, 0.2, 0.2),
      lose: () => notes([330, 262], 0.16, 0.25, 0.2),
      victory: () => { notes([523, 659, 784, 1047], 0.12, 0.2, 0.22); tone(1047, 0.6, { vol: 0.18, at: 0.48 }); tone(784, 0.6, { vol: 0.12, at: 0.48 }); },
      defeat: () => { notes([392, 330, 262, 196], 0.17, 0.3, 0.22); tone(131, 0.7, { vol: 0.18, at: 0.68 }); },
      heal: () => { tone(660, 0.18, { vol: 0.08 }); tone(990, 0.2, { vol: 0.06, at: 0.06 }); },
      ward: () => tone(1400, 0.12, { vol: 0.07 }),
      crack: () => { noise(0.12, { type: 'highpass', f: 3000, vol: 0.2 }); tone(2200, 0.06, { type: 'square', to: 900, vol: 0.06 }); },
      delay: () => tone(200, 0.2, { to: 120, vol: 0.08 }),
    };
    const GAP = { heal: 350, ward: 350, delay: 500, crack: 200 }; // minimum ms between two of the same quiet sound
    function play(name, arg) {
      if (muted || !sounds[name] || !ensure()) return;
      if (GAP[name]) { const now = performance.now(); if (now - (lastAt[name] || 0) < GAP[name]) return; lastAt[name] = now; }
      sounds[name](arg);
    }
    // A hit on the enemy bar (side 0 = yours) or on yours. rel = the hit as a share of the health bar. At most 3 attack sounds per 90 ms.
    function attack(side, rel, bolt, speedFactor) {
      if (muted || !ensure()) return;
      const now = performance.now();
      if (now - winStart > 90) { winStart = now; winCount = 0; }
      if (++winCount > 3) return;
      const quiet = speedFactor >= 4 ? 0.55 : speedFactor >= 2 ? 0.8 : 1;
      const pitch = (side === 0 ? 1 : 0.72) * (0.92 + Math.random() * 0.16);
      const sc = quiet * (side === 0 ? 1 : 0.8);
      if (bolt) { tone(500 * pitch, 0.14, { type: 'sawtooth', to: 1400 * pitch, vol: 0.1, scale: sc }); return; }
      if (rel >= 0.12) { tone(110 * pitch, 0.22, { to: 45, vol: 0.4, scale: sc }); noise(0.15, { type: 'lowpass', f: 500, vol: 0.25, scale: sc }); }
      else if (rel >= 0.04) { noise(0.07, { f: 900 * pitch, vol: 0.14, scale: sc }); tone(190 * pitch, 0.09, { type: 'triangle', to: 90 * pitch, vol: 0.16, scale: sc }); }
      else { noise(0.04, { f: 1800 * pitch, q: 1.2, vol: 0.12, scale: sc }); tone(260 * pitch, 0.05, { type: 'square', to: 140 * pitch, vol: 0.07, scale: sc }); }
    }
    return {
      play, attack,
      isMuted: () => muted,
      toggle() {
        muted = !muted;
        try { localStorage.setItem('mab-muted', muted ? '1' : '0'); } catch (e) { /* ignore */ }
        if (!muted) ensure();
      },
    };
  })();

  // Saved in the browser when possible. When the browser blocks storage the tutorial is simply not forced.
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } },
    works() { try { localStorage.setItem('warband-probe', '1'); localStorage.removeItem('warband-probe'); return true; } catch (e) { return false; } },
  };
  const tutDone = () => store.get('warband-tutorial-done') === '1' || !store.works();

  // ---------------------------------------------------------------- ranked
  // rank.js: leagues and points, saved in browser storage. `run` is the ranked run in progress (null when none); while it
  // is paused, S can be the tutorial. The tutorial has no runId, so it is never saved or scored.
  const RK = window.Rank, rstore = RK.createStore();
  let run = null, lastRank = null, looping = false;
  const LIVE = { shop: 1, battle: 1, result: 1 };
  function saveRun() { if (run && S === run && LIVE[run.phase]) rstore.saveRun(RK.snapshot(run)); }
  // Score the ranked run by its wins (end of run, or abandoned). Returns what Rank.describe needs.
  function scoreRun() {
    if (!run) return null;
    const res = rstore.score(run.runId, run.wins);
    run = null;
    rstore.clearRun();
    return res;
  }
  const leagueTag = name => name + ' ' + (RK.SYMBOLS[name] || '');
  const pointsText = r => r.league >= RK.LEAGUES.length - 1 ? r.points + ' points' : r.points + ' / ' + RK.PER_LEAGUE + ' points';
  const PLURAL = { Human: 'Humans', Elf: 'Elves', Orc: 'Orcs', Dwarf: 'Dwarves', Fae: 'Fae', Clockwork: 'Clockwork' };

  let S;            // game state from the engine
  let sel = null;   // {kind: 'shop', idx} or {kind: 'unit', uid} (a unit on the board or the bench)
  let speed = 2;    // fight speed
  let PV = null;    // live numbers for the board
  let tiles = [{}, {}];
  let shopCards = [];
  let msgTimer = 0;
  let hoverInfo = null;
  let tut = null;   // tutorial state {i: index of the current step} while the tutorial runs, otherwise null
  const TUT = window.Tutorial;
  const bars = [$('playerBar'), $('enemyBar')];

  // ------------------------------------------------------------ small pieces
  const roundMsg = () => 'Round ' + S.round + ': ' + S.gold + ' gold to spend.' + (S.coreShop && S.coreShop.open ? ' Choose your Core!' : '');
  function say(text, bad) {
    const m = $('msg');
    m.textContent = text || '';
    m.classList.toggle('bad', !!bad);
    clearTimeout(msgTimer);
    if (text) msgTimer = setTimeout(() => { m.textContent = ''; }, 4000);
  }

  function makeTile(d, o) {
    const t = el('div', 'unit race-' + d.race + (d.cls === 'Dragon' ? ' top' : '') + (d.core ? ' corebox' : '') + (o.mirror ? ' mirror' : ''));
    const icon = () => el('div', 'ico', ICON[d.cls]);
    if (USE_SPRITES) {
      const img = new Image();
      img.className = 'sprite';
      img.alt = d.name;
      img.draggable = false;   // the browser's own image drag would steal the mouse from our drag and drop
      img.onerror = () => { img.replaceWith(icon()); };
      img.src = (window.SPRITE_DATA && window.SPRITE_DATA[d.id]) || 'sprites/' + d.id + '.png';
      t.appendChild(img);
    } else {
      t.appendChild(icon());
    }
    // Level stars on units on the board and bench (shop and Core cards pass no level). Cores never level up: no star.
    if (o.level && !d.core) t.appendChild(el('div', 'stars', '★'.repeat(o.level)));
    if (o.badge) t.appendChild(el('div', 'badge', o.badge));
    return t;
  }

  function pulse(t, cls, ms) {
    t.classList.remove(cls);
    void t.offsetWidth;
    t.classList.add(cls);
    setTimeout(() => t.classList.remove(cls), ms);
  }

  function floatText(side, text, cls) {
    const f = el('span', 'float ' + cls, text);
    f.style.left = 12 + Math.random() * 66 + '%';
    bars[side].querySelector('.floats').appendChild(f);
    setTimeout(() => f.remove(), 950);
  }

  // Health (red) with the shield (blue) attached to its end. When health + shield is more than the maximum, the bar is
  // scaled so both still fit.
  function setBar(side, hp, max, shield) {
    const b = bars[side];
    const h = Math.max(0, hp), sh = Math.max(0, shield);
    const total = Math.max(max, h + sh);
    b.querySelector('.fill').style.width = (h / total) * 100 + '%';
    const sb = b.querySelector('.shieldbar');
    sb.style.left = (h / total) * 100 + '%';
    sb.style.width = (sh / total) * 100 + '%';
    b.querySelector('.label').textContent = Math.ceil(h) + (sh > 0.5 ? ' + ' + Math.ceil(sh) : '') + ' / ' + max;
  }

  // ------------------------------------------------------------- rendering
  function renderTop() {
    const tr = $('tRank'); tr.innerHTML = '';
    if (tut) tr.textContent = 'Tutorial (no ranked points)';
    else {
      const r = rstore.load();
      tr.appendChild(document.createTextNode(RK.name(r) + ' '));
      tr.appendChild(el('span', 'sym', RK.SYMBOLS[RK.name(r)] || ''));
      tr.appendChild(document.createTextNode(' '));
      tr.appendChild(el('b', '', String(r.points)));
      tr.title = RK.name(r) + ': ' + pointsText(r) + (RK.toNext(r) != null ? ' (100 promotes)' : '');
    }
    $('tRound').textContent = S.round;
    const pool = $('tPool'); pool.innerHTML = '';
    S.pool.forEach(r => pool.appendChild(el('span', 'chip race-' + r, r)));
    $('tWins').textContent = S.wins;
    $('tTarget').textContent = S.winTarget || G.CFG.winTarget;
    $('tLives').textContent = '♥'.repeat(Math.max(0, S.lives)) + '♡'.repeat(Math.max(0, G.CFG.startLives - S.lives));
  }

  function renderGrid(side) {
    const grid = $(side === 0 ? 'playerGrid' : 'enemyGrid');
    grid.innerHTML = '';
    tiles[side] = {};
    const mirror = side === 1;
    const interactive = side === 0 && S.phase === 'shop';
    for (let c = 0; c < G.CELLS; c++) {
      const slot = el('div', 'slot' + (interactive ? ' live' : ''));
      if (side === 0) slot.dataset.dropCell = c;
      slot.style.gridRow = Math.floor(c / 3) + 1;
      slot.style.gridColumn = mirror ? 3 - (c % 3) : (c % 3) + 1;
      if (interactive) slot.onclick = () => onSlot(c);
      grid.appendChild(slot);
    }
    const units = side === 0 ? S.board : (S.enemy ? S.enemy.slots : []);
    for (const u of units) {
      const d = G.BY_ID[u.id];
      let badge = null;
      if (side === 0 && S.phase === 'shop' && PV && PV.units[u.uid]) {
        const p = PV.units[u.uid];
        badge = p.heal !== undefined ? (G.BY_ID[u.id].ward ? '🛡' : '+') + fmt(p.heal) : '⚔' + fmt(p.atk);
      }
      const t = makeTile(d, { level: u.level, badge, mirror });
      if (side === 0) { t.dataset.dropCell = u.cell; t.dataset.dragUid = u.uid; }
      const col = u.cell % 3;
      t.style.gridRow = Math.floor(u.cell / 3) + 1;
      t.style.gridColumn = ((mirror ? 3 - (col + d.w) : col) + 1) + ' / span ' + d.w;
      if (side === 0 && S.phase === 'shop') t.onclick = () => onUnit(u.uid);
      t.onmouseenter = () => { hoverInfo = { d, unit: u, side, el: t }; renderInfo(); };
      t.onmouseleave = () => { hoverInfo = null; renderInfo(); };
      if (side === 0 && sel && sel.kind === 'unit' && sel.uid === u.uid) t.classList.add('selected');
      tiles[side][u.uid] = t;
      grid.appendChild(t);
    }
  }

  function renderBench() {
    const bench = $('bench');
    bench.innerHTML = '';
    const live = S.phase === 'shop';
    bench.classList.toggle('idle', !live);
    S.bench.forEach((u, slot) => {
      const cell = el('div', 'bslot' + (live ? ' live' : ''));
      cell.dataset.dropBench = slot;
      if (live) cell.onclick = () => onBenchSlot(slot);
      if (u) {
        const d = G.BY_ID[u.id];
        const t = makeTile(d, { level: u.level });
        t.dataset.dragUid = u.uid;
        t.onclick = e => { e.stopPropagation(); if (live) onBenchSlot(slot); };
        t.onmouseenter = () => { hoverInfo = { d, unit: u, side: 0, el: t }; renderInfo(); };
        t.onmouseleave = () => { hoverInfo = null; renderInfo(); };
        if (sel && sel.kind === 'unit' && sel.uid === u.uid) t.classList.add('selected');
        cell.appendChild(t);
      }
      bench.appendChild(cell);
    });
  }

  function renderBars() {
    const max = G.maxHp(S.round);
    const b = S.battle;
    for (let si = 0; si < 2; si++) {
      if (b) setBar(si, b.sides[si].hp, b.sides[si].max, b.sides[si].shield);
      else setBar(si, max, max, PV && si === 0 ? PV.shield : 0);
      const slow = b ? b.sides[si].team.slowed : 0;
      { const st = bars[si].querySelector('.slowtag'); st.textContent = '';
        if (slow > 0.005) { st.appendChild(el('span', 'snail', '🐌')); st.appendChild(document.createTextNode(' slowed ' + Math.round(slow * 100) + '%')); } }
      if (b) b.sides[si].units.forEach(x => { const t = tiles[si][x.uid]; if (t) t.classList.toggle('hexed', x.hex > 0); });
    }
    const foe = $('foeline');
    if (PV && S.phase === 'shop' && (PV.foeSlow > 0 || PV.foeDelay > 0 || (PV.hexes && PV.hexes.length))) {
      const bits = [];
      if (PV.foeSlow > 0) bits.push('enemies ' + Math.round(PV.foeSlow * 100) + '% slower');
      if (PV.foeDelay > 0) bits.push('their first attacks ' + fmt(PV.foeDelay) + 's later');
      if (PV.hexes && PV.hexes.length) bits.push(PV.hexes.length + ' hexed enemy unit' + (PV.hexes.length > 1 ? 's' : ''));
      foe.textContent = 'Your Fae at battle start: ' + bits.join(', ') + '.';
      foe.classList.remove('hidden');
    } else if (S.phase === 'shop' && S.pool.includes('Fae')) { foe.textContent = '\u00a0'; foe.classList.remove('hidden'); }
    else foe.classList.add('hidden');
  }

  const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI'];
  // Race pill (same colours as the start-of-run card), optional Dragon tag.
  function tagsFor(d, long) {
    const f = document.createDocumentFragment();
    f.appendChild(el('span', 'chip race-' + d.race, d.race === 'Neutral' ? 'Prismatic' : d.race));
    if (d.cls === 'Dragon') { if (!long) f.appendChild(el('span', 'brk')); f.appendChild(el('span', 'dragontag', 'Dragon')); }
    return f;
  }
  // Gold amount with the coin: the coin and the number are centred on each other (see .gold in index.html).
  function goldSpan(n) {
    const g = el('span', 'gold');
    g.appendChild(el('span', 'coin', '🪙'));
    g.appendChild(el('span', 'num', String(n)));
    return g;
  }
  function renderShop() {
    const box = $('shop');
    box.innerHTML = '';
    shopCards = [];
    // While the Core choice is open (round 5) it takes the shop's place: no shop cards until you buy a Core or skip.
    const coreOpen = !!(S.coreShop && S.coreShop.open);
    box.classList.toggle('hidden', S.phase !== 'shop' || coreOpen);
    const oddsEl = $('odds');
    oddsEl.classList.toggle('hidden', S.phase !== 'shop' || coreOpen);
    if (S.phase !== 'shop' || coreOpen) return;
    // "Chance per slot": one little chip per cost, the coin + cost and the chance in percent.
    oddsEl.innerHTML = '';
    oddsEl.appendChild(el('span', 'oddslabel', 'Chance per slot'));
    G.tierOdds(S.round).forEach((p, i) => {
      if (p <= 0) return;
      const chip = el('span', 'oddschip');
      chip.appendChild(el('span', 'coin', '🪙'));
      chip.appendChild(el('span', 'cost', String(i + 1)));
      chip.appendChild(el('span', 'pct', p + '%'));
      oddsEl.appendChild(chip);
    });
    S.shop.forEach((id, idx) => {
      const card = el('div', 'card');
      shopCards.push(card);
      if (!id) { card.classList.add('empty'); card.appendChild(el('div', 'meta', 'Sold out')); box.appendChild(card); return; }
      const d = G.BY_ID[id];
      if (S.gold < d.cost) card.classList.add('poor');
      if (sel && sel.kind === 'shop' && sel.idx === idx) card.classList.add('selected');
      card.appendChild(makeTile(d, {}));
      const meta = el('div', 'meta');
      meta.innerHTML = '<b></b><div class="tags"></div>';
      meta.querySelector('b').textContent = d.name;
      meta.querySelector('.tags').appendChild(tagsFor(d, false));
      if (d.mono) card.appendChild(el('span', 'monostar corner', '★'));
      else if (d.signpost) card.appendChild(el('span', 'monostar corner', '◇'));
      { const c = el('span', 'cost'); c.appendChild(goldSpan(d.cost).childNodes[0]); c.appendChild(el('span', 'num', String(d.cost))); card.appendChild(c); }
      if (G.completesMerge(S, id)) meta.appendChild(el('div', 'mergetag', '★ completes a merge'));
      card.appendChild(meta);
      card.dataset.dragShop = idx;
      card.onclick = () => onShop(idx);
      card.onmouseenter = () => { hoverInfo = { d, unit: null, side: -1, el: card }; renderInfo(); };
      card.onmouseleave = () => { hoverInfo = null; renderInfo(); };
      box.appendChild(card);
    });
    fitShopNames();
  }
  // Round 5 Core offer: one Core per race of the run pool, one pick (click a card to look at it, click it again to buy), or skip.
  function renderCore() {
    const box = $('corePanel');
    const c = S.coreShop;
    const show = S.phase === 'shop' && c && c.open;
    box.classList.toggle('hidden', !show);
    box.innerHTML = '';
    if (!show) return;
    const head = el('div', 'corehead');
    head.appendChild(el('div', 'coretitle', 'Choose your Core'));
    head.appendChild(el('div', 'coresub', 'One pick for ' + c.cost + ' gold, now or never. ◇ Mixed Cores like many races, ◈ Mono Cores like one.'));
    box.appendChild(head);
    const row = el('div', 'corecards');
    c.offer.forEach((id, idx) => {
      const d = G.BY_ID[id];
      const card = el('div', 'card');
      if (S.gold < c.cost) card.classList.add('poor');
      if (sel && sel.kind === 'core' && sel.idx === idx) card.classList.add('selected');
      card.appendChild(makeTile(d, {}));
      const meta = el('div', 'meta');
      meta.innerHTML = '<b></b><div class="tags"></div>';
      meta.querySelector('b').textContent = d.name;
      meta.querySelector('.tags').appendChild(tagsFor(d, false));
      card.appendChild(el('span', 'monostar corner', d.coreKind === 'mono' ? '◈' : '◇'));
      meta.appendChild(el('div', 'coretag', d.coreKind === 'mono' ? '◈ Mono Core' : '◇ Mixed Core'));
      { const cs = el('span', 'cost'); cs.appendChild(goldSpan(c.cost).childNodes[0]); cs.appendChild(el('span', 'num', String(c.cost))); card.appendChild(cs); }
      card.appendChild(meta);
      card.dataset.dragCore = idx;
      card.onclick = () => onCore(idx);
      card.onmouseenter = () => { hoverInfo = { d, unit: null, side: -1, el: card }; renderInfo(); };
      card.onmouseleave = () => { hoverInfo = null; renderInfo(); };
      row.appendChild(card);
    });
    box.appendChild(row);
    const skip = el('button', 'coreskip', 'Skip the Core');
    skip.onclick = () => { if (allowOf()) { tutNo('Take the highlighted Core.'); return; } sel = null; act(G.declineCore(S)); };
    box.appendChild(skip);
  }
  const coreOk = (a, idx) => a.core === true || (Array.isArray(a.core) && a.core.indexOf(idx) >= 0);
  // Buy the selected Core onto a board cell or bench slot (click the Core, then the spot, or drag it there).
  function coreTo(idx, to) {
    const ta = allowOf();
    if (ta && !coreOk(ta, idx)) { tutNo(ta.core ? 'Take the highlighted Core.' : ''); return; }
    act(G.buyCore(S, idx, to), 'buy');
  }
  function onCore(idx) {
    if (S.phase !== 'shop' || !S.coreShop || !S.coreShop.open) return;
    const ta = allowOf();
    if (ta && !coreOk(ta, idx)) { tutNo(ta.core ? 'Take the highlighted Core.' : ''); return; }
    if (sel && sel.kind === 'core' && sel.idx === idx) { act(G.buyCore(S, idx), 'buy'); return; }
    sel = { kind: 'core', idx };
    renderAll();
  }
  // Long unit names (Skullsplitter, Prismatic Wyrm ...) are made smaller until their longest word fits the card.
  function fitShopNames() {
    $('shop').querySelectorAll('.card .meta b').forEach(b => {
      const meta = b.parentElement;
      b.style.fontSize = '';
      let px = 16;
      while (px > 8 && meta.scrollWidth > meta.clientWidth + 0.5) b.style.fontSize = (--px) + 'px';
    });
  }
  window.addEventListener('resize', () => { if (S && S.phase === 'shop') fitShopNames(); });

  function renderControls() {
    const c = $('controls');
    c.innerHTML = '';
    if (S.phase === 'shop') {
      const ta = allowOf();
      const reroll = el('button', '', 'Reroll ');
      reroll.appendChild(goldSpan(G.CFG.rerollCost));
      const coreOpen = !!(S.coreShop && S.coreShop.open);   // the Core choice replaces the shop: no reroll or lock until it is done
      reroll.disabled = coreOpen || S.gold < G.CFG.rerollCost || (ta && !ta.reroll);
      if (ta && ta.reroll && !ta.shop) reroll.classList.add('tut-hl');
      reroll.onclick = () => act(G.reroll(S), 'reroll');
      const at = sel && sel.kind === 'unit' ? G.locate(S, sel.uid) : null;
      const selUnit = at ? at.unit : null;
      const sellBtn = el('button', '', selUnit ? 'Sell +' : 'Sell');
      if (selUnit) sellBtn.appendChild(goldSpan(G.sellValue(selUnit)));
      sellBtn.disabled = !selUnit || (ta && !ta.sell);
      if (ta && ta.sell && selUnit) sellBtn.classList.add('tut-hl');
      sellBtn.onclick = () => {
        if (!selUnit || sellBtn.disabled) return;
        act(G.sell(S, selUnit.uid));
      };
      const fight = el('button', 'primary', 'Fight!');
      fight.disabled = (ta && !ta.fight);
      if (ta && ta.fight) fight.classList.add('tut-hl');
      fight.onclick = startFight;
      const lock = el('button', S.locked ? 'on' : '');
      lock.appendChild(el('span', 'icon', S.locked ? '🔒' : '🔓'));
      lock.appendChild(document.createTextNode(S.locked ? ' Locked' : ' Lock'));
      lock.title = S.locked ? 'The shop keeps these cards after the next fight. Click to unlock.' : 'Keep these cards: the shop will not reroll after the next fight.';
      lock.disabled = coreOpen;
      lock.onclick = () => { if (lock.disabled) return; SFX.play('click'); act(G.toggleLock(S)); };
      const purse = el('span', 'purse');
      purse.title = 'Your gold';
      purse.appendChild(el('span', 'coin', '🪙'));
      purse.appendChild(el('span', 'num', String(S.gold)));
      // The lesson rounds use fixed shops, so Lock only shows once they are over (and in normal games).
      if (tut && curStep() && curStep().hl === 'lock') lock.classList.add('tut-hl');
      if (tut && S.round <= TUT.LESSONS) c.append(purse, reroll, sellBtn, fight); else c.append(purse, reroll, lock, sellBtn, fight);
    } else if (S.phase === 'battle') {
      [1, 2, 4].forEach(sp => {
        const b = el('button', sp === speed ? 'on' : '', '×' + sp);
        b.onclick = () => { speed = sp; renderControls(); };
        c.appendChild(b);
      });
      const skip = el('button', '', 'Skip');
      skip.onclick = skipFight;
      c.appendChild(skip);
    }
  }

  // Words in unit texts that get a hover/tap explanation (the first time each one shows up in the info box).
  const KW = [
    ['different races?|extra races', 'Every race on your board counts once, however many units of it you have. Units that grow per different race count at most 3 races.'],
    ['5\\+ Fae', 'At least 5 units on your board are of that race.'],
    ['adjacent', 'The units directly left, right, above or below. Corners do not count.'],
    ['diagonal', 'The units touching at a corner.'],
    ['wind-up|wound up', 'Attack speed that grows every second of the fight (at most +200%).'],
    ['enrages?', 'Gains +1 attack again and again during the fight.'],
    ['hexes|hexed', 'A hexed enemy unit attacks slower for the whole fight.'],
    ['delays?', 'Pushes the next enemy attacks back. One unit can be delayed at most 2s per fight.'],
    ['stolen speed', 'The Spirit Stag attacks faster, based on how much Fae slow the enemy team.'],
    ['health bar', 'The bar your whole warband shares. When it is empty you lose the fight.'],
    ['shields?', 'Soaks up damage before the health bar does.'],
  ];
  // Race names in unit texts are shown as the coloured race pills.
  const RACEWORD = 'Humans?|Elf|Elves|Orcs?|Dwarf|Dwarves|Fae|Clockwork|Prismatic';
  const RACEMAP = { human: 'Human', humans: 'Human', elf: 'Elf', elves: 'Elf', orc: 'Orc', orcs: 'Orc', dwarf: 'Dwarf', dwarves: 'Dwarf', fae: 'Fae', clockwork: 'Clockwork', prismatic: 'Neutral' };
  const raceOf = w => RACEMAP[w.toLowerCase()];
  const KWRE = new RegExp('(' + KW.map(k => k[0]).join('|') + '|\\b(?:' + RACEWORD + ')\\b)', 'i');
  // Plain text with the race names turned into pills (tutorial and help texts).
  const RACETEXTRE = new RegExp('\\b(' + RACEWORD + ')\\b');
  function raceText(parent, text) {
    parent.textContent = '';
    let rest = text;
    while (rest) {
      const m = RACETEXTRE.exec(rest);
      if (!m) { parent.appendChild(document.createTextNode(rest)); return; }
      if (m.index) parent.appendChild(document.createTextNode(rest.slice(0, m.index)));
      parent.appendChild(el('span', 'chip race-' + raceOf(m[0]) + ' inline', m[0]));
      rest = rest.slice(m.index + m[0].length);
    }
  }
  function rich(parent, text, used) {
    let rest = text;
    while (rest) {
      const m = KWRE.exec(rest);
      if (!m) { parent.appendChild(document.createTextNode(rest)); return; }
      if (m.index) parent.appendChild(document.createTextNode(rest.slice(0, m.index)));
      const rc = new RegExp('^(?:' + RACEWORD + ')$', 'i').test(m[0]) && raceOf(m[0]);
      if (rc) { parent.appendChild(el('span', 'chip race-' + rc + ' inline', m[0])); rest = rest.slice(m.index + m[0].length); continue; }
      const k = KW.find(x => new RegExp('^(' + x[0] + ')$', 'i').test(m[0]));
      if (k && !used.has(k)) {
        used.add(k);
        const sp = el('span', 'kw', m[0]);
        sp.tabIndex = 0;
        sp.dataset.tip = k[1];
        parent.appendChild(sp);
      } else parent.appendChild(document.createTextNode(m[0]));
      rest = rest.slice(m.index + m[0].length);
    }
  }
  // One floating tip for all keywords (hover on a mouse, tap on a phone).
  const kwTip = el('div', 'kwtip hidden');
  document.body.appendChild(kwTip);
  function showKw(t) {
    kwTip.textContent = t.dataset.tip;
    kwTip.classList.remove('hidden');
    const r = t.getBoundingClientRect(), w = kwTip.offsetWidth, h = kwTip.offsetHeight;
    kwTip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
    kwTip.style.top = (r.top - h - 8 < 8 ? r.bottom + 8 : r.top - h - 8) + 'px';
  }
  document.addEventListener('mouseover', e => { const t = e.target.closest && e.target.closest('.kw'); if (t) showKw(t); });
  document.addEventListener('mouseout', e => { if (e.target.closest && e.target.closest('.kw')) kwTip.classList.add('hidden'); });
  document.addEventListener('click', e => {
    const t = e.target.closest && e.target.closest('.kw');
    if (t) showKw(t); else kwTip.classList.add('hidden');
  });

  function infoBox(d, unit, side) {
    const box = $('info');
    box.innerHTML = '';
    kwTip.classList.add('hidden');
    box.appendChild(el('h3', '', d.name));
    { const sub = el('div', 'sub'); sub.appendChild(tagsFor(d, true)); { const cl = el('span', 'costline'); cl.appendChild(goldSpan(d.core ? G.CFG.coreCost : d.cost)); if (d.w === 2) cl.appendChild(document.createTextNode(' · 2 cells')); sub.appendChild(cl); } box.appendChild(sub); }
    if (d.race === 'Neutral') box.appendChild(el('div', 'monotag', '◆ Prismatic: no race, can show up in every run (rare, from round ' + G.TUNING.prismRound + ')'));
    if (d.mono) box.appendChild(el('div', 'monotag', '★ Mono: grows with every ' + d.race + ' on your board'));

    // The numbers first: what this unit does right now on your board (or its base numbers).
    const live = el('div', 'live');
    const p = unit && side === 0 && S.phase === 'shop' && PV ? PV.units[unit.uid] : null;
    const addLive = t => live.appendChild(el('div', '', t));
    if (p) {
      const line = p.heal !== undefined
        ? (d.ward ? 'Adds a shield of ' : 'Heals ') + fmt(p.heal) + ' every ' + fmt(p.interval) + 's'
        : 'Attack ' + fmt(p.atk) + ' every ' + fmt(p.interval) + 's';
      addLive('Right now: ' + line + (p.speed > 1.001 ? ' (speed ×' + fmt(p.speed) + ')' : ''));
      if (p.wind > 0) addLive('Winds up +' + Math.round(p.wind * 100) + '% speed per second');
      if (p.atkPct > 0) addLive('Orc buffs: +' + Math.round(p.atkPct * 100) + '% attack');
      if (/knight|shieldbearer|magmadrake/.test(d.id) && PV.shield > 0) addLive('Your team\'s battle-start shield: ' + fmt(PV.shield));
      if (PV.prism && d.cls === 'Dragon') addLive('Prism Hoard: counts as every race');
      if (d.signpost && PV.other) addLive('Units of another race counted: ' + PV.other[d.race]);
    } else {
      const bar = G.maxHp(S ? S.round : 1);
      addLive(d.kind === 'heal' ? (d.ward ? 'Adds a shield every ' : 'Heals every ') + d.interval + 's'
        : d.pct ? 'Hits for ' + Math.round(d.pct * 100) + '% of the bar (about ' + fmt(d.pct * bar) + ' this round) every ' + d.interval + 's'
        : 'Base attack ' + d.atk + ' every ' + d.interval + 's');
    }
    if (unit) {
      const where = G.locate(S, unit.uid);
      if (where && where.zone === 'bench') addLive('On the bench: does not fight.');
    }
    box.appendChild(live);

    const curLv = unit ? unit.level : 1;
    const used = new Set();
    d.lv.forEach((t, i) => {
      const row = el('p', 'lvline' + (i + 1 <= curLv ? ' cur' : ' next'));   // every level the unit has reached reads as active
      if (!d.core) row.appendChild(el('b', '', 'Lv ' + (i + 1) + ' '));   // Cores never level up: no level label
      rich(row, t, used);
      box.appendChild(row);
    });
  }

  // On small screens the info box would sit far below the board, so it floats next to the unit instead.
  const smallScreen = () => window.matchMedia('(max-width: 720px)').matches;
  function placeInfo(anchor, show) {
    const box = $('info');
    if (!smallScreen()) {
      box.classList.remove('infofloat', 'off');
      box.style.left = box.style.top = box.style.maxHeight = box.style.width = box.style.pointerEvents = '';
      // In the shop phase the info sits right next to your warband (where the enemy shows up in a fight).
      const target = S.phase === 'shop' ? $('infoSlot') : $('lower');
      if (box.parentElement !== target) target.appendChild(box);
      $('infoSlot').classList.toggle('on', target === $('infoSlot'));
      box.classList.toggle('sidepanel', target === $('infoSlot'));
      return;
    }
    box.classList.remove('sidepanel');
    $('infoSlot').classList.remove('on');
    if (box.parentElement !== $('lower')) $('lower').appendChild(box);
    box.classList.add('infofloat');
    if (!show || !anchor || !anchor.isConnected) { box.classList.add('off'); return; }
    box.classList.remove('off');
    const vw = window.innerWidth, vh = window.innerHeight, m = 8;
    const w = Math.min(340, vw - 2 * m);
    box.style.width = w + 'px';
    box.style.maxHeight = '';
    const r = anchor.getBoundingClientRect();
    const spaceAbove = r.top - m * 2, spaceBelow = vh - r.bottom - m * 2;
    const h = box.offsetHeight;
    let top, maxH;
    if (h <= spaceBelow || spaceBelow >= spaceAbove) { top = r.bottom + m; maxH = Math.max(120, vh - top - m); }
    else { maxH = Math.max(120, Math.min(h, spaceAbove)); top = Math.max(m, r.top - m - Math.min(h, maxH)); }
    box.style.maxHeight = maxH + 'px';
    box.style.top = top + 'px';
    box.style.left = Math.max(m, Math.min(vw - w - m, r.left + r.width / 2 - w / 2)) + 'px';
    box.style.pointerEvents = hoverInfo && window.matchMedia('(hover: hover)').matches ? 'none' : '';
  }

  function renderInfo() {
    $('info').classList.remove('idle');
    if (hoverInfo) { infoBox(hoverInfo.d, hoverInfo.unit, hoverInfo.side); placeInfo(hoverInfo.el, true); return; }
    if (sel && sel.kind === 'unit') {
      const at = G.locate(S, sel.uid);
      if (at) { infoBox(G.BY_ID[at.unit.id], at.unit, 0); placeInfo(document.querySelector('#playerGrid .selected, #bench .selected'), true); return; }
    }
    if (sel && sel.kind === 'shop' && S.shop[sel.idx]) { infoBox(G.BY_ID[S.shop[sel.idx]], null, -1); placeInfo(document.querySelector('#shop .selected'), true); return; }
    if (sel && sel.kind === 'core' && S.coreShop && S.coreShop.offer[sel.idx]) { infoBox(G.BY_ID[S.coreShop.offer[sel.idx]], null, -1); placeInfo(document.querySelector('#corePanel .selected'), true); return; }
    const box = $('info');
    box.innerHTML = '';
    placeInfo(null, false);
    box.classList.add('idle');
  }
  window.addEventListener('resize', () => { if (S) renderInfo(); });

  function renderAll() {
    tutCheck();
    PV = S.phase === 'shop' ? G.preview(S.board, S.round) : null;
    const inFight = S.phase !== 'shop';
    $('enemySide').classList.toggle('hidden', !inFight);
    $('vs').classList.toggle('hidden', !inFight);
    document.querySelector('.benchbox').classList.toggle('hidden', inFight);
    {
      const t = $('enemyTitle');
      t.textContent = '';
      const lg = inFight && S.enemy && S.enemy.league;
      t.appendChild(document.createTextNode('Enemy warband' + (lg ? ' (' + S.enemy.league + ' ' : '')));
      if (lg) { t.appendChild(el('span', 'sym', RK.SYMBOLS[S.enemy.league] || '')); t.appendChild(document.createTextNode(')')); }
      // In a fight, both titles show the races that are really on that board (not the run pool), so they always match the units.
      const raceRow = ids => {
        const row = el('div', 'enemyraces'), seen = [];
        ids.forEach(id => { const r = G.BY_ID[id] && G.BY_ID[id].race; if (r && !seen.includes(r)) seen.push(r); });
        seen.forEach(r => row.appendChild(el('span', 'chip race-' + r, r === 'Neutral' ? 'Prismatic' : r)));
        return row;
      };
      if (inFight && S.enemy) t.appendChild(raceRow(S.enemy.slots.map(x => x.id)));
      const pt = $('playerTitle');
      pt.textContent = 'Your warband';
      if (inFight) pt.appendChild(raceRow(S.board.map(u => u.id)));
    }
    renderTop();
    renderGrid(0);
    renderGrid(1);
    renderBench();
    renderBars();
    renderShop();
    renderCore();
    renderControls();
    renderInfo();
    if (sel && sel.kind === 'shop' && shopCards[sel.idx]) shopCards[sel.idx].classList.add('selected');
    tutRender();
    saveRun();
  }

  // ------------------------------------------------------------- tutorial
  // The tutorial is a scripted run (tutorial.js). Each step allows only some actions; everything else is greyed out or refused.
  function curStep() { return tut ? TUT.STEPS[tut.i] : null; }
  function allowOf() { if (!tut) return null; const st = curStep(); return (st && st.allow) || {}; }   // null outside the tutorial
  const shopOk = (a, idx) => a.shop === 'any' || (Array.isArray(a.shop) && a.shop.indexOf(idx) >= 0);
  function toOk(a, where, n) {
    const t = a.to;
    if (!t) return false;
    if (t === 'any') return true;
    if (where === 'bench') return t === 'bench';
    if (t === 'board') return true;
    return typeof t === 'function' && t(S).indexOf(n) >= 0;
  }
  const unitOk = (a, d) => a.units === true || (Array.isArray(a.units) && a.units.indexOf(d.id) >= 0);
  function tutNo(text) {
    say(text || 'Do what the tutorial asks first.', true);
    SFX.play('error');
    const t = $('tut');
    t.classList.remove('nudge'); void t.offsetWidth; t.classList.add('nudge');
  }
  function tutCheck() {
    let guard = 0;
    while (tut && guard++ < 20) {
      const st = curStep();
      if (st && st.kind === 'do' && S.phase === 'shop' && st.done(S)) { tut.i++; continue; }
      break;
    }
  }
  function tutRender() {
    const box = $('tut');
    const st = curStep();
    $('tutSkip').classList.toggle('hidden', !tut);
    if (!tut || !st) { box.classList.add('hidden'); return; }
    box.classList.remove('hidden');
    box.querySelector('.tuttag').textContent = st.free || st.round > TUT.LESSONS ? 'Tutorial · round ' + S.round + ' · free play' : 'Tutorial · lesson round ' + st.round + ' of ' + TUT.LESSONS;
    box.querySelector('.tuttitle').textContent = st.title;
    raceText(box.querySelector('.tuttext'), S.phase === 'battle' && st.battleText ? st.battleText : st.text);
    $('tutNext').classList.toggle('hidden', !(st.kind === 'info' && S.phase === 'shop'));
    if (S.phase !== 'shop') return;
    // Grey out what is not allowed and highlight what the step asks for.
    const a = allowOf();
    shopCards.forEach((c, i) => {
      if (c.classList.contains('empty')) return;
      if (!shopOk(a, i)) c.classList.add('tut-off');
      else if (Array.isArray(a.shop)) c.classList.add('tut-hl');
    });
    document.querySelectorAll('#corePanel .card').forEach((c, i) => {
      if (!coreOk(a, i)) c.classList.add('tut-off'); else if (Array.isArray(a.core)) c.classList.add('tut-hl');
    });
    if (a.to && a.to !== 'any' && a.to !== 'board') {
      document.querySelectorAll('#playerGrid .slot[data-drop-cell]').forEach(e => { if (toOk(a, 'cell', +e.dataset.dropCell)) e.classList.add('tut-hl'); });
      document.querySelectorAll('#bench .bslot').forEach(e => { if (a.to === 'bench' && !e.querySelector('.unit')) e.classList.add('tut-hl'); });
    }
    if (Array.isArray(a.units)) {
      const all = S.board.concat(S.bench.filter(Boolean));
      document.querySelectorAll('#playerGrid [data-drag-uid], #bench [data-drag-uid]').forEach(e => {
        const u = all.find(x => String(x.uid) === e.dataset.dragUid);
        if (u && a.units.indexOf(u.id) >= 0) e.classList.add('tut-hl'); else e.classList.add('tut-off');
      });
    }
  }
  $('tutNext').onclick = () => { if (!tut) return; SFX.play('click'); tut.i++; renderAll(); };

  // ----------------------------------------------------------- interaction
  function act(r, kind) {
    if (r && r.msg) say(r.msg, !r.ok);
    if (r && r.ok) sel = null;
    if (r && !r.ok) SFX.play('error');
    else if (r) {
      const m = r.msg || '';
      const k = kind || (/merged into a level \d/.test(m) ? 'merge' : /^Bought/.test(m) ? 'buy' : /^Sold/.test(m) ? 'sell' : null);
      if (k === 'merge') SFX.play('merge', +(/level (\d)/.exec(m) || [0, 2])[1]);
      else if (k) SFX.play(k);
    }
    renderAll();
  }

  function onShop(idx) {
    if (S.phase !== 'shop' || !S.shop[idx]) return;
    const ta = allowOf();
    if (ta && !shopOk(ta, idx)) { tutNo(ta.shop ? 'Buy the highlighted unit.' : ''); return; }
    if (sel && sel.kind === 'shop' && sel.idx === idx) {
      if (ta && !ta.auto) { tutNo('Drag the card onto a highlighted spot (or click the spot).'); return; }
      act(G.buyAuto(S, idx)); return;
    }
    sel = { kind: 'shop', idx };
    renderAll();
  }

  function onSlot(cell) {
    if (!sel) return;
    const ta = allowOf();
    if (sel.kind === 'core') { coreTo(sel.idx, { board: cell }); return; }
    if (sel.kind === 'shop') {
      if (ta && !toOk(ta, 'cell', cell)) { tutNo('Not there: use a highlighted spot.'); return; }
      act(G.buyToCell(S, sel.idx, cell));
    } else {
      if (ta && !ta.move) { tutNo(); return; }
      act(G.moveUnit(S, sel.uid, 'board', cell));
    }
  }

  function onUnit(uid) {
    const u = S.board.find(x => x.uid === uid);
    if (!u) return;
    const ta = allowOf();
    if (!sel) {
      if (ta && !unitOk(ta, G.BY_ID[u.id])) { tutNo(); return; }
      sel = { kind: 'unit', uid }; renderAll(); return;
    }
    if (sel.kind === 'core') { coreTo(sel.idx, { board: u.cell }); return; }
    if (sel.kind === 'shop') {
      if (ta && !toOk(ta, 'cell', u.cell)) { tutNo('Not there: use a highlighted spot.'); return; }
      act(G.buyToCell(S, sel.idx, u.cell)); return;
    }
    if (sel.uid === uid) { sel = null; renderAll(); return; }
    if (ta && !ta.move) { tutNo(); return; }
    act(G.moveUnit(S, sel.uid, 'board', u.cell));
  }

  function onBenchSlot(slot) {
    const u = S.bench[slot];
    const ta = allowOf();
    if (!sel) {
      if (u) {
        if (ta && !unitOk(ta, G.BY_ID[u.id])) { tutNo(); return; }
        sel = { kind: 'unit', uid: u.uid }; renderAll();
      }
      return;
    }
    if (sel.kind === 'core') { coreTo(sel.idx, { bench: slot }); return; }
    if (sel.kind === 'shop') {
      if (ta && !toOk(ta, 'bench', slot)) { tutNo('Not there: use a highlighted spot.'); return; }
      act(G.buyToBench(S, sel.idx, slot)); return;
    }
    if (u && sel.uid === u.uid) { sel = null; renderAll(); return; }
    if (ta && !ta.move) { tutNo(); return; }
    act(G.moveUnit(S, sel.uid, 'bench', slot));
  }


  // ------------------------------------------------------------ drag and drop
  // Drag a shop card (buy) or one of your units (move or swap) onto a board cell or a bench slot. A short press without moving is
  // still a normal click, so clicking and double-clicking keep working. Pointer events make this work with mouse, touch and pen.
  let drag = null;
  function dropTargetAt(x, y) {
    const hit = document.elementFromPoint(x, y);
    const t = hit ? hit.closest('[data-drop-cell],[data-drop-bench],#shop,#corePanel') : null;
    // The shop (and the Core choice that takes its place in round 5) is a drop target only for your own units: dropping one sells it.
    const sellZone = t && (t.id === 'shop' || t.id === 'corePanel');
    if (sellZone && !(drag && drag.src && drag.src.dataset.dragUid !== undefined)) return null;
    return t;
  }
  function endDrag() {
    if (!drag) return;
    if (drag.ghost) drag.ghost.remove();
    if (drag.src) drag.src.classList.remove('dragsrc');
    if (drag.over) drag.over.classList.remove('dropover');
    document.body.classList.remove('dragging');
    drag = null;
  }
  document.addEventListener('pointerdown', e => {
    if (e.button !== 0 || !S || S.phase !== 'shop' || $('overlay').classList.contains('hidden') === false) return;
    const src = e.target.closest('[data-drag-shop],[data-drag-uid],[data-drag-core]');
    if (!src) return;
    const ta = allowOf();
    if (ta) {
      if (src.dataset.dragCore !== undefined ? !coreOk(ta, +src.dataset.dragCore) : src.dataset.dragShop !== undefined ? !shopOk(ta, +src.dataset.dragShop) : !ta.move) return;
    }
    drag = { src, x: e.clientX, y: e.clientY, active: false, ghost: null, over: null };
  });
  document.addEventListener('pointermove', e => {
    if (!drag) return;
    if (!drag.active) {
      if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
      drag.active = true;
      if (drag.src.dataset.dragCore !== undefined) {
        const idx = +drag.src.dataset.dragCore;
        if (!S.coreShop || !S.coreShop.open || !S.coreShop.offer[idx]) { endDrag(); return; }
        sel = { kind: 'core', idx };
      } else if (drag.src.dataset.dragShop !== undefined) {
        const idx = +drag.src.dataset.dragShop;
        if (!S.shop[idx]) { endDrag(); return; }
        sel = { kind: 'shop', idx };
      } else {
        const mine = S.board.concat(S.bench.filter(Boolean)).find(x => String(x.uid) === drag.src.dataset.dragUid);
        if (!mine) { endDrag(); return; }
        sel = { kind: 'unit', uid: mine.uid };
      }
      const tile = drag.src.classList.contains('unit') ? drag.src : drag.src.querySelector('.unit');
      const ghost = tile.cloneNode(true);
      ghost.className += ' ghost';
      ghost.style.width = ghost.style.height = '64px';
      ghost.style.setProperty('--cell', '64px');
      document.body.appendChild(ghost);
      drag.ghost = ghost;
      drag.src.classList.add('dragsrc');
      document.body.classList.add('dragging');
    }
    e.preventDefault();
    drag.ghost.style.left = e.clientX - 32 + 'px';
    drag.ghost.style.top = e.clientY - 32 + 'px';
    const over = dropTargetAt(e.clientX, e.clientY);
    if (over !== drag.over) {
      if (drag.over) drag.over.classList.remove('dropover');
      if (over) over.classList.add('dropover');
      drag.over = over;
    }
  }, { passive: false });
  document.addEventListener('pointerup', e => {
    if (!drag) return;
    if (!drag.active) { drag = null; return; }
    const target = dropTargetAt(e.clientX, e.clientY);
    const sellUid = drag.src.dataset.dragUid, coreIdx = drag.src.dataset.dragCore;
    endDrag();
    // The click that follows a drag must not do anything.
    const swallow = ev => { ev.stopPropagation(); ev.preventDefault(); };
    document.addEventListener('click', swallow, { capture: true, once: true });
    setTimeout(() => document.removeEventListener('click', swallow, true), 0);
    if (!target || S.phase !== 'shop') { sel = null; renderAll(); return; }
    if (coreIdx !== undefined) {   // a Core card dropped on a cell or bench slot
      if (target.id === 'shop' || target.id === 'corePanel') { sel = null; renderAll(); return; }
      coreTo(+coreIdx, target.dataset.dropBench !== undefined ? { bench: +target.dataset.dropBench } : { board: +target.dataset.dropCell });
      return;
    }
    if (target.id === 'shop' || target.id === 'corePanel') {
      const mine = S.board.concat(S.bench.filter(Boolean)).find(x => String(x.uid) === sellUid);
      if (!mine) { sel = null; renderAll(); return; }
      const ta = allowOf();
      if (ta && (!ta.sell || !unitOk(ta, G.BY_ID[mine.id]))) { sel = null; renderAll(); tutNo(); return; }
      act(G.sell(S, mine.uid));
    } else if (target.dataset.dropBench !== undefined) onBenchSlot(+target.dataset.dropBench);
    else {
      const cell = +target.dataset.dropCell;
      const there = G.unitAt(S.board, cell);
      if (there) onUnit(there.uid); else onSlot(cell);
    }
  });
  document.addEventListener('pointercancel', () => { if (drag && drag.active) { sel = null; renderAll(); } endDrag(); });

  // ---------------------------------------------------------------- fights
  function startFight() {
    const ta = allowOf();
    if (ta && !ta.fight) { tutNo(); return; }
    const r = G.startBattle(S);
    if (!r.ok) { say(r.msg, true); return; }
    sel = null; hoverInfo = null;
    say('');
    SFX.play('fight');
    renderAll();
    runLoop();
  }

  function handleEvents(evs) {
    for (const e of evs) {
      const t = tiles[e.side][e.uid];
      if (e.kind === 'attack') {
        if (t) pulse(t, e.side === 0 ? 'atk-r' : 'atk-l', 280);
        floatText(1 - e.side, '-' + Math.round(e.value), e.bolt ? 'bolt' : 'dmg');
        SFX.attack(e.side, e.value / G.maxHp(S.round), e.bolt, speed);
        const b = bars[1 - e.side];
        b.classList.add('hit');
        setTimeout(() => b.classList.remove('hit'), 90);
      } else if (e.kind === 'heal') {
        if (t) pulse(t, 'glow', 480);
        floatText(e.side, '+' + Math.round(e.value), 'heal');
        SFX.play('heal');
      } else if (e.kind === 'buff') {
        if (t) pulse(t, 'glow', 480);
        if (e.pct) floatText(e.side, '+' + Math.round(e.value * 100) + '%', 'ward');
      } else if (e.kind === 'ward') {
        if (t) pulse(t, 'glow', 480);
        floatText(e.side, '+' + Math.round(e.value), 'ward');
        SFX.play('ward');
      } else if (e.kind === 'shieldbreak') {
        floatText(e.side, 'Shield broke!', 'dmg');
        SFX.play('crack');
      } else if (e.kind === 'delay') {
        floatText(e.side, 'Delayed ' + (Math.round(e.value * 10) / 10) + 's', 'delay');
        SFX.play('delay');
      }
    }
  }

  function runLoop() {
    let last = performance.now();
    let acc = 0;
    looping = true;
    function frame(now) {
      const b = S.battle;
      if (S.phase !== 'battle' || !b) { looping = false; return; }
      acc += Math.min(0.1, (now - last) / 1000) * speed;
      last = now;
      let steps = 0;
      while (acc >= G.CFG.tick && !b.over && steps++ < 12) {
        acc -= G.CFG.tick;
        handleEvents(b.step(G.CFG.tick));
      }
      renderBars();
      if (b.over) { looping = false; endFight(450); return; }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function skipFight() {
    const b = S.battle;
    if (!b || S.phase !== 'battle') return;
    G.runBattle(b);
    renderBars();
    endFight(150);
  }

  // Fight statistics: a snapshot of what every unit did in the fight that just ended (shown by the Stats button on the result card).
  let lastFight = null;
  function fightStats(b) {
    if (!b || !b.stats) return null;
    return b.sides.map((side, si) => side.units.map(u => {
      const s = b.stats[si][u.uid] || { dmg: 0, heal: 0, ward: 0 };
      return { name: u.def.name, race: u.race, level: u.level, core: !!u.def.core, dmg: s.dmg, heal: s.heal, ward: s.ward };
    }));
  }
  function statsPanel() {
    const box = el('div', 'statsbox');
    const sides = [['Your warband', lastFight[0]], ['Enemy warband', lastFight[1]]];
    const top = Math.max(1, ...lastFight.flat().map(r => Math.max(r.dmg, r.heal, r.ward)));
    sides.forEach(([title, rows]) => {
      box.appendChild(el('div', 'stitle', title));
      if (!rows.length) { box.appendChild(el('div', 'srow empty', 'No units')); return; }
      rows.slice().sort((x, y) => (y.dmg + y.heal + y.ward) - (x.dmg + x.heal + x.ward)).forEach(r => {
        const row = el('div', 'srow');
        row.appendChild(el('span', 'sname chip race-' + r.race, r.name + (r.core ? '' : ' ' + '★'.repeat(r.level))));
        const parts = el('span', 'sparts');
        [['dmg', '⚔', r.dmg], ['heal', '✚', r.heal], ['ward', '🛡', r.ward]].forEach(([k, ico, v]) => {
          if (v <= 0) return;
          const p = el('span', 'spart ' + k);
          const bar = el('i'); bar.style.width = Math.max(6, Math.round(v / top * 100)) + '%';
          p.appendChild(bar); const lb = el('b'); lb.appendChild(el('span', 'sico', ico)); lb.appendChild(document.createTextNode(' ' + Math.round(v))); p.appendChild(lb);
          parts.appendChild(p);
        });
        if (!parts.childNodes.length) parts.appendChild(el('span', 'snone', 'support only'));
        row.appendChild(parts);
        box.appendChild(row);
      });
    });
    const fine = el('div', 'sfine');
    [['⚔', ' damage dealt · '], ['✚', ' health restored · '], ['🛡', ' shield granted']].forEach(([i, txt]) => {
      fine.appendChild(el('span', 'sico', i)); fine.appendChild(document.createTextNode(txt));
    });
    box.appendChild(fine);
    return box;
  }
  // Result title: a leading emoji is wrapped so it can be centred on the text (see .h2ico).
  function titleEl(title) {
    const h = el('h2', '');
    const m = /^(\S+) (.*)$/.exec(title);
    if (m && /[^\x00-\x7f]/.test(m[1])) { h.appendChild(el('span', 'h2ico', m[1])); h.appendChild(document.createTextNode(' ' + m[2])); }
    else h.textContent = title;
    return h;
  }
  function statsButton(card) {
    if (!lastFight) return;
    const b = el('button', '');
    b.appendChild(el('span', 'icon', '📊')); b.appendChild(document.createTextNode(' Stats'));
    b.style.marginLeft = '8px';
    let panel = null;
    b.onclick = () => {
      SFX.play('click');
      if (panel) { panel.remove(); panel = null; b.classList.remove('on'); return; }
      panel = statsPanel(); card.appendChild(panel); b.classList.add('on');
    };
    card.querySelector('button').after(b);
  }

  let ending = false;
  function endFight(delay) {
    if (ending) return;
    ending = true;
    const st = S;
    setTimeout(() => {
      ending = false;
      if (S !== st || S.phase !== 'battle') return;   // switched to another game meanwhile (Continue finishes it later)
      lastFight = fightStats(S.battle);
      G.finishBattle(S);
      if (S === run && (S.phase === 'won' || S.phase === 'lost')) {
        lastRank = scoreRun();
        if (!$('menu').classList.contains('hidden')) paintMenu(lastRank ? RK.describe(lastRank) : '');
      } else saveRun();
      renderTop();
      renderControls();
      showOverlay();
    }, delay);
  }

  function showTutOverlay() {
    const o = $('overlay');
    o.innerHTML = '';
    const card = el('div', 'ocard');
    const r = S.lastResult, st = curStep();
    const good = st && st.free ? true : st && st.loseText ? r === 'loss' : r === 'win';   // the fight went as the script wants (free play: any result)
    SFX.play(S.phase === 'won' ? 'victory' : r === 'win' ? 'win' : r === 'loss' ? 'lose' : 'click');
    let title, sub, label, handler, altLabel, altHandler;
    if (S.phase === 'won') {
      title = '🎓 Tutorial complete!';
      sub = 'You know the basics. A real run is 10 wins before your 5 lives are gone, with its own random set of 3 races. Good luck!';
      label = 'To the main menu';
      handler = () => { store.set('warband-tutorial-done', '1'); o.classList.add('hidden'); showMenu(); };
    } else if (S.phase === 'lost') {
      // All lives gone: the tutorial is lost. Play is unlocked anyway; the player has seen what a fight is.
      title = '🎓 Tutorial lost';
      sub = 'Aww, you lost.. You can replay the tutorial if you need some more training, or jump straight into a real game if you feel ready.';
      label = 'Replay tutorial';
      handler = () => { o.classList.add('hidden'); startTutorial(); };
      altLabel = 'Play a real game';
      altHandler = () => { store.set('warband-tutorial-done', '1'); o.classList.add('hidden'); newRun(); };
    } else {
      title = r === 'win' ? 'Victory!' : r === 'loss' ? 'Defeat' : 'Draw';
      if (good) {
        const txt = r === 'win' ? st.winText : r === 'loss' ? st.loseText : 'A draw, so nothing counts.';
        sub = (typeof txt === 'function' ? txt(S) : txt) + (r === 'loss' ? ' Lives left: ' + S.lives + '.' : '');
        label = 'Next round';
        handler = () => {
          if (!st.free) tut.i++; sel = null; G.nextRound(S); o.classList.add('hidden');
          say(roundMsg());
          renderAll();
        };
      } else {
        // Not the result the script wants: the round is replayed. A lost life stays lost.
        sub = (r === 'loss' ? '' : 'A draw, so nothing counts. ') + 'Tip: spend all your gold, put your units on the board and place them next to each other.';
        label = 'Try again';
        handler = () => {
          S.round--; sel = null; G.nextRound(S); o.classList.add('hidden');
          say(roundMsg());
          renderAll();
        };
      }
    }
    card.appendChild(titleEl(title));
    card.appendChild(el('p', '', sub));
    const btn = el('button', 'primary', label);
    btn.onclick = handler;
    card.appendChild(btn);
    if (altLabel) { const b2 = el('button', '', altLabel); b2.style.marginLeft = '8px'; b2.onclick = altHandler; card.appendChild(b2); }
    o.appendChild(card);
    o.classList.remove('hidden');
  }

  function showOverlay() {
    if (tut) { showTutOverlay(); return; }
    const o = $('overlay');
    o.innerHTML = '';
    const card = el('div', 'ocard');
    const r = S.lastResult;
    SFX.play(S.phase === 'won' ? 'victory' : S.phase === 'lost' ? 'defeat' : r === 'win' ? 'win' : r === 'loss' ? 'lose' : 'click');
    let title, sub, label, handler, endOfRun = false;
    if (S.phase === 'won') {
      title = '🏆 Victory!';
      sub = 'You won ' + S.wins + ' battles and finished the run in round ' + S.round + '.';
      label = 'Play again'; handler = newRun; endOfRun = true;
    } else if (S.phase === 'lost') {
      title = '💀 Defeated';
      sub = 'Your last life is gone. You reached round ' + S.round + ' with ' + S.wins + ' wins.';
      label = 'Play again'; handler = newRun; endOfRun = true;
    } else {
      title = r === 'win' ? 'Victory!' : r === 'loss' ? 'Defeat' : 'Draw';
      sub = r === 'win' ? 'Wins: ' + S.wins + ' / ' + (S.winTarget || G.CFG.winTarget)
        : r === 'loss' ? 'You lose a life. Lives left: ' + S.lives
        : 'Nobody wins and nobody loses a life.';
      label = 'Next round';
      handler = () => { sel = null; G.nextRound(S); o.classList.add('hidden'); say(roundMsg()); renderAll(); };
    }
    card.appendChild(titleEl(title));
    card.appendChild(el('p', '', sub));
    if (endOfRun && lastRank) { const rl = el('div', 'rankline' + (lastRank.promoted ? ' up' : '')); symText(rl, '🏅 ' + RK.describe(lastRank)); card.appendChild(rl); }
    const btn = el('button', 'primary', label);
    btn.onclick = handler;
    card.appendChild(btn);
    statsButton(card);
    if (endOfRun) { const m = el('button', '', 'Main menu'); m.style.marginLeft = '8px'; m.onclick = () => { SFX.play('click'); showMenu(); }; card.appendChild(m); }
    o.appendChild(card);
    o.classList.remove('hidden');
  }

  // The message at the start of a run: which races are in play.
  function showIntro() {
    const o = $('overlay');
    o.innerHTML = '';
    const card = el('div', 'ocard');
    card.appendChild(el('h2', '', 'A new run begins'));
    card.appendChild(el('p', '', 'Only these ' + S.pool.length + ' races will appear in your shop this run:'));
    const list = el('div', 'racelist');
    S.pool.forEach(r => {
      const row = el('div');
      row.appendChild(el('span', 'chip race-' + r, r));
      row.appendChild(document.createTextNode(' ' + (G.RACE_INFO[r] || '')));
      list.appendChild(row);
    });
    card.appendChild(list);
    const btn = el('button', 'primary', 'Begin');
    btn.onclick = () => { SFX.play('click'); o.classList.add('hidden'); };
    card.appendChild(btn);
    o.appendChild(card);
    o.classList.remove('hidden');
  }

  function newRun() {
    if (run) { continueRun(); return; }   // only one ranked run at a time (abandon it in the main menu first)
    tut = null;
    S = G.newGame(Math.random, { league: RK.name(rstore.load()) });
    S.runId = RK.newRunId();
    run = S; lastRank = null;
    sel = null; hoverInfo = null; ending = false;
    say('A new run begins. Buy your first units!');
    renderAll();
    showIntro();
  }

  // ------------------------------------------------------------- main menu
  function startTutorial() {
    S = G.newGame(Math.random, TUT.options());
    tut = { i: 0 };
    sel = null; hoverInfo = null; ending = false;
    say('');
    renderAll();
  }
  // The menu's rank line and buttons: Continue + Abandon while a ranked run is in progress, otherwise Play.
  // Text with league symbols / the medal: each symbol gets its own span so it can be centred on the text (.sym).
  const SYMRE = new RegExp('(' + Object.values(RK.SYMBOLS).concat(['🏅']).join('|') + ')');
  function symText(parent, text) {
    parent.textContent = '';
    text.split(SYMRE).forEach((part, i) => { if (!part) return; if (i % 2) parent.appendChild(el('span', 'sym', part)); else parent.appendChild(document.createTextNode(part)); });
  }
  function paintMenu(note) {
    const done = tutDone();
    const r = rstore.load();
    const mr = $('menuRank'); mr.innerHTML = '';
    mr.appendChild(document.createTextNode('Rank: ' + RK.name(r) + ' '));
    mr.appendChild(el('span', 'sym', RK.SYMBOLS[RK.name(r)] || ''));
    mr.appendChild(el('small', '', pointsText(r) + (run ? ' · run in progress: ' + run.wins + ' win' + (run.wins === 1 ? '' : 's') + ', ' + run.lives + ' lives' : '')));
    $('menuCont').classList.toggle('hidden', !run);
    $('menuAbandon').classList.toggle('hidden', !run);
    disarmAbandon();
    $('menuPlay').classList.toggle('hidden', !!run);
    $('menuPlay').disabled = !done;
    $('menuTut').classList.toggle('btnpulse', !done);
    $('menuTut').textContent = 'Tutorial';
    $('menuSkip').classList.toggle('hidden', done);
    symText($('menuNote'), note || (done ? '' : 'Finish or skip the tutorial to unlock Play.'));
  }
  function showMenu(note) {
    tut = null;
    $('overlay').classList.add('hidden');
    $('help').classList.add('hidden');
    if (window.TitleScene) window.TitleScene.start();
    paintMenu(typeof note === 'string' ? note : '');
    $('menu').classList.remove('hidden');
    tutRender();
    renderTop();
  }
  // Back into the paused ranked run (also after a page reload: a fight that was running replays from its start).
  function continueRun() {
    if (!run) return;
    $('menu').classList.add('hidden');
    tut = null; S = run;
    sel = null; hoverInfo = null;
    renderAll();
    if (S.phase === 'battle' && !looping && !ending) { if (S.battle.over) endFight(150); else runLoop(); }
    else if (S.phase === 'result') showOverlay();
  }
  let abandonTimer = 0;
  function disarmAbandon() {
    const b = $('menuAbandon');
    b.textContent = 'Abandon run';
    delete b.dataset.armed;
    clearTimeout(abandonTimer);
  }
  // Abandoning scores the run as if it were over, by the wins so far (0-2 wins = -20).
  $('menuAbandon').onclick = () => {
    const b = $('menuAbandon');
    if (!run) return;
    SFX.play('click');
    if (!b.dataset.armed) {
      b.dataset.armed = '1';
      b.textContent = 'Sure? Scores ' + (RK.pointsFor(run.wins) > 0 ? '+' : '') + RK.pointsFor(run.wins) + ' points. Click again';
      abandonTimer = setTimeout(disarmAbandon, 4000);
      return;
    }
    const res = scoreRun();
    lastRank = null;
    S = G.newGame();   // stops a fight that was still running in the background
    paintMenu(res ? 'Run abandoned. ' + RK.describe(res) : '');
  };
  $('menuCont').onclick = () => { SFX.play('click'); continueRun(); };
  $('menuPlay').onclick = () => { if (!tutDone()) return; SFX.play('click'); $('menu').classList.add('hidden'); newRun(); };
  $('menuSkip').onclick = () => { SFX.play('click'); store.set('warband-tutorial-done', '1'); showMenu(); };
  let skipTimer = 0;
  $('tutSkip').onclick = () => {
    const b = $('tutSkip');
    if (b.dataset.armed) { clearTimeout(skipTimer); delete b.dataset.armed; b.textContent = 'Skip tutorial'; store.set('warband-tutorial-done', '1'); showMenu(); return; }
    b.dataset.armed = '1'; b.textContent = 'Really skip?';
    skipTimer = setTimeout(() => { delete b.dataset.armed; b.textContent = 'Skip tutorial'; }, 3000);
  };
  $('menuTut').onclick = () => { SFX.play('click'); $('menu').classList.add('hidden'); startTutorial(); };
  let menuTimer = 0;
  const btnMenu = $('btnMenu');
  function disarmMenu() {
    btnMenu.querySelector('.ico').textContent = '☰';
    btnMenu.querySelector('.lbl').textContent = ' Menu';
    delete btnMenu.dataset.armed;
    clearTimeout(menuTimer);
  }
  // No confirmation: the run is saved, so the main menu's Continue picks it up again.
  btnMenu.onclick = () => { SFX.play('click'); disarmMenu(); showMenu(); };


  // ------------------------------------------------------------------ help
  const HELP = [
    ['Buying and placing', [
      'Drag a shop card onto an empty board cell or bench slot to buy it, and drag one of your units onto the shop to sell it, or click the card and then the cell. Click the card twice to buy it automatically: it takes a free board cell, or the bench when the board is full. You get more gold each round, and gold you do not spend carries over. Lock the shop to keep its cards for the next round instead of getting a new shop (rerolling unlocks it again).',
      'Only units on the board fight. Bench units are safe to hold, but give no bonuses. Drag a unit (or click it, then click a cell) to move or swap it. Neighbours up, down, left and right count as adjacent. Selling a level 1 unit gives its full price back.']],
    ['Merging', [
      'Three copies of the same unit at the same level merge automatically, bench included: three level 1 make a level 2, three level 2 make a level 3. Buying the third copy works even when everything is full.']],
    ['Fights and runs', [
      'Fights are automatic: every unit attacks on its own timer and chips the enemy health bar. Empty it first to win.',
      '10 wins to finish a run. You lose a life for each defeat, and you have 5.']],
    ['Races', [
      'Each run uses 3 races, shown at the top. Orcs, Dwarves, Fae and Clockwork help every race. Elves only help Elves. Humans like many different races.',
      'Units marked ★ Mono, and the Dragons, grow with every unit of their own race on your board. In round 5 you pick one Core, a special unit: one is offered per race, either a ◇ Mixed Core (grows with units of other races) or a ◈ Mono Core (made for a board of its own race).']],
    ['Shields, slow and wind-up', [
      'Shields (blue) soak damage before your health bar. Slow and delay (Fae) make the enemy attack later. Wind-up (Clockwork) makes machines attack faster every second of the fight.']],
  ];
  function showHelp(open) {
    const m = $('help');
    if (!open) { m.classList.add('hidden'); return; }
    m.innerHTML = '';
    const card = el('div', 'ocard helpcard');
    card.appendChild(el('h2', '', 'How to play'));
    const body = el('div', 'helpbody');
    HELP.forEach(([title, paras]) => {
      body.appendChild(el('h4', '', title));
      paras.forEach(t => { const p = el('p', ''); raceText(p, t); body.appendChild(p); });
    });
    card.appendChild(body);
    const close = el('button', 'primary', 'Close');
    close.onclick = () => showHelp(false);
    card.appendChild(close);
    m.appendChild(card);
    m.classList.remove('hidden');
  }
  $('help').onclick = e => { if (e.target === $('help')) showHelp(false); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') showHelp(false); });
  $('btnHelp').onclick = () => showHelp(true);
  const btnSound = $('btnSound');
  const paintSound = () => {
    const off = SFX.isMuted();
    btnSound.querySelector('.ico').textContent = off ? '🔇' : '🔊';
    btnSound.querySelector('.lbl').textContent = off ? ' Sound off' : ' Sound on';
    btnSound.title = btnSound.ariaLabel = off ? 'Sound off (click to turn on)' : 'Sound on (click to mute)';
  };
  btnSound.onclick = () => { SFX.toggle(); paintSound(); SFX.play('click'); };
  paintSound();
  // An unfinished ranked run from an earlier visit (rank.js storage) can be continued from the menu.
  const snap = rstore.loadRun();
  if (snap) {
    run = RK.restore(snap, G);
    if (run && !run.league) run.league = RK.name(rstore.load());
    if (!run) rstore.clearRun();   // broken save: dropped without scoring
  }
  S = run || G.newGame();
  renderAll();
  showMenu();
  window.__game = () => S; // handy for debugging in the browser console
})();

</script>
</body>
</html>
