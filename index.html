<script>
// Ranked system (no DOM). Leagues, points per run, promotion / demotion with carry-over, and saving the rank and the
// unfinished run in browser storage. Works as window.Rank in the page and as module.exports in node (tests/rank_test.js).
// Rules (roster.md, "Rank system"): 100 points in a league promotes, the overflow carries over (Silver 95 +20 = Gold 15);
// below 0 demotes and carries the deficit (Platinum 10 -15 = Gold 95); never below Iron 0; Warlord has no cap; start Iron 0.
// The tutorial gives no points (its runs have no runId and are never scored).
(function (root) {
  'use strict';
  const LEAGUES = ['Iron', 'Bronze', 'Silver', 'Gold', 'Platinum', 'Diamond', 'Warlord'];
  const SYMBOLS = { Iron: '⚙️', Bronze: '🥉', Silver: '🥈', Gold: '🥇', Platinum: '💠', Diamond: '💎', Warlord: '👑' };
  const PER_LEAGUE = 100;
  const START = { league: 0, points: 0 };   // Iron 0
  const KEY_RANK = 'warband-rank', KEY_RUN = 'warband-run';

  // Points for a finished (or abandoned) run, by wins.
  function pointsFor(wins) {
    if (wins >= 10) return 20;
    if (wins === 9) return 10;
    if (wins === 8) return 5;
    if (wins === 7) return 0;
    if (wins >= 5) return -5;
    if (wins >= 3) return -10;
    return -20;
  }

  const clampLeague = i => Math.max(0, Math.min(LEAGUES.length - 1, i | 0));
  function valid(r) {
    return !!r && typeof r === 'object' && Number.isInteger(r.league) && r.league >= 0 && r.league < LEAGUES.length &&
      typeof r.points === 'number' && isFinite(r.points) && r.points >= 0 && (r.league === LEAGUES.length - 1 || r.points < PER_LEAGUE);
  }
  function fresh() { return { league: START.league, points: START.points, lastRun: null }; }

  // Add delta points. Returns a new rank plus what happened: { league, points, lastRun, delta, from: {league, points}, promoted, demoted }.
  function apply(rank, delta) {
    let league = clampLeague(rank.league), pts = (rank.points || 0) + delta;
    const top = LEAGUES.length - 1;
    while (pts >= PER_LEAGUE && league < top) { pts -= PER_LEAGUE; league++; }
    while (pts < 0) {
      if (league === 0) { pts = 0; break; }
      league--; pts += PER_LEAGUE;
    }
    return { league, points: pts, lastRun: rank.lastRun || null, delta, from: { league: rank.league, points: rank.points },
      promoted: league > rank.league, demoted: league < rank.league };
  }
  // Score a run by its wins.
  const applyRun = (rank, wins) => Object.assign(apply(rank, pointsFor(wins)), { wins });

  const name = r => LEAGUES[clampLeague(r.league)];
  const symbol = r => SYMBOLS[name(r)];
  const label = r => name(r) + ' ' + r.points;                  // "Gold 15"
  const toNext = r => (r.league >= LEAGUES.length - 1 ? null : PER_LEAGUE - r.points);
  // One line for the end-of-run card / the menu, e.g. "+20 points (10 wins). Promoted to Gold! Now Gold 15."
  function describe(res) {
    const sign = res.delta > 0 ? '+' : '';
    let t = sign + res.delta + ' ranked points (' + res.wins + ' win' + (res.wins === 1 ? '' : 's') + ').';
    if (res.promoted) t += ' Promoted to ' + name(res) + ' ' + symbol(res) + '!';
    else if (res.demoted) t += ' Demoted to ' + name(res) + '.';
    return t + ' Now ' + label(res) + '.';
  }

  // ---------------------------------------------------------------- storage
  // getStorage() returns a localStorage-like object; it (and every call on it) may throw. When storage does not work, the
  // rank lives in memory for this page visit only, and an unfinished run cannot be continued after a reload.
  function createStore(getStorage) {
    getStorage = getStorage || (() => root.localStorage);
    let mem = null;           // last known rank (also the fallback when storage is blocked)
    const get = k => { try { const st = getStorage(); return st ? st.getItem(k) : null; } catch (e) { return null; } };
    const set = (k, v) => { try { const st = getStorage(); if (!st) return false; st.setItem(k, v); return true; } catch (e) { return false; } };
    const del = k => { try { const st = getStorage(); if (st) st.removeItem(k); } catch (e) { /* ignore */ } };
    const parse = t => { try { return t ? JSON.parse(t) : null; } catch (e) { return null; } };

    function load() {
      const r = parse(get(KEY_RANK));
      if (valid(r)) mem = { league: r.league, points: r.points, lastRun: r.lastRun || null };
      if (!mem) mem = fresh();
      return Object.assign({}, mem);
    }
    function save(r) {
      mem = { league: r.league, points: r.points, lastRun: r.lastRun || null };
      set(KEY_RANK, JSON.stringify(mem));
    }
    // Score the run with this id once (a second call for the same run returns null and changes nothing).
    function score(runId, wins) {
      const cur = load();
      if (!runId || cur.lastRun === runId) return null;
      const res = applyRun(cur, wins);
      res.lastRun = runId;
      save(res);                // rank first (with the run id), then forget the run: a crash in between cannot score twice
      clearRun();
      return res;
    }
    // Unfinished run: a plain-JSON snapshot of the game state (see snapshot / restore).
    const saveRun = snap => set(KEY_RUN, JSON.stringify(snap));
    function loadRun() {
      const s = parse(get(KEY_RUN));
      if (!s || s.v !== 1 || !s.runId || s.runId === load().lastRun) return null;   // already scored = stale
      return s;
    }
    const clearRun = () => del(KEY_RUN);
    return { load, save, score, saveRun, loadRun, clearRun };
  }

  // ------------------------------------------------- unfinished run snapshot
  // The engine state is plain data except rng (a function), battle (rebuilt from board + enemy: fights are deterministic,
  // so a fight interrupted by a reload replays to the same result) and script (tutorial only; tutorial runs are not saved).
  const SKIP = { rng: 1, battle: 1, script: 1 };
  function snapshot(s) {
    const o = { v: 1, ids: 2 };   // ids: 2 = unit ids after the renames (see migrateIds)
    Object.keys(s).forEach(k => { if (!SKIP[k] && typeof s[k] !== 'function') o[k] = s[k]; });
    return JSON.parse(JSON.stringify(o));
  }
  // Game = the engine (game.js). Returns a state ready to play, or null if the snapshot looks broken.
  // Old saves use unit ids from before the renames: map them once (all at the same time, so warpainter -> peon and
  // warbanner -> warpainter do not clash).
  const OLD_IDS = { warpainter: 'peon', warbanner: 'warpainter', slayer: 'bulwark', gladetwins: 'lookout', spiritstag: 'satyr',
    stormwyrm: 'twilightdrake', wyrm: 'verdantwyrm' };
  function migrateIds(o) {
    if (!o || o.ids === 2) return o;
    const json = JSON.stringify(o).replace(/"(warpainter|warbanner|slayer|gladetwins|spiritstag|stormwyrm|wyrm)"/g, (m, id) => '"' + OLD_IDS[id] + '"');
    return Object.assign(JSON.parse(json), { ids: 2 });
  }
  function restore(o, Game, rng) {
    try {
      if (!o || o.v !== 1 || !Array.isArray(o.board) || !Array.isArray(o.bench) || !Array.isArray(o.shop) || !Array.isArray(o.pool)) return null;
      if (!['shop', 'battle', 'result'].includes(o.phase)) return null;
      o = migrateIds(o);
      const s = Object.assign({}, o);
      delete s.v; delete s.ids;
      s.rng = rng || Math.random; s.script = null; s.battle = null;
      if (s.phase === 'battle') {
        if (!s.enemy || !Array.isArray(s.enemy.slots)) return null;
        s.battle = Game.createBattle(s.board.map(u => ({ uid: u.uid, id: u.id, cell: u.cell, level: u.level, grow: u.grow || 0 })), s.enemy.slots, s.round);
      }
      return s;
    } catch (e) { return null; }
  }
  const newRunId = () => Date.now().toString(36) + '-' + Math.floor(Math.random() * 1e9).toString(36);

  const api = { LEAGUES, SYMBOLS, PER_LEAGUE, START, pointsFor, apply, applyRun, valid, fresh, name, symbol, label, toNext, describe,
    createStore, snapshot, restore, newRunId, KEY_RANK, KEY_RUN };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Rank = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/*
 * Warbands title screen: a pixel-art dusk scene drawn with code (no image files).
 * Sky, sun, clouds, far mountains with a castle, hills with pine trees, two flapping banners, embers and mist.
 * The scene is drawn on a small 320x180 canvas and scaled up with hard edges (image-rendering: pixelated).
 * Swap a layer for a real image later by replacing its draw function.
 */
(function () {
  'use strict';
  const W = 320, H = 180;
  const canvas = document.getElementById('titleCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = W; canvas.height = H;

  // ------------------------------------------------------------ helpers
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mix = (a, b, t) => { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; };
  const rect = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
  const mod = (a, n) => ((a % n) + n) % n;

  // ------------------------------------------------------------ palette (warm dusk)
  const SKY = ['#3a2a63', '#6a3a7a', '#a8486f', '#d9606a', '#f08a5d', '#f7b955', '#ffd98a'];
  const RACE = { Human: ['#4f84d4', '#2f5a9a'], Elf: ['#3fb383', '#227a55'], Orc: ['#c05a37', '#7e3219'], Dwarf: ['#b8923f', '#7a5a1c'], Fae: ['#a56bd1', '#6a3a92'], Clockwork: ['#8f98a8', '#565e6e'] };
  const RACES = Object.keys(RACE);
  const pick = mulberry32(Math.floor(Math.random() * 1e9));
  const left = RACES[Math.floor(pick() * RACES.length)];
  let right = RACES[Math.floor(pick() * RACES.length)];
  while (right === left) right = RACES[Math.floor(pick() * RACES.length)];

  // ------------------------------------------------------------ static data (fixed seed, so the scene never changes between loads)
  const rnd = mulberry32(7);
  const stars = Array.from({ length: 28 }, () => ({ x: Math.floor(rnd() * W), y: Math.floor(rnd() * 56), p: rnd() * 6 }));
  const clouds = Array.from({ length: 6 }, (_, i) => ({ x: rnd() * (W + 80), y: 14 + i * 11 + rnd() * 6, w: 26 + rnd() * 30, s: 2 + rnd() * 3 }));
  const embers = Array.from({ length: 38 }, () => ({ x: rnd() * W, y: rnd() * H, v: 7 + rnd() * 16, p: rnd() * 6.28, c: Math.floor(rnd() * 3), big: rnd() < 0.2 }));
  const LAYER_W = 400;                                      // width of the looping hill layers
  const trees = Array.from({ length: 22 }, () => ({ x: rnd() * LAYER_W, h: 12 + Math.floor(rnd() * 12) }));
  const trees2 = Array.from({ length: 16 }, () => ({ x: rnd() * LAYER_W, h: 18 + Math.floor(rnd() * 14) }));

  // Looping hill shapes: sums of sines with whole numbers of cycles over LAYER_W, so they tile without a seam.
  const wave = (x, k1, k2, k3, a1, a2, a3, ph) => a1 * Math.sin(6.2832 * (k1 * x / LAYER_W + ph)) + a2 * Math.sin(6.2832 * (k2 * x / LAYER_W + ph * 2)) + a3 * Math.sin(6.2832 * (k3 * x / LAYER_W + ph * 3));
  const farTop = x => 110 - 16 + wave(x, 2, 5, 9, 12, 5, 2, 0.1);
  const midTop = x => 132 - 6 + wave(x, 3, 7, 11, 8, 4, 1.5, 0.4);
  const nearTop = x => 150 - 4 + wave(x, 2, 6, 10, 6, 3, 1, 0.7);

  // ------------------------------------------------------------ layers
  function drawSky(t) {
    for (let y = 0; y < H; y += 3) {
      const f = Math.min(1, y / 128) * (SKY.length - 1);
      const i = Math.min(SKY.length - 2, Math.floor(f));
      const q = Math.round((f - i) * 4) / 4;                // banded gradient: looks like hand-placed colour steps
      rect(0, y, W, 3, mix(SKY[i], SKY[i + 1], q));
    }
    stars.forEach(s => rect(s.x, s.y, 1, 1, 'rgba(255,240,210,.85)'));
  }
  function drawSun() {
    const cx = 86, cy = 92;
    for (let y = -34; y <= 34; y++) for (let x = -34; x <= 34; x++) {
      const d = Math.sqrt(x * x + y * y);
      if (d <= 19) rect(cx + x, cy + y, 1, 1, d < 15 ? '#fff0b0' : '#ffe08a');
      else if (d <= 24 && (x + y) % 2 === 0) rect(cx + x, cy + y, 1, 1, 'rgba(255,225,140,.55)');
      else if (d <= 33 && (x + y) % 4 === 0) rect(cx + x, cy + y, 1, 1, 'rgba(255,200,120,.35)');
    }
  }
  function drawClouds(t) {
    clouds.forEach(c => {
      const x = mod(c.x, W + 80) - 40, w = Math.round(c.w);
      rect(x, c.y, w, 3, '#f7a78f'); rect(x + 4, c.y - 3, w - 12, 3, '#fbc0a0'); rect(x + 8, c.y - 5, Math.round(w / 3), 2, '#ffd9b8');
      rect(x + 2, c.y + 3, w - 6, 2, '#c8607a');
    });
  }
  // A looping hill layer. top(x) gives the surface height; the scroll offset is in layer pixels.
  function drawHills(top, color, edge, scroll) {
    for (let x = 0; x < W; x++) {
      const lx = mod(x + scroll, LAYER_W), y = Math.round(top(lx));
      rect(x, y, 1, H - y, color);
      rect(x, y, 1, 1, edge);
    }
  }
  function drawCastle(scroll, t) {
    const base = 244;                                        // position in layer space
    for (const off of [0, -LAYER_W, LAYER_W]) {
      const sx = base + off - scroll;
      if (sx < -50 || sx > W + 50) continue;
      const gy = Math.round(farTop(mod(base, LAYER_W))) + 2;
      const c = '#4f2f66', c2 = '#5f3b78';
      rect(sx - 18, gy - 14, 36, 14, c);                     // wall
      for (let i = 0; i < 6; i++) rect(sx - 18 + i * 6, gy - 17, 3, 3, c);   // battlements
      rect(sx - 24, gy - 26, 9, 26, c2); rect(sx + 15, gy - 26, 9, 26, c2);  // side towers
      rect(sx - 24, gy - 29, 3, 3, c2); rect(sx - 18, gy - 29, 3, 3, c2); rect(sx + 15, gy - 29, 3, 3, c2); rect(sx + 21, gy - 29, 3, 3, c2);
      rect(sx - 7, gy - 36, 14, 36, c2);                      // keep
      for (let i = 0; i < 4; i++) rect(sx - 7 + i * 4, gy - 39, 3, 3, c2);
      rect(sx - 1, gy - 46, 2, 8, '#3a2350');                 // flag pole
      const fl = 0;
      rect(sx + 1, gy - 46 + fl, 6, 3, '#e8b84a');           // pennant
      const lit = (x, y) => rect(sx + x, gy + y, 2, 3, '#ffd27a');
      lit(-4, -30, 0); lit(2, -30, 1.5); lit(-20, -20, 3); lit(18, -20, 4.5); lit(-4, -10, 2); lit(2, -10, 5);
    }
  }
  function drawTrees(list, scroll, top, color, light) {
    list.forEach(tr => {
      for (const off of [0, -LAYER_W]) {
        const sx = Math.round(tr.x + off - scroll);
        if (sx < -10 || sx > W + 10) continue;
        const gy = Math.round(top(mod(tr.x, LAYER_W))) + 2;
        const h = tr.h, w = Math.max(5, Math.round(h * 0.5));
        rect(sx - 1, gy - 3, 2, 4, '#1a1030');                // trunk
        for (let i = 0; i < 4; i++) {                          // stacked triangles
          const lh = Math.round(h / 4) + 2, ww = Math.round(w * (1 - i * 0.18)) | 1;
          rect(sx - (ww >> 1), gy - 3 - (i + 1) * Math.round(h / 4.5), ww, lh, color);
          rect(sx - (ww >> 1), gy - 3 - (i + 1) * Math.round(h / 4.5), 1, lh, light);
        }
        rect(sx - 1, gy - 3 - h, 2, 3, color);
      }
    });
  }
  function drawBanner(px, race, dir, t) {
    const [main, dark] = RACE[race];
    const top = 94;
    rect(px - 1, top - 4, 3, 84, '#4a2f1c'); rect(px, top - 4, 1, 84, '#6b4528');        // pole
    rect(px - 3, top - 6, 7, 3, '#e8b84a');                                              // finial
    const cw = 20, ch = 38, notch = 9;
    const phase = dir > 0 ? 0 : 1.7;
    const swayAt = () => 0;
    for (let r = 0; r < ch; r++) {
      const x0 = px + (dir > 0 ? 2 : -2 - cw) + Math.round(swayAt(r)) * dir;
      const c = r < 3 ? '#e8b84a' : (r % 7 === 6 ? dark : main);
      if (r < ch - notch) rect(x0, top + r, cw, 1, c);
      else {                                                  // swallow tail: two legs with a growing gap
        const g = (r - (ch - notch) + 1) * 2, leg = (cw - g) >> 1;
        rect(x0, top + r, Math.max(1, leg), 1, c);
        rect(x0 + cw - Math.max(1, leg), top + r, Math.max(1, leg), 1, c);
      }
      if (r > 4 && r < ch - notch) { rect(x0 + 1, top + r, 1, 1, dark); rect(x0 + cw - 2, top + r, 1, 1, dark); }
    }
    // little crest: a gold diamond
    const mx = px + (dir > 0 ? 2 : -2 - cw) + (cw >> 1) + Math.round(swayAt(17)) * dir;
    for (let i = -4; i <= 4; i++) rect(mx - (4 - Math.abs(i)), top + 17 + i, (4 - Math.abs(i)) * 2 + 1, 1, '#ffe08a');
  }
  function drawEmbers(t) {
    const cols = ['#ffb347', '#ff7a3d', '#ffe08a'];
    embers.forEach(e => {
      const y = mod(e.y - t * e.v, H + 20) - 10, x = e.x + Math.sin(t * 0.9 + e.p) * 7;
      if (Math.sin(t * 5 + e.p * 3) < -0.7) return;           // flicker
      rect(x, y, e.big ? 2 : 1, e.big ? 2 : 1, cols[e.c]);
    });
  }
  function drawMist(t) {
    for (let k = 0; k < 3; k++) {
      const y0 = 140 + k * 8, a = 0.045 + k * 0.02;
      for (let x = 0; x < W; x += 4) {
        const wob = Math.sin(x * 0.025 + k * 2) * 2;
        rect(x, y0 + wob, 4, 5, 'rgba(255,214,225,' + a + ')');
      }
    }
  }

  // ------------------------------------------------------------ frame
  function frame(t) {
    drawSky(t);
    drawSun();
    drawClouds(t);
    drawHills(farTop, '#7a4f86', '#9a6a9c', 0);
    drawCastle(0, t);
    drawHills(midTop, '#4d3568', '#6a4a80', 0);
    drawTrees(trees, 0, midTop, '#3a2858', '#4a3470');
    drawHills(nearTop, '#2a1d44', '#3c2a5c', 0);
    drawTrees(trees2, 0, nearTop, '#1d1432', '#2c2048');
    rect(0, 168, W, 12, '#150e24');                           // dark ground behind the menu
    rect(0, 167, W, 1, '#2a1d44');
    drawMist(t);
    drawBanner(34, left, 1, t);
    drawBanner(W - 34, right, -1, t);
    drawEmbers(t);
  }

  // ------------------------------------------------------------ loop: only runs while the menu is on screen
  let running = false, t0 = 0, last = 0;
  const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function tick(now) {
    const menu = document.getElementById('menu');
    if (!menu || menu.classList.contains('hidden')) { running = false; return; }
    if (now - last >= 33) { last = now; frame((now - t0) / 1000); }   // about 30 frames per second
    requestAnimationFrame(tick);
  }
  window.TitleScene = {
    start() {
      if (still) { frame(3); return; }
      if (running) return;
      running = true; t0 = performance.now() - 3000; last = 0;
      requestAnimationFrame(tick);
    },
  };
  frame(3);
})();
