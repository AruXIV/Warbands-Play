<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Warbands</title>
<style>
  :root {
    --bg: #17120f; --panel: #231a14; --panel2: #2e2219; --line: #5a4129;
    --text: #efe3c8; --muted: #a8977a; --gold: #e8b84a; --red: #c8453a; --green: #58b368; --blue: #5b8ad6;
    --cell: clamp(58px, 12vw, 94px);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: ui-monospace, "Cascadia Mono", "Courier New", monospace; min-height: 100vh; }
  #app { max-width: 1020px; margin: 0 auto; padding-block: 12px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .hidden { display: none !important; }

  /* header */
  #top { display: flex; gap: 10px 22px; flex-wrap: wrap; align-items: center; justify-content: space-between;
    background: var(--panel); border: 2px solid var(--line); border-radius: 8px; padding: 10px 14px; font-weight: 700; }
  #top .stat b { color: var(--gold); }
  #top .hearts { color: var(--red); letter-spacing: 2px; }
  #top .hbtns { order: -1; flex: 1 0 100%; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  #top button { padding: 6px 12px; }
  #msg { min-height: 22px; margin: 8px 2px 0; color: var(--gold); font-size: 14px; }
  #msg.bad { color: #ff8a7a; }

  /* arena */
  #arena { display: flex; justify-content: center; align-items: flex-start; gap: 26px; margin: 14px 0 18px; flex-wrap: wrap; }
  .side { display: flex; flex-direction: column; gap: 10px; }
  .side .title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  #vs { align-self: center; font-size: 22px; font-weight: 800; color: var(--gold); }
  .grid { display: grid; grid-template-columns: repeat(3, var(--cell)); grid-template-rows: repeat(2, var(--cell));
    gap: 4px; padding: 8px; background: var(--panel); border: 2px solid var(--line); border-radius: 10px; }
  .grid { justify-content: center; align-self: center; }
  .benchbox { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .bench { --bs: max(46px, calc(var(--cell) * .66)); display: grid; grid-template-columns: repeat(6, var(--bs)); gap: 4px;
    padding: 6px; background: var(--panel); border: 2px solid var(--line); border-radius: 10px; }
  .bench.idle { opacity: .6; }
  .bslot { width: var(--bs); height: var(--bs); border: 2px dashed #5a412977; border-radius: 8px; background: #0003; }
  .bslot.live { cursor: pointer; }
  .bslot.live:hover { border-color: var(--gold); background: #e8b84a14; }
  .bslot .unit { --cell: var(--bs); margin: 0; width: 100%; height: 100%; }
  .bslot .unit .nm { font-size: 8px; }
  .bslot .unit .stars { font-size: 9px; top: 1px; right: 3px; }
  .slot { margin: 3px; border: 2px dashed #5a412977; border-radius: 8px; background: #0003; }
  .slot.live { cursor: pointer; }
  .slot.live:hover { border-color: var(--gold); background: #e8b84a14; }

  /* health bar */
  .bar { position: relative; height: 28px; }
  .bar .track { position: absolute; inset: 0; background: #0007; border: 2px solid #000; border-radius: 6px; overflow: hidden; }
  .bar .fill { height: 100%; width: 100%; background: linear-gradient(#e0574a, #a82f27); transition: width .12s linear; }
  .bar .shieldbar { position: absolute; left: 0; bottom: 0; height: 5px; width: 0; background: var(--blue); transition: width .12s linear; }
  .bar .label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; text-shadow: 0 1px 0 #000; }
  .bar .slowtag { position: absolute; right: 8px; bottom: -17px; font-size: 11px; color: #d9b8ff; pointer-events: none; }
  .unit.hexed { outline: 3px solid #b070e0; outline-offset: -3px; }
  #foeline { font-size: 12px; color: #d9b8ff; }
  #raceline { font-size: 12px; color: var(--muted); }
  #info .monotag { color: var(--gold); font-size: 12px; margin: 0 0 6px; }
  .bar .floats { position: absolute; inset: 0; pointer-events: none; }
  .bar.hit .track { border-color: #fff; }
  .float { position: absolute; top: -4px; font-weight: 800; font-size: 15px; text-shadow: 0 1px 0 #000, 0 0 4px #000; animation: floatup .9s ease-out forwards; }
  .float.ward { color: #9cc2ff; } .float.delay { color: #d9b8ff; font-size: 13px; }
  .float.dmg { color: #ffd9d4; } .float.bolt { color: #c9a5ff; font-size: 18px; } .float.heal { color: #8fe29d; }
  @keyframes floatup { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-34px); } }

  /* unit tiles (placeholders until the real sprites exist) */
  .unit { position: relative; margin: 3px; border: 3px solid #0008; border-radius: 8px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px; cursor: pointer; user-select: none;
    box-shadow: inset 0 -6px 0 #0004, 0 2px 0 #000a; }
  .unit.race-Human { background: linear-gradient(#4f84d4, #2f5a9a); }
  .unit.race-Elf { background: linear-gradient(#3fb383, #227a55); }
  .unit.race-Orc { background: linear-gradient(#c05a37, #7e3219); }
  .unit.race-Dwarf { background: linear-gradient(#b8923f, #7a5a1c); }
  .unit.race-Fae { background: linear-gradient(#a56bd1, #6a3a92); }
  .unit.race-Clockwork { background: linear-gradient(#8f98a8, #565e6e); }
  .chip { display: inline-block; padding: 1px 8px; margin: 0 2px; border-radius: 10px; font-size: 12px; font-weight: 700; border: 1px solid #0008; text-shadow: 0 1px 0 #000; color: #fff; }
  .chip.race-Human { background: #3f6db8; } .chip.race-Elf { background: #2f9970; } .chip.race-Orc { background: #a84a2b; }
  .chip.race-Dwarf { background: #9b7a30; } .chip.race-Fae { background: #8b57b5; } .chip.race-Clockwork { background: #6f788a; }
  .ocard .racelist { text-align: left; margin: 0 0 14px; font-size: 13px; line-height: 1.5; }
  .ocard .racelist div { margin: 6px 0; color: var(--text); }
  .ocard .fine { font-size: 12px; margin: 0 0 16px; }
  .unit.top { border-color: var(--gold); box-shadow: inset 0 -6px 0 #0004, 0 0 10px #e8b84a88; }
  [data-drag-shop] { touch-action: pan-x; }
  [data-drag-uid] { touch-action: none; }
  body.dragging { cursor: grabbing; user-select: none; -webkit-user-select: none; }
  .dragsrc { opacity: .4; }
  #shop.dropover { outline-color: #e0574a; background: #e0574a22; }
  .dropover { outline: 3px dashed var(--gold); outline-offset: -3px; background: #e8b84a22; }
  .unit.ghost { position: fixed; z-index: 30; margin: 0; pointer-events: none; opacity: .92; transform: scale(1.05); box-shadow: 0 6px 16px #000a; }
  .unit.selected { outline: 3px solid var(--gold); outline-offset: 1px; }
  .unit .ico { font-size: calc(var(--cell) * .40); line-height: 1; }
  .unit .sprite { width: 78%; height: 78%; image-rendering: pixelated; object-fit: contain; }
  .unit .nm { font-size: 10px; font-weight: 700; text-shadow: 0 1px 0 #000; text-align: center; line-height: 1.1; padding: 0 2px; }
  .unit .stars { position: absolute; top: 2px; right: 4px; color: var(--gold); font-size: 11px; text-shadow: 0 1px 0 #000; }
  .unit .badge { position: absolute; left: 4px; bottom: 3px; font-size: 11px; font-weight: 700; background: #000b; padding: 0 4px; border-radius: 3px; }
  .unit.mirror .ico, .unit.mirror .sprite { transform: scaleX(-1); }
  .unit.atk-r { animation: lunge-r .26s ease-out; }
  .unit.atk-l { animation: lunge-l .26s ease-out; }
  .unit.glow { animation: glow .45s ease-out; }
  @keyframes lunge-r { 40% { transform: translateX(calc(var(--cell) * .35)); } }
  @keyframes lunge-l { 40% { transform: translateX(calc(var(--cell) * -.35)); } }
  @keyframes glow { 30% { filter: brightness(1.8); box-shadow: 0 0 14px #8fe29d; } }

  /* shop */
  #shopArea { display: flex; flex-direction: column; gap: 12px; }
  #shop { display: flex; gap: 8px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
  #lower { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  #controls { flex: 1 1 340px; }
  #odds { font-size: 12px; color: var(--muted); }
  #odds b { color: var(--text); font-weight: 700; }
  .card { flex: 1 1 0; min-width: 158px; min-height: 92px; background: var(--panel); border: 2px solid var(--line); border-radius: 8px; padding: 8px;
    display: flex; gap: 8px; cursor: pointer; }
  .card:hover { border-color: #8a6638; }
  .card.selected { border-color: var(--gold); background: var(--panel2); }
  .card.poor { opacity: .5; }
  .card.empty { opacity: .25; cursor: default; }
  .card .unit { --cell: 54px; width: 54px; height: 54px; flex: none; margin: 0; cursor: inherit; }
  .card .meta { font-size: 11px; color: var(--muted); line-height: 1.35; }
  .card .meta b { color: var(--text); font-size: 13px; }
  .card .cost { color: var(--gold); font-weight: 700; }
  .card .mergetag { color: var(--gold); font-size: 11px; font-weight: 700; margin-top: 2px; }
  #controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; font-weight: 700; color: var(--text); background: var(--panel2); border: 2px solid var(--line);
    border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--gold); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: #7a5a1c; border-color: var(--gold); }
  button.on { border-color: var(--gold); color: var(--gold); }
  #info { flex: 1 1 280px; max-width: 420px; min-height: 150px; background: var(--panel); border: 2px solid var(--line);
    border-radius: 8px; padding: 12px 14px; font-size: 13px; line-height: 1.5; }
  #info h3 { margin: 0 0 4px; font-size: 16px; }
  #info .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  #info .stats { margin-top: 8px; color: var(--gold); }
  #info p { margin: 6px 0; }
  #info .tip { color: var(--muted); }
  #info .lvline { color: var(--muted); padding-left: 6px; border-left: 3px solid transparent; }
  #info .lvline b { color: var(--text); }
  #info .lvline.cur { color: var(--text); border-left-color: var(--gold); }
  #info .lvline.next { opacity: .75; }
  #info .lvline .mult { color: #9ec7ff; }
  #info .lvnote { font-size: 11px; color: var(--muted); margin: 2px 0 6px; }
  #info .live { color: var(--gold); margin: 0 0 8px; padding: 6px 8px; background: #0003; border-radius: 6px; }
  .kw { border-bottom: 1px dotted currentColor; cursor: help; outline: none; }
  .kwtip { position: fixed; z-index: 40; max-width: 240px; padding: 7px 10px; background: #1b130c; color: var(--text); border: 2px solid var(--gold);
    border-radius: 8px; font-size: 12px; line-height: 1.35; pointer-events: none; box-shadow: 0 4px 14px #000a; }


  /* fight statistics (result card) */
  .statsbox { margin-top: 16px; text-align: left; max-height: 46vh; overflow-y: auto; font-size: 12px; }
  .statsbox .stitle { margin: 10px 0 4px; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; font-size: 11px; }
  .statsbox .srow { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .statsbox .srow.empty { color: var(--muted); }
  .statsbox .sname { flex: 0 0 132px; margin: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .statsbox .sparts { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .statsbox .spart { position: relative; display: block; height: 16px; background: #0004; border-radius: 3px; overflow: hidden; }
  .statsbox .spart i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
  .statsbox .spart.dmg i { background: #a8392f; } .statsbox .spart.heal i { background: #3f8a52; } .statsbox .spart.ward i { background: #3e6bb0; }
  .statsbox .spart b { position: relative; padding-left: 6px; line-height: 16px; font-size: 11px; text-shadow: 0 1px 0 #000; }
  .statsbox .snone { color: var(--muted); font-size: 11px; }
  .statsbox .sfine { margin-top: 10px; color: var(--muted); font-size: 11px; }
  /* result overlay */
  #overlay { position: fixed; inset: 0; background: #000a; display: flex; align-items: center; justify-content: center; z-index: 10; }
  .ocard { background: var(--panel); border: 3px solid var(--gold); border-radius: 12px; padding: 26px 34px; text-align: center; min-width: 280px; }
  #help { position: fixed; inset: 0; background: #000a; display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  .helpcard { max-width: 560px; max-height: 86vh; display: flex; flex-direction: column; }
  .helpbody { text-align: left; overflow-y: auto; margin-bottom: 16px; padding-right: 6px; font-size: 13px; line-height: 1.5; }
  .helpbody h4 { margin: 12px 0 2px; color: var(--gold); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
  .helpbody p { margin: 4px 0; color: var(--text); }
  .ocard h2 { margin: 0 0 8px; font-size: 28px; }
  .ocard p { margin: 4px 0 18px; color: var(--muted); }

  /* main menu */
  #menu { position: fixed; inset: 0; z-index: 15; background: #3a2a63; display: flex; align-items: flex-start; justify-content: center; padding: 16px; overflow-y: auto; }
  #titleCanvas { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; image-rendering: pixelated; z-index: 0; }
  #menu::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(ellipse at 50% 45%, transparent 55%, #1a0f2e99 100%); }
  .menucard { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; max-width: 420px; width: 100%; margin-top: clamp(16px, 7vh, 80px); }
  .menucard .logo { font-size: clamp(48px, 15vw, 132px); font-weight: 900; letter-spacing: 8px; line-height: 1; margin-bottom: 26px; color: #ffd45e;
    background: linear-gradient(100deg, #ffd45e 38%, #fffbe0 50%, #ffd45e 62%) 0 0 / 300% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 0 #3a1a08) drop-shadow(0 0 18px #ffb34788); animation: logoshine 5s ease-in-out infinite; }
  @keyframes logoshine { 0%, 55% { background-position: 100% 0; } 85%, 100% { background-position: 0 0; } }
  .menucard .tagline { color: #fff1d0; margin-bottom: 14px; letter-spacing: 2px; text-shadow: 0 2px 0 #3a1a0888, 0 0 8px #3a1a0866; }
  .menupanel { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; max-width: 340px; padding: 20px 22px 16px; background: #1b122acc; border: 3px solid #8a6330; border-radius: 12px; box-shadow: 0 6px 0 #0007, inset 0 0 0 2px #3a2a1a; }
  .menucard button.big { width: 100%; max-width: 280px; font-size: 20px; padding: 14px 18px; }
  .menunote { min-height: 18px; font-size: 13px; color: var(--gold); }
  .menufine { font-size: 12px; color: var(--muted); max-width: 320px; }
  @media (prefers-reduced-motion: reduce) { .menucard .logo { animation: none; } }
  /* tutorial */
  #tut { background: var(--panel2); border: 3px solid var(--gold); border-radius: 10px; padding: 12px 16px; margin: 10px 0 0; display: flex; flex-direction: column; gap: 4px; }
  #tut .tuttag { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  #tut .tuttitle { font-size: 17px; font-weight: 800; color: var(--gold); }
  #tut .tuttext { font-size: 14px; line-height: 1.5; }
  #tut .tutbtns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  #tut .tutbtns button.hidden { display: none; }
  .linkbtn { background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; font: inherit; font-size: 14px; padding: 4px 8px; box-shadow: none; }
  .linkbtn:hover { color: var(--text); }
  #tut.nudge { animation: nudge .4s; }
  @keyframes nudge { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes tutpulse { 50% { box-shadow: 0 0 0 4px #e8b84acc, 0 0 18px #e8b84a; } }
  .tut-hl { animation: tutpulse 1.1s ease-in-out infinite; border-color: var(--gold) !important; }
  .card.tut-hl, .slot.tut-hl, .bslot.tut-hl, button.tut-hl { position: relative; }
  .tut-off { opacity: .3; filter: grayscale(.7); }
  .tut-off:not(.card) { pointer-events: none; }
  .btnpulse { animation: tutpulse 1.1s ease-in-out infinite; border-color: var(--gold) !important; }

  @media (max-width: 720px) { #info { max-width: none; } }
  /* The info panel beside the warband never changes the page height: it fills a slot as tall as the warband and scrolls inside. */
  #infoSlot { display: none; position: relative; flex: 1 1 250px; max-width: 340px; min-width: 250px; align-self: stretch; }
  #infoSlot.on { display: block; }
  #info.sidepanel { position: absolute; top: 22px; left: 0; right: 0; bottom: 0; max-width: none; min-height: 0; overflow-y: auto; }
  #info.infofloat { position: fixed; z-index: 35; min-height: 0; max-width: none; overflow-y: auto; box-shadow: 0 6px 24px #000a; }
  #info.infofloat.off { display: none; }
  @media (max-width: 480px) { #top .hbtns { gap: 6px; } #top button { padding: 5px 10px; font-size: 13px; } #top .lbl { display: none; } }
/* Look refinements (race-colour card edges, coin badge, inset slots, chunky buttons) */
.side .title{letter-spacing:2px}
/* panels: slightly crisper frame */
#top,.grid,.bench,#info{border-radius:4px;box-shadow:0 3px 0 #0006}
/* shop cards: race color edge + coin cost badge */
.card:has(.race-Human){--rc:#4f84d4}.card:has(.race-Elf){--rc:#3fb383}.card:has(.race-Orc){--rc:#c05a37}
.card:has(.race-Dwarf){--rc:#b8923f}.card:has(.race-Fae){--rc:#a56bd1}.card:has(.race-Clockwork){--rc:#8f98a8}
.card{border-radius:4px;border-left:6px solid var(--rc,var(--line));box-shadow:0 3px 0 #0006}
.card .cost{display:inline-block;background:#0008;color:#ffd166;border:1px solid #5a4129;border-radius:10px;padding:1px 9px;font-size:13px}
/* slots: inset tile instead of dashed outline */
.slot,.bslot{border:2px solid color-mix(in srgb, var(--line) 45%, transparent);border-radius:4px;background:#0004;box-shadow:inset 0 3px 0 #0005}
/* buttons: chunky bottom edge, press sinks, NO colour change on hover */
button{border-radius:4px;box-shadow:0 3px 0 #0008}
button:hover:not(:disabled){border-color:var(--line)}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 #0008}
button.primary{background:var(--prim,#7a5a1c);font-size:17px;padding:9px 20px}
button.primary:hover:not(:disabled){border-color:var(--gold)}
.bar .track{border-radius:3px}

/* Colour themes. No data-pal = the original brown ("classic"). */
:root[data-pal="midnight"]{--bg:#0c1018;--panel:#141b28;--panel2:#1d2738;--line:#34445f;--text:#e6ebf3;--muted:#8e9bb2;--gold:#e8b84a;--prim:#5f5424}
:root[data-pal="charcoal"]{--bg:#121214;--panel:#1c1c20;--panel2:#26262c;--line:#41414b;--text:#e8e6e1;--muted:#9a98a0;--gold:#e8b84a;--prim:#6b5518}
:root[data-pal="forest"]{--bg:#0e1411;--panel:#15201a;--panel2:#1e2c24;--line:#36533f;--text:#e6eddf;--muted:#93a396;--gold:#e0c060;--prim:#5a581f}
:root[data-pal]:not([data-pal="classic"]) .kwtip{background:var(--bg)}
</style>
<script>try{document.documentElement.dataset.pal=localStorage.getItem("warbands-theme")||"midnight";}catch(e){document.documentElement.dataset.pal="midnight";}</script>
</head>
<body>
<div id="app">
  <header id="top">
    <span class="stat">Round <b id="tRound">1</b></span>
    <span class="stat">Gold <b id="tGold">10</b></span>
    <span class="stat">Lives <span class="hearts" id="tLives"></span></span>
    <span class="stat">Wins <b id="tWins">0</b>/<span id="tTarget">10</span></span>
    <span class="stat">Races <span id="tPool"></span></span>
    <span class="hbtns">
      <button id="btnHelp" title="How to play" aria-label="How to play">❓<span class="lbl"> How to play</span></button>
      <button id="btnSound" title="Sound" aria-label="Sound"><span class="ico">🔊</span><span class="lbl"> Sound on</span></button>
      <button id="btnTheme" title="Colour theme" aria-label="Colour theme"><span class="ico">🎨</span><span class="lbl"> Theme</span></button>
      <button id="btnMenu" title="Main menu" aria-label="Main menu"><span class="ico">☰</span><span class="lbl"> Menu</span></button>
      <button id="btnNew">New run</button>
    </span>
  </header>
  <div id="msg"></div>
  <section id="tut" class="hidden"><div class="tuttag"></div><div class="tuttitle"></div><div class="tuttext"></div><div class="tutbtns"><button id="tutSkip">Skip tutorial</button><button id="tutNext" class="primary">Next</button></div></section>

  <main id="arena">
    <section class="side" id="playerSide">
      <div class="title">Your warband</div>
      <div class="bar" id="playerBar"><div class="track"><div class="fill"></div></div><div class="shieldbar"></div><div class="label"></div><div class="floats"></div><div class="slowtag"></div></div>
      <div id="raceline" class="hidden"></div>
      <div id="foeline" class="hidden"></div>
      <div class="grid" id="playerGrid"></div>
      <div class="benchbox">
        <div class="title">Bench (units here do not fight)</div>
        <div class="bench" id="bench"></div>
      </div>
    </section>

    // Clockwork: wind-up (faster every second of the fight) and machine synergy
    def('cogling', 'Cogling', 'Clockwork', 'Peasant', 1, { atk: 3.5, interval: 2.5, lv: [
      `Wind-up: +${pc(T.cog[0])} attack speed per second of the fight, +${pc(T.cogPer)} per Clockwork on your board.`,
      `Wind-up ${pc(T.cog[0])} → ${pc(T.cog[1])} per second.`,
      'Adjacent units get +5% wind-up per second.'] }),
    def('automaton', 'Automaton', 'Clockwork', 'Warrior', 2, { atk: 5, interval: 2.6, lv: [
      `Wind-up: +12% per second, +${pc(T.auto[0])} per adjacent unit.`,
      `Wind-up per adjacent unit +${pc(T.auto[0])} → +${pc(T.auto[1])}.`,
      'Starts the fight already wound up for 2 seconds.'] }),
    def('repeater', 'Repeater', 'Clockwork', 'Archer', 3, { atk: T.repAtk, interval: 2.2, mono: true, lv: [
      `Wind-up: +${pc(T.repBase)} per second, +${pc(T.rep)} per Clockwork on your board. Full Clockwork board: +${pc(T.repFull)} extra.`,
      'No other change.',
      'Other units in its row get +3% wind-up per second.'] }),
    def('bellringer', 'Bellringer', 'Clockwork', 'Bard', 3, { atk: 3, interval: 2.5, lv: [
      `Units in its row (any race) get +${pc(T.bell[0])} wind-up per second.`,
      `+${pc(T.bell[0])} → +${pc(T.bell[1])}. Also reaches the units directly above or below it.`,
      'Reaches all your units. They start the fight wound up for 1 second.'] }),
    def('brassmagus', 'Brass Magus', 'Clockwork', 'Mage', 4, { atk: 8, interval: 2.4, lv: [
      `Adjacent units get +${pc(T.magus)} wind-up per second.`,
      'Also reaches diagonal units.',
      'Every 2nd hit deals +2 damage per Clockwork on your board.'] }),
    def('steamtitan', 'Steam Titan', 'Clockwork', 'Champion', 4, { atk: T.titanAtk, interval: 2.2, lv: [
      `Wind-up: +${pc(T.titan[0])} per second. Its wind-up also adds attack: +${Math.round(T.titanDmg * 100) / 100}% attack per 1% wind-up.`,
      `Wind-up ${pc(T.titan[0])} → ${pc(T.titan[1])} per second.`,
      `Each hit gives adjacent units +${pc(T.titanL3)} wind-up per second for the fight.`] }),
    def('brassdragon', 'Brass Dragon', 'Clockwork', 'Dragon', 5, { atk: T.brassAtk, interval: 2.4, mono: true, lv: [
      `Wind-up: +15% per second. Your other Clockwork get +${pc(T.brass[0])} wind-up per second for each Clockwork on your board. Full Clockwork board: +${pc(T.brassFull[0])} extra.`,
      `Wind-up +${pc(T.brass[0])} → +${pc(T.brass[1])} per Clockwork (full board extra: +${pc(T.brassFull[1])}).`,
      'Your Clockwork start the fight wound up for 1 second.'] }),
  ];
  DEFS.forEach(d => { d.text = d.lv[0]; });
  // Info text for a unit at a given level: the level 1 text plus every change up to that level.
  function unitText(id, level) {
    const d = BY_ID[id];
    const out = [d.lv[0]];
    for (let l = 2; l <= (level || 1); l++) out.push('Level ' + l + ': ' + d.lv[l - 1]);
    return out.join(' ');
  }
  const BY_ID = {};
  DEFS.forEach(d => { BY_ID[d.id] = d; });

  // ------------------------------------------------------------- helpers
  const ok = msg => ({ ok: true, msg: msg || '' });
  const fail = msg => ({ ok: false, msg });
  const cellsOf = (left, w) => (w === 2 ? [left, left + 1] : [left]);
  function neighbors(c) {
    const r = Math.floor(c / COLS), col = c % COLS, out = [];
    if (col > 0) out.push(c - 1);
    if (col < COLS - 1) out.push(c + 1);
    if (r > 0) out.push(c - COLS);
    if (r < ROWS - 1) out.push(c + COLS);
    return out;
  }
  function diagonals(c) {
    const r = Math.floor(c / COLS), col = c % COLS, out = [];
    [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(([dr, dc]) => {
      const rr = r + dr, cc = col + dc;
      if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS) out.push(rr * COLS + cc);
    });
    return out;
  }
  // Pick a number by level: L(u, a, b, c) is a at level 1, b at level 2, c at level 3.
  const L = (u, a, b, c) => [0, a, b, c][u.level];
  // Roll a tier from this round's odds table (the shop table, or another table given as `table`).
  function rollTier(round, rng, table) {
    const odds = table ? table[Math.min(round, table.length - 1)] : oddsFor(round);
    let x = rng() * 100;
    for (let i = 0; i < odds.length; i++) { x -= odds[i]; if (x < 0) return i + 1; }
    return 1;
  }
  const BY_TIER = [null, [], [], [], [], []];
  DEFS.forEach(d => { BY_TIER[d.tier].push(d); });
  // A random unit of the given tier. With a race given, that race is preferred when it has one in the tier.
  // Pick n different races at random (all of them if there are not more than n), in the usual order.
  function pickRaces(rng, n) {
    const pool = RACES.slice();
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    const chosen = pool.slice(0, Math.min(n, pool.length));
    return RACES.filter(r => chosen.includes(r));
  }
  function pickUnit(tier, rng, race, pool) {
    const all = pool ? BY_TIER[tier].filter(d => pool.includes(d.race)) : BY_TIER[tier];
    const same = race ? all.filter(d => d.race === race) : [];
    const src = same.length ? same : all;
    return src[Math.floor(rng() * src.length)];
  }

  // ---------------------------------------------------------- combat setup
  // Recompute a unit's attack timer after its speed changed. Own speed bonuses (auras, wind-up, stolen speed)
  // are capped at 3x; then the slow the enemy put on this team (Fae) and on this unit (hex) is applied.
  function setSpeed(u) {
    // elfSpeed: the part of speedBonus that came from Elves; a Bladedancer counts it extra (elfMult).
    const sp = Math.min(3, 1 + u.speedBonus + u.elfSpeed * u.elfMult + u.windBonus + u.stolen);
    const slow = Math.min(UNIT_SLOW_CAP, Math.min(SLOW_CAP, u.team.slowed) + u.hex);
    u.speed = sp * (1 - slow);
    u.interval = u.baseInterval / u.speed;
  }
  // Clockwork wind-up bonus at fight time t.
  const windAt = (u, t) => (u.wind > 0 ? Math.min(WIND_CAP, u.wind * (t + u.windHead)) : 0);
  // Push back the next attack of every unit in a team (Fae), at most DELAY_CAP seconds per unit per fight.
  function delayTeam(team, sec) {
    team.units.forEach(u => {
      const add = Math.max(0, Math.min(sec, DELAY_CAP - u.delayed));
      u.delayed += add; u.next += add;
    });
  }
  // Change a unit's speed mid-fight so it applies at once: the part of the current wait that is left
  // gets shorter or longer too (used by wind-up and by Fae slows).
  function respeed(u, t) {
    const left = Math.max(0, u.next - t) / u.interval;
    setSpeed(u);
    u.next = t + left * u.interval;
  }
  // Slow a whole team a bit more for the rest of the fight (Fae). Capped by SLOW_CAP.
  function slowTeam(team, amt, t) {
    team.slowed = Math.min(SLOW_CAP, team.slowed + amt);
    team.units.forEach(u => respeed(u, t));
  }

  // slots: [{uid, id, cell, level, grow}]
  function buildTeam(slots, maxHpValue) {
    const units = slots.map(s => {
      const d = BY_ID[s.id];
      const level = s.level || 1;
      const baseInterval = d.lvInterval ? d.lvInterval[level] : d.interval;
      return {
        uid: s.uid, id: d.id, def: d, race: d.race, cell: s.cell, cells: cellsOf(s.cell, d.w),
        row: Math.floor(s.cell / COLS), level, mult: MULT[level], soft: SOFT[level], haste: HASTE[level],
        grow: s.grow || 0, buffAtk: 0, atkPct: 0, speedBonus: 0, attacks: 0, adj: [], near: [],
        speed: 1, baseInterval, interval: baseInterval, next: 0, enrage: 0, fast: false,
        // new races: wind-up rate per second and head start (Clockwork), slow/hex/delay received and stolen speed (Fae)
        wind: 0, windHead: 0, windBonus: 0, stolen: 0, hex: 0, delayed: 0, first: 1, team: null,
        // tier 4 big hitters: Elf speed (Bladedancer), bonus vs a low enemy bar (Skullsplitter), copied hit (Changeling)
        elfSpeed: 0, elfMult: 0, given: 0, execPct: 0, copyAtk: 0,
      };
    });
    const owner = {};
    units.forEach(u => u.cells.forEach(c => { owner[c] = u; }));
    units.forEach(u => {
      // adj: units next to it (up/down/left/right). near: adjacent plus diagonal units.
      const seen = new Set(), seenNear = new Set();
      u.cells.forEach(c => {
        neighbors(c).forEach(n => {
          const o = owner[n];
          if (o && o !== u && !seen.has(o)) { seen.add(o); u.adj.push(o); }
        });
        neighbors(c).concat(diagonals(c)).forEach(n => {
          const o = owner[n];
          if (o && o !== u && !seenNear.has(o)) { seenNear.add(o); u.near.push(o); }
        });
      });
    });
    const count = {};
    RACES.forEach(r => { count[r] = 0; });
    units.forEach(u => { count[u.race]++; });
    let diff = RACES.filter(r => count[r] > 0).length;
    // Full board of one race: all cells filled and every unit of that race (mono payoffs check this).
    const filled = units.reduce((n, u) => n + u.cells.length, 0);
    const full = r => filled === CELLS && units.length > 0 && count[r] === units.length;
    // A level 3 Militiaman counts as one extra different race (at most 3).
    if (units.some(u => u.id === 'militiaman' && u.level === 3)) diff = Math.min(3, diff + 1);
    const team = {
      units, count, diff, full, shield: 0, reshield: [], overheal: false,
      shieldMult: 1, absorbed: 0,          // Dwarf: Runesmith shield bonus, shield blocked so far (Slayer)
      slowed: 0,                           // Fae: slow the enemy has put on this team
      foeSlow: 0, foeDelay: 0, hexes: [],  // Fae: what this team does to the enemy at battle start
      stagShare: 0,                        // Fae: level 3 Spirit Stag shares stolen speed
    };
    units.forEach(u => { u.team = team; });
    // Runesmith first, because it makes every other shield bigger.
    units.forEach(u => { if (u.id === 'runesmith') team.shieldMult += L(u, 0.4, 0.8, 0.8); });
    const addShield = v => { team.shield += v * team.shieldMult; };
    const isCW = a => a.race === 'Clockwork';
    // Speed from an Elf to an Elf: also counted in elfSpeed, so a Bladedancer can count it extra.
    const elfHaste = (a, v) => { a.speedBonus += v; a.elfSpeed += v; };

    // Passive effects that are fixed when the fight starts.
    units.forEach(u => {
      switch (u.id) {
        case 'knight': {
          const sh = maxHpValue * (T.knight[0] + T.knight[1] * diff) * team.shieldMult;
          team.shield += sh;
          // Each entry is one return of the shield after it breaks (all Knights add up).
          KNIGHT[u.level].forEach((f, i) => { team.reshield[i] = (team.reshield[i] || 0) + sh * f; });
          break;
        }
        case 'priest':
          team.overheal = true;
          break;
        case 'sentinel':
          (u.level === 1 ? u.adj : u.near).forEach(a => { if (a.race === 'Elf') elfHaste(a, L(u, ...T.sentinel)); });
          break;
        case 'ranger':
          if (u.level === 3) u.speedBonus += T.rangerL3;
          break;
        case 'songweaver': {
          const sp = L(u, ...T.song) * count.Elf + (full('Elf') ? T.songFull : 0);
          units.forEach(a => { if (a.race === 'Elf') { elfHaste(a, sp); if (u.level === 3) a.first = Math.min(a.first, 0.5); } });
          break;
        }
        case 'bladedancer':
          u.elfMult += L(u, ...T.dancer) - 1;
          break;
        case 'wyrm': {
          const sp = L(u, ...T.wyrm) * count.Elf + (full('Elf') ? T.wyrmFull : 0);
          units.forEach(a => { if (a.race === 'Elf') elfHaste(a, sp); });
          break;
        }
        case 'lionheart':
          u.speedBonus += L(u, ...T.lion) * diff;
          if (u.level === 3) u.adj.forEach(a => { if (a.race !== 'Human') a.speedBonus += T.lionAdj; });
          break;
        case 'skullsplitter':
          u.execPct += L(u, ...T.skull);
          if (u.level === 3) u.adj.forEach(a => { a.execPct += T.skullAdj; });
          break;
        case 'ironbreaker':
          if (u.level === 3) addShield(maxHpValue * T.ironL3);
          break;
        case 'grunt':
          (u.level === 3 ? u.near : u.adj).forEach(a => { a.atkPct += L(u, ...T.grunt); });
          break;
        case 'brute':
          if (u.level === 3) u.adj.forEach(a => { a.enrage += 1; });
          break;
        case 'drummer':
          u.beat = u.level === 3 ? 0 : T.drumEvery;   // time of the next drumbeat
          break;
        case 'shaman':
          (u.level === 3 ? u.near : u.adj).forEach(a => { a.atkPct += L(u, ...T.shaman); });
          break;
        case 'ashmaw': {
          const per = L(u, ...T.ash) * count.Orc + (full('Orc') ? L(u, ...T.ashFull) : 0);
          units.forEach(a => { if (a.race === 'Orc') a.atkPct += per; });
          break;
        }
        case 'gilded':
          if (diff === 3) u.speedBonus += L(u, ...T.gildedSpeed);
          break;
        // --- Dwarf
        case 'shieldbearer':
          addShield(maxHpValue * (L(u, ...T.sb) + (u.level === 3 ? 0.01 * (count.Dwarf - 1) : 0)));
          break;
        case 'thunderer':
          if (u.level === 3) u.first = 0;
          break;
        case 'magmadrake':
          addShield(maxHpValue * (L(u, ...T.magma) * count.Dwarf + (full('Dwarf') ? T.magmaFull : 0)));
          break;
        // --- Fae
        case 'pixie':
          team.foeSlow += L(u, ...T.pixie) + T.pixiePer * count.Fae;
          if (u.level === 3) team.foeDelay += 0.5;
          break;
        case 'thornguard':
          team.foeDelay += L(u, ...T.thorn);
          if (u.level === 3) team.foeSlow += 0.05;
          break;
        case 'trickster':
          team.hexes.push(L(u, 0.3, 0.5, 0.5));
          if (u.level === 3) team.hexes.push(0.5);
          break;
        case 'spiritstag':
          if (u.level === 3) team.stagShare += 0.5;
          break;
        // --- Clockwork: base wind-up rates
        case 'cogling':
          u.wind += L(u, ...T.cog) + T.cogPer * count.Clockwork;
          if (u.level === 3) u.adj.forEach(a => { a.wind += 0.05; });
          break;
        case 'automaton':
          u.wind += 0.12 + L(u, ...T.auto) * u.adj.length;
          if (u.level === 3) u.windHead += 2;
          break;
        case 'repeater':
          u.wind += T.repBase + T.rep * count.Clockwork + (full('Clockwork') ? T.repFull : 0);
          if (u.level === 3) units.forEach(a => { if (a !== u && a.row === u.row) a.wind += 0.03; });
          break;
        case 'bellringer': {
          const reach = a => u.level === 3 || a.row === u.row || (u.level === 2 && u.adj.includes(a));
          units.forEach(a => { if (reach(a)) a.wind += L(u, ...T.bell); });
          if (u.level === 3) units.forEach(a => { a.windHead += 1; });
          break;
        }
        case 'brassmagus':
          (u.level === 1 ? u.adj : u.near).forEach(a => { a.wind += T.magus; });
          break;
        case 'steamtitan':
          u.wind += L(u, ...T.titan);
          break;
        case 'brassdragon':
          u.wind += 0.15;
          units.forEach(a => {
            if (a === u || !isCW(a)) return;
            a.wind += L(u, ...T.brass) * count.Clockwork + (full('Clockwork') ? L(u, ...T.brassFull) : 0);
            if (u.level === 3) a.windHead += 1;
          });
          break;
        default:
      }
    });
    units.forEach(u => {
      u.windBonus = windAt(u, 0);
      if (u.id === 'priest' && u.level === 3) u.first = 0;
      setSpeed(u);
      u.next = u.interval * u.first;
    });
    return team;
  }

  // Fae: how much the strongest enemy units matter, for the Trickster's hex (damage or healing per second at battle start).
  function strength(u, side) {
    const v = u.def.kind === 'heal' ? healValue(u, side) : atkValue(u, side, 0);
    return v / u.interval;
  }
  // Fae: speed a Spirit Stag steals = the slow on the enemy team.
  function updateStolen(team, foeTeam, t) {
    const stolen = foeTeam ? Math.min(SLOW_CAP, foeTeam.slowed) : Math.min(SLOW_CAP, team.foeSlow);
    team.units.forEach(u => {
      const v = u.id === 'spiritstag' ? T.stagSteal * stolen : (u.race === 'Fae' && team.stagShare ? T.stagSteal * stolen / 2 : 0);   // others: half
      if (v !== u.stolen) { u.stolen = v; if (t === undefined) setSpeed(u); else respeed(u, t); }
    });
  }

  // Damage of one hit right now. side = {team, hp, max}
  function atkValue(u, side, t) {
    const d = u.def, team = side.team;
    let base;
    switch (u.id) {
      case 'militiaman': base = d.atk + u.grow; break;
      case 'crossbowman': base = d.atk + T.crossPer * team.diff; break;
      case 'gilded': base = d.atk + L(u, ...T.gildedPer) * team.diff; break;
      case 'ranger': base = d.atk + T.ranger * team.count.Elf; break;
      case 'brute': base = d.atk + Math.floor(t / L(u, 2, 1.5, 1.5)); break;
      case 'bloodrager': base = d.atk + T.blood * team.count.Orc + (team.full('Orc') ? T.bloodFull : 0); break;
      case 'ashmaw': base = d.atk + (u.level === 3 ? T.ashRamp * t : 0); break;
      case 'shieldbearer': base = d.atk + 20 * (side.shield || 0) / side.max; break;
      case 'thunderer': base = d.atk + (100 / 6) * team.shield / side.max; break;
      case 'slayer': base = d.atk + T.slayer * team.count.Dwarf + (team.full('Dwarf') ? T.slayerFull : 0); break;
      case 'spiritstag': base = d.atk + T.stag * team.count.Fae + (team.full('Fae') ? T.stagFull : 0); break;
      case 'stormwyrm': base = d.atk + T.storm * team.count.Fae + (team.full('Fae') ? T.stormFull : 0); break;
      case 'wyrm': base = d.atk + (u.level === 3 ? T.wyrmL3 * team.count.Elf : 0); break;
      case 'ironbreaker': base = d.atk + team.absorbed / (side.max * L(u, ...T.iron)); break;
      case 'changeling': base = u.copyAtk || d.atk; break;
      case 'steamtitan': base = d.atk * (1 + T.titanDmg * u.windBonus); break;
      default: base = d.atk;
    }
    // Enrage given by an adjacent level 3 Brute: +1 attack every 2 seconds.
    const extra = u.enrage ? u.enrage * Math.floor(t / 2) : 0;
    // Skullsplitter: extra damage while the enemy health bar is below half (side.foe is set during a fight only).
    const exec = u.execPct && side.foe && side.foe.hp < side.foe.max * 0.5 ? u.execPct : 0;
    // Orc buffs make a unit hit a percentage harder (atkPct), on top of everything else.
    return (base * u.mult + u.buffAtk + extra) * (1 + u.atkPct + exec);
  }

  // Health restored by one heal. side = {team, max}
  function healValue(u, side) {
    if (u.id === 'priest') {
      const more = L(u, 1, 1.5, 2);
      return side.max * (T.priest[0] + T.priest[1] * side.team.diff) * more;
    }
    if (u.id === 'moonpriestess') return side.max * (T.moon + T.moonPer * side.team.count.Elf) * L(u, 1, 1.25, 1.5);
    // Runepriest: the value is shield, not health (Runesmith makes it bigger).
    if (u.id === 'runepriest') return side.max * T.rune * L(u, 1, 1.25, 1.5) * side.team.shieldMult;
    if (u.id === 'dryad') return side.max * T.dryad * L(u, 1, 1.25, 1.5);
    return 0;
  }

  // ---------------------------------------------------------------- battle
  function createBattle(playerSlots, enemySlots, round) {
    const max = maxHp(round);
    const mk = slots => {
      const team = buildTeam(slots, max);
      return { team, units: team.units, hp: max, max, shield: team.shield, startShield: team.shield, reshield: team.reshield.slice() };
    };
    const b = { round, t: 0, sides: [mk(playerSlots), mk(enemySlots)], over: false, result: null, timeout: false };
    b.sides[0].foe = b.sides[1]; b.sides[1].foe = b.sides[0];
    // Changeling: copies the hardest hit of the enemy team at battle start, counted as if that unit were level 1 and
    // without % boosts from other units (so it copies the unit, not its merges or Orc buffs). Its own level multiplier applies on top.
    const copied = [];
    const hitAtL1 = (f, side) => { const m = f.mult, p = f.atkPct; f.mult = 1; f.atkPct = 0; const v = atkValue(f, side, 0); f.mult = m; f.atkPct = p; return v; };
    b.sides.forEach(me => me.units.forEach(u => {
      if (u.id !== 'changeling') return;
      let best = null, bv = 0;
      me.foe.units.forEach(f => { if (f.def.kind === 'heal') return; const v = hitAtL1(f, me.foe); if (v > bv) { bv = v; best = f; } });
      u.copyAtk = Math.max(u.def.atk, L(u, ...T.change) * bv);
      if (u.level === 3 && best) copied.push(best);
    }));

    // Fae effects at battle start: each side slows, delays and hexes the other one.
    const fae = b.sides.some(s => s.team.foeSlow || s.team.foeDelay || s.team.hexes.length || s.units.some(u => u.race === 'Fae'));
    if (fae) {
      for (let si = 0; si < 2; si++) {
        const me = b.sides[si], foe = b.sides[1 - si];
        foe.team.slowed = Math.min(SLOW_CAP, me.team.foeSlow);
        if (me.team.hexes.length) {
          const ranked = foe.units.slice().sort((a, c) => strength(c, foe) - strength(a, foe));
          me.team.hexes.slice().sort((a, c) => c - a).forEach((h, i) => { if (ranked[i]) ranked[i].hex += h; });
        }
      }
      for (let si = 0; si < 2; si++) {
        const me = b.sides[si], foe = b.sides[1 - si];
        updateStolen(me.team, foe.team);
        me.units.forEach(u => { setSpeed(u); u.next = u.interval * u.first; });
      }
      for (let si = 0; si < 2; si++) if (b.sides[si].team.foeDelay) delayTeam(b.sides[1 - si].team, b.sides[si].team.foeDelay);
    }
    // Level 3 Changeling: the copied enemy unit's first attack comes later (counts toward that unit's delay cap).
    copied.forEach(f => { const add = Math.max(0, Math.min(T.changeDelay, DELAY_CAP - f.delayed)); f.delayed += add; f.next += add; });

    // Advances the fight by dt seconds and returns what happened, for the UI to animate.
    // Fight statistics for the UI: per side, uid -> { dmg: attack damage dealt, heal: health restored, ward: shield granted }.
    b.stats = [{}, {}];
    b.step = function (dt) {
      if (b.over) return [];
      b.t = Math.round((b.t + dt) * 1000) / 1000;
      const events = [];
      const dmg = [0, 0];   // damage dealt TO side i
      const heal = [0, 0];
      const ward = [0, 0];  // shield gained by side i this tick
      const slowAdd = [0, 0]; // extra slow put ON side i this tick (Fae)
      const delayAdd = [0, 0]; // delay put ON side i this tick (Fae)
      for (let si = 0; si < 2; si++) {
        const side = b.sides[si];
        // Units whose speed changes every tick (Clockwork wind-up; a level 3 Steam Titan can add wind-up mid-fight).
        for (const u of side.units) {
          if (!(u.wind > 0)) continue;
          const w = windAt(u, b.t);
          if (w !== u.windBonus) { u.windBonus = w; respeed(u, b.t); }
        }
        for (const u of side.units) {
          // War Drummer: every few seconds, adjacent (level 2+: and diagonal) units get attack for the fight.
          if (u.beat !== undefined && b.t + 1e-9 >= u.beat) {
            u.beat += T.drumEvery;
            (u.level === 1 ? u.adj : u.near).forEach(a => { a.atkPct += T.drum; events.push({ side: si, uid: a.uid, kind: 'buff', value: T.drum, pct: true }); });
          }
          // Level 3 Bloodrager: 30% faster once its own bar is below half.
          if (u.id === 'bloodrager' && u.level === 3 && !u.fast && side.hp < side.max * 0.5) {
            u.fast = true; u.speedBonus += 0.30; setSpeed(u);
          }
          let guard = 0;
          while (b.t + 1e-9 >= u.next && guard++ < 5) {
            u.next += u.interval;
            if (u.def.kind === 'heal') {
              const v = healValue(u, side);
              if (u.def.ward) {
                ward[si] += v;
                events.push({ side: si, uid: u.uid, kind: 'ward', value: v });
                if (u.level === 3) side.units.forEach(a => { if (a.race === 'Dwarf') a.buffAtk += 1; });
              } else {
                heal[si] += v;
                events.push({ side: si, uid: u.uid, kind: 'heal', value: v });
              }
              if (u.id === 'moonpriestess' && u.level === 3) {
                side.units.forEach(a => { if (a.race === 'Elf') { a.speedBonus += 0.05; a.elfSpeed += 0.05; setSpeed(a); } });
              }
              if (u.id === 'dryad' && u.level === 3) slowAdd[1 - si] += 0.03;
            } else {
              u.attacks++;
              let v = atkValue(u, side, b.t);
              let bolt = false;
              if (u.id === 'spellweaver' && u.attacks % L(u, 2, 2, 1) === 0) { v += L(u, ...T.spell) * side.team.count.Elf; bolt = true; }
              if (u.id === 'crossbowman' && u.level === 3 && u.attacks % 4 === 0) v *= 2;
              if (u.id === 'brassmagus' && u.level === 3 && u.attacks % 2 === 0) { v += 2 * side.team.count.Clockwork; bolt = true; }
              if (u.id === 'runesmith' && u.level === 3) v += 0.1 * side.shield;
              if (u.id === 'magmadrake') {
                if (u.level === 3) side.shield += side.max * 0.04 * side.team.shieldMult;
                const burn = side.shield * 0.2;
                side.shield -= burn; v += 2 * burn; bolt = burn > 0;
              }
              if (u.id === 'stormwyrm') {
                slowAdd[1 - si] += L(u, 0.05, 0.07, 0.07);
                if (u.level === 3 && u.attacks % 3 === 0) delayAdd[1 - si] += 0.5;
              }
              dmg[1 - si] += v;
              events.push({ side: si, uid: u.uid, kind: 'attack', value: v, bolt });
              if (u.id === 'wizard' && u.attacks % L(u, 2, 1, 1) === 0) {
                const amt = L(u, 2, 2, 3);
                (u.level === 3 ? u.near : u.adj).forEach(a => { a.buffAtk += amt; events.push({ side: si, uid: a.uid, kind: 'buff', value: amt }); });
              }
              // Level 3 Bladedancer: each hit speeds up the other Elves (up to a maximum per Bladedancer).
              if (u.id === 'bladedancer' && u.level === 3 && u.given < T.dancerMax - 1e-9) {
                const add = Math.min(T.dancerL3, T.dancerMax - u.given);
                u.given += add;
                side.units.forEach(a => { if (a !== u && a.race === 'Elf') { a.speedBonus += add; a.elfSpeed += add; respeed(a, b.t); events.push({ side: si, uid: a.uid, kind: 'buff', value: 0 }); } });
              }
              // Level 3 Steam Titan: each hit gives adjacent units (any race) more wind-up.
              if (u.id === 'steamtitan' && u.level === 3) {
                u.adj.forEach(a => { a.wind += T.titanL3; events.push({ side: si, uid: a.uid, kind: 'buff', value: 0 }); });
              }
            }
          }
        }
      }
      for (let si = 0; si < 2; si++) {
        const s = b.sides[si];
        let d = dmg[si];
        let broke = false;
        if (s.shield > 0 && d > 0) {
          const a = Math.min(s.shield, d); s.shield -= a; d -= a; s.team.absorbed += a;
          if (s.shield <= 1e-9) broke = true;
        }
        // Knight level 2+: a broken shield comes back once.
        if (s.shield <= 0 && s.reshield.length && dmg[si] > 0) {
          s.shield = s.reshield.shift();
          events.push({ side: si, kind: 'reshield', value: s.shield });
          const a = Math.min(s.shield, d); s.shield -= a; d -= a; s.team.absorbed += a;
          if (a > 0 && s.shield <= 1e-9) broke = true;
        }
        s.hp -= d;
        if (s.hp > 0 && heal[si] > 0) {
          const over = s.hp + heal[si] - s.max;
          s.hp = Math.min(s.max, s.hp + heal[si]);
          // Priest: healing beyond full health becomes shield.
          if (over > 0 && s.team.overheal) s.shield += over * s.team.shieldMult;
        }
        if (ward[si] > 0) s.shield += ward[si];
        // Level 3 Slayer: strikes at once when the shield breaks.
        if (broke) {
          events.push({ side: si, kind: 'shieldbreak' });
          s.units.forEach(u => { if (u.id === 'slayer' && u.level === 3) u.next = Math.min(u.next, b.t + CFG.tick); });
        }
      }
      // Fae effects that happened this tick.
      for (let si = 0; si < 2; si++) {
        if (slowAdd[si] > 0) { slowTeam(b.sides[si].team, slowAdd[si], b.t); events.push({ side: si, kind: 'slow', value: b.sides[si].team.slowed }); }
        if (delayAdd[si] > 0) { delayTeam(b.sides[si].team, delayAdd[si]); events.push({ side: si, kind: 'delay', value: delayAdd[si] }); }
      }
      if (slowAdd[0] > 0 || slowAdd[1] > 0) for (let si = 0; si < 2; si++) updateStolen(b.sides[si].team, b.sides[1 - si].team, b.t);
      const pDead = b.sides[0].hp <= 0, eDead = b.sides[1].hp <= 0;
      if (pDead || eDead) {
        b.over = true;
        if (pDead && eDead) {
          // Both bars emptied in the same tick: the side that overshot less wins.
          const p = b.sides[0].hp, e = b.sides[1].hp;
          b.result = Math.abs(p - e) < 1e-6 ? 'draw' : p > e ? 'win' : 'loss';
        } else {
          b.result = pDead ? 'loss' : 'win';
        }
      } else if (b.t >= CFG.maxTime) {
        b.over = true; b.timeout = true;
        const p = b.sides[0].hp, e = b.sides[1].hp;
        b.result = Math.abs(p - e) < 1e-6 ? 'draw' : p > e ? 'win' : 'loss';
      }
      for (const e of events) {
        if (e.uid == null || (e.kind !== 'attack' && e.kind !== 'heal' && e.kind !== 'ward')) continue;
        const st = b.stats[e.side][e.uid] || (b.stats[e.side][e.uid] = { dmg: 0, heal: 0, ward: 0 });
        st[e.kind === 'attack' ? 'dmg' : e.kind] += e.value;
      }
      return events;
    };
    return b;
  }

  function runBattle(b) {
    let n = 0;
    while (!b.over && n++ < 5000) b.step(CFG.tick);
    return b.result;
  }

  // ----------------------------------------------------------- AI opponents
  // ======== ENEMY TUNING (temporary) ========
  // Everything that sets how strong the generated enemy teams are lives in this block. It is a stand-in until you fight
  // other players' ghosts (saved boards); then generateEnemy and this block can go. The tutorial supplies its own enemies
  // (script.enemy) and never comes through here. The health bar is NOT part of this: it is the same for both sides.
  const GT = root.GAME_TUNE || {};   // test hook (balance scripts), unused in the game
  // Team size by round (round 1, 2, 3...); a full 6 after the list ends.
  const ENEMY_COUNT = GT.enemyCount || [0, 2, 3, 4, 6];
  // Tier odds for enemy units. null = use the shop table (TIER_ODDS).
  const ENEMY_TIER_ODDS = GT.enemyOdds || null;
  // Chance that an enemy unit is level 3 / level 2 grows smoothly with the round.
  // Level 2 chance: +11.5% per round from round 2, at most 64%. Level 3 chance: +5% per round from round 4, at most 42%.
  // History: level 2 was +10% / max 65% while Siege Engines existed (an enemy siege took 2 cells, so late enemy teams
  // averaged about 5.3 units), then +8.5% / max 52% (level 3: +5% / max 40%) with 1-cell units only. It went up again with the
  // softer shop tier odds (fewer tier 4-5, more tier 1-3): players now merge cheap units to level 3 far more often, enemies
  // do not merge, so they get these extra levels instead. Most of the raise is on level 2, which bites in rounds 3-7;
  // raising level 3 instead hits the late game, where focused (one-race) boards are strongest, and flattened their edge.
  const ENEMY_L2 = GT.enemyL2 || [0.125, 0.66], ENEMY_L3 = GT.enemyL3 || [0.055, 0.44];
  // Expensive units level up more slowly, as they would for a player: tier 4 at 40% and tier 5 at 30% of the usual chance.
  const ENEMY_LEVEL_RATE = GT.enemyRate || [0, 1, 1, 1, 0.4, 0.3];
  // ======== end of ENEMY TUNING ========
  function pickLevel(round, rng, tier) {
    const f = ENEMY_LEVEL_RATE[tier] || 1;
    const p3 = f * Math.min(ENEMY_L3[1], Math.max(0, (round - 3) * ENEMY_L3[0]));
    const p2 = f * Math.min(ENEMY_L2[1], Math.max(0, (round - 1) * ENEMY_L2[0]));
    const r = rng();
    return r < p3 ? 3 : r < p3 + p2 ? 2 : 1;
  }

  function generateEnemy(round, rng) {
    // Enemy team size by round (round 1, 2, 3...); a full 6 after the list ends.
    const n = ENEMY_COUNT[round] || 6;
    // Each enemy team follows the same rule as you: it draws from its own set of (at most) poolSize races.
    const races = pickRaces(rng, CFG.poolSize);
    const pref = races[Math.floor(rng() * races.length)];
    const slots = [];
    const occ = new Array(CELLS).fill(false);
    let guard = 0;
    while (slots.length < n && guard++ < 80) {
      // Enemy units roll their tier from ENEMY_TIER_ODDS (or the shop table); 60% of them lean toward one race.
      const d = pickUnit(rollTier(round, rng, ENEMY_TIER_ODDS), rng, rng() < 0.6 ? pref : null, races);
      const spots = [];
      for (let c = 0; c < CELLS; c++) {
        if (d.w === 1 && !occ[c]) spots.push(c);
        if (d.w === 2 && c % COLS < COLS - 1 && !occ[c] && !occ[c + 1]) spots.push(c);
      }
      if (!spots.length) continue;
      const cell = spots[Math.floor(rng() * spots.length)];
      cellsOf(cell, d.w).forEach(c => { occ[c] = true; });
      slots.push({
        uid: 'e' + slots.length, id: d.id, cell, level: pickLevel(round, rng, d.tier),
        grow: d.id === 'militiaman' ? Math.min(MILITIA_CAP, Math.floor(round / 2)) : 0,
      });
    }
    return { race: pref, races, slots };
  }

  // ------------------------------------------------------------- game state
  // opts (used by the tutorial only): { pool: [races], winTarget: n, script: { shop(round, rolls) -> unit ids, enemy(round) -> {races, slots} } }.
  // A script makes the shop and the enemies fixed; without it nothing here changes.
  function newGame(rng, opts) {
    const s = {
      rng: rng || Math.random,
      pool: null, round: 1, gold: goldFor(1), lives: CFG.startLives, wins: 0,
      board: [], bench: new Array(CFG.benchSize).fill(null), shop: [], phase: 'shop', nextUid: 1,
      battle: null, enemy: null, lastResult: null, rolls: 0, locked: false, winTarget: (opts && opts.winTarget) || CFG.winTarget, script: (opts && opts.script) || null,
    };
    s.pool = opts && opts.pool ? opts.pool.slice() : pickRaces(s.rng, CFG.poolSize);
    rollShop(s);
    return s;
  }

  function rollShop(s) {
    if (s.script && s.script.shop) { s.shop = s.script.shop(s.round, s.rolls++).slice(); return; }
    s.shop = [];
    for (let i = 0; i < CFG.shopSize; i++) s.shop.push(pickUnit(rollTier(s.round, s.rng), s.rng, null, s.pool).id);
  }

  function occupancy(board, ignore) {
    const occ = new Array(CELLS).fill(null);
    for (const u of board) {
      if (ignore && ignore.includes(u.uid)) continue;
      cellsOf(u.cell, BY_ID[u.id].w).forEach(c => { occ[c] = u.uid; });
    }
    return occ;
  }

  // Where would a unit of width w go if dropped on `cell`? Returns its left cell or -1.
  function findPlacement(board, w, cell, ignore) {
    const occ = occupancy(board, ignore);
    const col = cell % COLS;
    let options;
    if (w === 1) options = [cell];
    else options = col === 0 ? [cell] : col === 1 ? [cell, cell - 1] : [cell - 1];
    for (const left of options) {
      if (cellsOf(left, w).every(c => occ[c] === null)) return left;
    }
    return -1;
  }

  function unitAt(board, cell) {
    return board.find(u => cellsOf(u.cell, BY_ID[u.id].w).includes(cell)) || null;
  }

  // ------------------------------------------------------------------ bench
  // The bench has CFG.benchSize slots, each holding one unit of any size. Benched units do not fight and
  // do not count for race or adjacency bonuses, but they do count for merging.
  const allUnits = s => s.board.concat(s.bench.filter(Boolean));
  const sameUnits = (s, id, level) => allUnits(s).filter(u => u.id === id && u.level === level);
  const onBoard = (s, u) => s.board.includes(u);

  function locate(s, uid) {
    const b = s.board.find(u => u.uid === uid);
    if (b) return { unit: b, zone: 'board' };
    const slot = s.bench.findIndex(u => u && u.uid === uid);
    if (slot >= 0) return { unit: s.bench[slot], zone: 'bench', slot };
    return null;
  }

  function removeUnit(s, u) {
    s.board = s.board.filter(x => x !== u);
    const i = s.bench.indexOf(u);
    if (i >= 0) s.bench[i] = null;
  }

  // ---------------------------------------------------------------- merging
  // Works like Teamfight Tactics: three copies of the same unit at the same level become one unit of the
  // next level, automatically, and chains continue (three level 2 become a level 3). Board and bench count.

  // Would buying one more `id` complete a trio of level 1 units?
  const completesMerge = (s, id) => sameUnits(s, id, 1).length >= 2;

  // Merges every complete trio of `id`. `extra` is a just-bought unit that has no place yet; it is consumed
  // by the merge. The merged unit stays on the board if any of the three stood there (on the anchor's cell if
  // the anchor is on the board, else on the front-left-most one), otherwise it stays on the bench.
  // Returns the highest level reached, or 0 if nothing merged.
  function autoMerge(s, id, anchorUid, extra) {
    let reached = 0;
    let anchor = anchorUid;
    let pending = extra || null;
    for (let level = 1; level < MAX_LEVEL; level++) {
      const group = sameUnits(s, id, level);
      if (pending && pending.level === level) group.push(pending);
      if (group.length < 3) continue;
      const place = u => (u === pending ? 2 : onBoard(s, u) ? 0 : 1);
      const where = u => (onBoard(s, u) ? u.cell : s.bench.indexOf(u));
      const first = u => (u.uid === anchor ? 0 : 1);
      const trio = group.slice().sort((a, b) => place(a) - place(b) || first(a) - first(b) || where(a) - where(b)).slice(0, 3);
      const keep = trio[0];
      keep.level = level + 1;
      keep.grow = Math.max(...trio.map(u => u.grow || 0));
      trio.slice(1).forEach(u => { if (u === pending) pending = null; else removeUnit(s, u); });
      anchor = keep.uid;
      reached = keep.level;
    }
    return reached;
  }

  // -------------------------------------------------------------- buying
  // Checks shared by every kind of purchase.
  function checkBuy(s, idx) {
    if (s.phase !== 'shop') return { err: fail('You can only shop between fights.') };
    const id = s.shop[idx];
    if (!id) return { err: fail('That slot is empty.') };
    const d = BY_ID[id];
    if (s.gold < d.cost) return { err: fail('Not enough gold.') };
    return { id, d };
  }

  // Pays for the unit and puts it at `place` ({board: leftCell} or {bench: slot}). With place = null the unit
  // completes a trio and is merged straight away, so it needs no space at all.
  function completeBuy(s, idx, d, place, anchorUid) {
    const unit = { uid: s.nextUid++, id: d.id, level: 1, grow: 0 };
    s.gold -= d.cost;
    s.shop[idx] = null;
    let reached;
    if (!place) {
      reached = autoMerge(s, d.id, anchorUid || null, unit);
    } else {
      if (place.board !== undefined) { unit.cell = place.board; s.board.push(unit); }
      else s.bench[place.bench] = unit;
      reached = autoMerge(s, d.id, unit.uid, null);
    }
    if (reached) return ok(d.name + ' merged into a level ' + reached + ' unit!');
    return ok(place && place.bench !== undefined ? 'Bought ' + d.name + ' (on your bench).' : 'Bought ' + d.name + '.');
  }

  function buyToCell(s, idx, cell) {
    const c = checkBuy(s, idx);
    if (c.err) return c.err;
    const { id, d } = c;
    const target = unitAt(s.board, cell);
    const left = target ? -1 : findPlacement(s.board, d.w, cell);
    if (left >= 0) return completeBuy(s, idx, d, { board: left });
    if (completesMerge(s, id)) return completeBuy(s, idx, d, null, target && target.id === id ? target.uid : null);
    if (target) return fail('That cell is taken. Pick an empty cell, or a bench slot.');
    return fail(d.w === 2 ? 'Not enough room: ' + d.name + ' needs 2 free cells side by side. Try the bench.' : 'No room there.');
  }

  function buyToBench(s, idx, slot) {
    const c = checkBuy(s, idx);
    if (c.err) return c.err;
    const { id, d } = c;
    if (!s.bench[slot]) return completeBuy(s, idx, d, { bench: slot });
    if (completesMerge(s, id)) return completeBuy(s, idx, d, null, s.bench[slot].id === id ? s.bench[slot].uid : null);
    return fail('That bench slot is taken.');
  }

  // Double-click purchase: completes a merge if it can, otherwise takes the first free board cell,
  // otherwise the first free bench slot.
  function buyAuto(s, idx) {
    const c = checkBuy(s, idx);
    if (c.err) return c.err;
    const { id, d } = c;
    if (completesMerge(s, id)) return completeBuy(s, idx, d, null, null);
    for (let cell = 0; cell < CELLS; cell++) {
      const left = findPlacement(s.board, d.w, cell);
      if (left >= 0) return completeBuy(s, idx, d, { board: left });
    }
    const slot = s.bench.indexOf(null);
    if (slot >= 0) return completeBuy(s, idx, d, { bench: slot });
    return fail('Your board and bench are full. Sell a unit first.');
  }

  // -------------------------------------------------------- moving and selling
  // zone is 'board' (index = cell) or 'bench' (index = slot).
  function moveUnit(s, uid, zone, index) {
    if (s.phase !== 'shop') return fail('You can only rearrange between fights.');
    const at = locate(s, uid);
    if (!at) return fail('No such unit.');
    const u = at.unit;
    const d = BY_ID[u.id];

    if (zone === 'bench') {
      const other = s.bench[index];
      if (other === u) return ok();
      if (!other) {
        removeUnit(s, u);
        delete u.cell;
        s.bench[index] = u;
        return ok();
      }
      if (at.zone === 'bench') { s.bench[at.slot] = other; s.bench[index] = u; return ok('Swapped.'); }
      // A board unit and a bench unit trade places if the bench unit fits where the board unit stood.
      const rest = s.board.filter(x => x !== u);
      const left = findPlacement(rest, BY_ID[other.id].w, u.cell, []);
      if (left < 0) return fail(BY_ID[other.id].name + ' does not fit there.');
      s.board = rest;
      other.cell = left;
      s.board.push(other);
      delete u.cell;
      s.bench[index] = u;
      return ok('Swapped.');
    }

    // The target is a board cell.
    const target = unitAt(s.board, index);
    if (target === u) return ok();
    if (at.zone === 'bench') {
      if (!target) {
        const left = findPlacement(s.board, d.w, index);
        if (left < 0) return fail(d.w === 2 ? d.name + ' needs 2 free cells side by side.' : 'No room there.');
        s.bench[at.slot] = null;
        u.cell = left;
        s.board.push(u);
        return ok();
      }
      const rest = s.board.filter(x => x !== target);
      const left = findPlacement(rest, d.w, index, []);
      if (left < 0 && d.w === 2) return dropSiege(s, u, at.slot, index);
      if (left < 0) return fail('They do not fit there.');
      s.board = rest;
      delete target.cell;
      s.bench[at.slot] = target;
      u.cell = left;
      s.board.push(u);
      return ok('Swapped.');
    }
    // Board to board: move, or swap if both still fit afterwards.
    if (target) {
      const ignore = [u.uid, target.uid];
      const oldCell = u.cell;
      const a = findPlacement(s.board, d.w, index, ignore);
      if (a < 0) return fail('They do not fit there.');
      const tmp = { uid: u.uid, id: u.id, cell: a };
      const rest = s.board.filter(x => x !== u && x !== target);
      const bLeft = findPlacement(rest.concat([tmp]), BY_ID[target.id].w, oldCell, []);
      if (bLeft < 0) return fail('They do not fit there.');
      u.cell = a; target.cell = bLeft;
      return ok('Swapped.');
    }
    const left = findPlacement(s.board, d.w, index, [u.uid]);
    if (left < 0) return fail(d.w === 2 ? d.name + ' needs 2 free cells side by side.' : 'No room there.');
    u.cell = left;
    return ok();
  }

  // A 2-cell unit (old Siege Engine) dragged from the bench onto taken cells sends every unit in its way to the bench.
  // Dormant: no unit in DEFS is 2 cells wide any more. Kept so a 2-cell unit can be added back without engine work.
  function dropSiege(s, u, fromSlot, index) {

    const free = [fromSlot].concat(s.bench.map((x, i) => (x ? -1 : i)).filter(i => i >= 0));

      const blockers = [];
      cellsOf(left, 2).forEach(c => { const o = unitAt(s.board, c); if (o && !blockers.includes(o)) blockers.push(o); });

      s.bench[fromSlot] = null;
      blockers.forEach((b, i) => { s.board = s.board.filter(x => x !== b); delete b.cell; s.bench[free[i]] = b; });

    const gold = sellValue(at.unit);

    removeUnit(s, at.unit);
    return ok('Sold ' + BY_ID[at.unit.id].name + ' for ' + gold + ' gold.');

    s.battle = createBattle(s.board.map(toSlot), s.enemy.slots, s.round);

    allUnits(s).forEach(u => { if (u.id === 'militiaman' && (u.level >= 2 || onBoard(s, u))) u.grow = Math.min(MILITIA_CAP, (u.grow || 0) + 1); });

    const units = {};
    team.units.forEach(u => {
      const p = u.def.kind === 'heal'
        ? { heal: healValue(u, side), interval: u.interval, speed: u.speed, level: u.level }
        : { atk: atkValue(u, side, 0), interval: u.interval, speed: u.speed, level: u.level };

      units[u.uid] = p;

    // fullRace: the race of a full mono board (all 6 cells, one race), for the "full board" bonus of the mono payoff units.
    const fullRace = RACES.find(r => team.full(r)) || null;
    return { units, shield: team.shield, diff: team.diff, count: team.count, fullRace,
      foeSlow: Math.min(SLOW_CAP, team.foeSlow), foeDelay: Math.min(DELAY_CAP, team.foeDelay), hexes: team.hexes.slice() };
  }

  const api = {

/*
 * Warbands title screen: a pixel-art dusk scene drawn with code (no image files).
 * Sky, sun, clouds, far mountains with a castle, hills with pine trees, two flapping banners, embers and mist.
 * The scene is drawn on a small 320x180 canvas and scaled up with hard edges (image-rendering: pixelated).

      rect(sx + 1, gy - 46 + fl, 6, 3, '#e8b84a');           // pennant
      const lit = (x, y) => rect(sx + x, gy + y, 2, 3, '#ffd27a');
      lit(-4, -30, 0); lit(2, -30, 1.5); lit(-20, -20, 3); lit(18, -20, 4.5); lit(-4, -10, 2); lit(2, -10, 5);
    }
  }
  function drawTrees(list, scroll, top, color, light) {
    list.forEach(tr => {
      for (const off of [0, -LAYER_W]) {
        const sx = Math.round(tr.x + off - scroll);
        if (sx < -10 || sx > W + 10) continue;
        const gy = Math.round(top(mod(tr.x, LAYER_W))) + 2;
        const h = tr.h, w = Math.max(5, Math.round(h * 0.5));
        rect(sx - 1, gy - 3, 2, 4, '#1a1030');                // trunk
        for (let i = 0; i < 4; i++) {                          // stacked triangles
          const lh = Math.round(h / 4) + 2, ww = Math.round(w * (1 - i * 0.18)) | 1;
          rect(sx - (ww >> 1), gy - 3 - (i + 1) * Math.round(h / 4.5), ww, lh, color);
          rect(sx - (ww >> 1), gy - 3 - (i + 1) * Math.round(h / 4.5), 1, lh, light);
        }
        rect(sx - 1, gy - 3 - h, 2, 3, color);
      }
    });
  }
  function drawBanner(px, race, dir, t) {
    const [main, dark] = RACE[race];
    const top = 94;
    rect(px - 1, top - 4, 3, 84, '#4a2f1c'); rect(px, top - 4, 1, 84, '#6b4528');        // pole
    rect(px - 3, top - 6, 7, 3, '#e8b84a');                                              // finial
    const cw = 20, ch = 38, notch = 9;
    const phase = dir > 0 ? 0 : 1.7;
    const swayAt = () => 0;
    for (let r = 0; r < ch; r++) {
      const x0 = px + (dir > 0 ? 2 : -2 - cw) + Math.round(swayAt(r)) * dir;
      const c = r < 3 ? '#e8b84a' : (r % 7 === 6 ? dark : main);
      if (r < ch - notch) rect(x0, top + r, cw, 1, c);
      else {                                                  // swallow tail: two legs with a growing gap
        const g = (r - (ch - notch) + 1) * 2, leg = (cw - g) >> 1;
        rect(x0, top + r, Math.max(1, leg), 1, c);
        rect(x0 + cw - Math.max(1, leg), top + r, Math.max(1, leg), 1, c);
      }
      if (r > 4 && r < ch - notch) { rect(x0 + 1, top + r, 1, 1, dark); rect(x0 + cw - 2, top + r, 1, 1, dark); }
    }
    // little crest: a gold diamond
    const mx = px + (dir > 0 ? 2 : -2 - cw) + (cw >> 1) + Math.round(swayAt(17)) * dir;
    for (let i = -4; i <= 4; i++) rect(mx - (4 - Math.abs(i)), top + 17 + i, (4 - Math.abs(i)) * 2 + 1, 1, '#ffe08a');
  }
  function drawEmbers(t) {
    const cols = ['#ffb347', '#ff7a3d', '#ffe08a'];
    embers.forEach(e => {
      const y = mod(e.y - t * e.v, H + 20) - 10, x = e.x + Math.sin(t * 0.9 + e.p) * 7;
      if (Math.sin(t * 5 + e.p * 3) < -0.7) return;           // flicker
      rect(x, y, e.big ? 2 : 1, e.big ? 2 : 1, cols[e.c]);
    });
  }
  function drawMist(t) {
    for (let k = 0; k < 3; k++) {
      const y0 = 140 + k * 8, a = 0.045 + k * 0.02;
      for (let x = 0; x < W; x += 4) {
        const wob = Math.sin(x * 0.025 + k * 2) * 2;
        rect(x, y0 + wob, 4, 5, 'rgba(255,214,225,' + a + ')');
      }
    }
  }

  // ------------------------------------------------------------ frame
  function frame(t) {
    drawSky(t);
    drawSun();
    drawClouds(t);
    drawHills(farTop, '#7a4f86', '#9a6a9c', 0);
    drawCastle(0, t);
    drawHills(midTop, '#4d3568', '#6a4a80', 0);
    drawTrees(trees, 0, midTop, '#3a2858', '#4a3470');
    drawHills(nearTop, '#2a1d44', '#3c2a5c', 0);
    drawTrees(trees2, 0, nearTop, '#1d1432', '#2c2048');
    rect(0, 168, W, 12, '#150e24');                           // dark ground behind the menu
    rect(0, 167, W, 1, '#2a1d44');
    drawMist(t);
    drawBanner(34, left, 1, t);
    drawBanner(W - 34, right, -1, t);
    drawEmbers(t);
  }

  // ------------------------------------------------------------ loop: only runs while the menu is on screen
  let running = false, t0 = 0, last = 0;
  const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function tick(now) {
    const menu = document.getElementById('menu');
    if (!menu || menu.classList.contains('hidden')) { running = false; return; }
    if (now - last >= 33) { last = now; frame((now - t0) / 1000); }   // about 30 frames per second
    requestAnimationFrame(tick);
  }
  window.TitleScene = {
    start() {
      if (still) { frame(3); return; }
      if (running) return;
      running = true; t0 = performance.now() - 3000; last = 0;
      requestAnimationFrame(tick);
    },
  };
  frame(3);
})();
